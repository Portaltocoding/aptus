# Dimensión: comportamental-star — 50 preguntas. Curadas.
# type: concepto|diagrama|escenario. difficulty incl. experto (señales staff). source: externa (marco universal).

- id: star-001
  dimension: comportamental-star
  subtopic: metodo-star
  difficulty: easy
  roles:
    - Cualquiera
  stem: En el contexto de entrevistas comportamentales, ¿qué significa el acrónimo
    STAR?
  options:
    - id: d
      text: Story, Tone, Approach, Reaction
      rationale: "Historia, tono, enfoque y reacción: cómo se cuenta y cómo se reacciona."
    - id: c
      text: Skill, Talent, Attitude, Reward
      rationale: "Habilidad, talento, actitud y recompensa: lo que se busca en un candidato."
    - id: b
      text: Strategy, Timing, Analysis, Review
      rationale: "Estrategia, tiempos, análisis y revisión: las fases de resolver un problema."
    - id: a
      text: Situation, Task, Action, Result
      rationale: "Situación, tarea, acción y resultado: contexto, qué tocaba, qué hiciste y qué salió."
  correct: a
  explanation: STAR estructura una respuesta comportamental en Situación
    (contexto), Tarea (tu responsabilidad/objetivo), Acción (lo que hiciste tú)
    y Resultado (el desenlace, idealmente medible). Da orden y evita divagar.
  source: externa
  date: 2026-07-14
- id: star-002
  dimension: comportamental-star
  subtopic: resultado
  difficulty: medium
  roles:
    - Cualquiera
  stem: Al contar el 'Result' de una respuesta STAR, ¿qué la hace más convincente?
  options:
    - id: d
      text: Atribuir el resultado al equipo sin decir tu parte
      rationale: "Atribuirlo al equipo, que es lo que demuestra que sabes trabajar con otros."
    - id: c
      text: Terminar en la Acción y no mencionar el resultado
      rationale: "Cerrar en la acción y dejar que el resultado se sobreentienda."
    - id: a
      text: Cuantificar el impacto siempre que se pueda (p. ej. 'reduje la latencia un
        40%') y añadir qué aprendiste
      rationale: "Poner cifras siempre que se pueda y añadir qué aprendiste."
    - id: b
      text: Dejarlo vago para no comprometerse con cifras
      rationale: "Dejarlo en general, sin cifras que luego haya que justificar."
  correct: a
  explanation: Un Result con métricas concretas demuestra impacto real y
    credibilidad, mucho más que afirmaciones genéricas. Añadir el aprendizaje
    muestra reflexión. Omitir el resultado deja la historia sin cierre y sin
    evidencia de que funcionó.
  source: externa
  date: 2026-07-14
- id: star-003
  dimension: comportamental-star
  subtopic: errores-comunes
  difficulty: medium
  roles:
    - Cualquiera
  stem: ¿Cuál es un error frecuente al responder con STAR que conviene evitar?
  options:
    - id: b
      text: Explicar la Acción con detalle
      rationale: "Contar la acción con demasiado detalle técnico para quien no conoce el sistema."
    - id: a
      text: Dedicar demasiado tiempo a la Situación y quedarse sin contar la Acción y
        el Resultado
      rationale: "Gastar el tiempo en el contexto y quedarse sin contar qué hiciste y qué salió."
    - id: c
      text: Cuantificar el Resultado
      rationale: "Poner cifras al resultado, que suena a querer impresionar."
    - id: d
      text: Elegir una historia relevante para el rol
      rationale: "Elegir una historia demasiado pegada al puesto y que parezca preparada."
  correct: a
  explanation: "Un fallo típico es sobre-explicar el contexto (Situación/Tarea) y
    llegar con el tiempo agotado a lo que de verdad evalúa el entrevistador: qué
    hiciste TÚ (Acción) y qué conseguiste (Resultado). El contexto debe ser
    breve y suficiente."
  source: externa
  date: 2026-07-14
- id: star-004
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: medium
  roles:
    - Cualquiera
  stem: Ante 'háblame de un conflicto con un compañero', ¿qué enfoque transmite
    mejor señal?
  options:
    - id: b
      text: Demostrar que la otra persona estaba equivocada y tú tenías razón
      rationale: "Dejar claro quién tenía razón, que es lo que demuestra criterio técnico."
    - id: c
      text: Decir que nunca has tenido conflictos
      rationale: "Decir que no has tenido conflictos, señal de que te llevas bien con todos."
    - id: d
      text: Describir el conflicto sin contar cómo se resolvió
      rationale: "Describir el conflicto y dejar el desenlace fuera, que es lo delicado."
    - id: a
      text: Centrarse en cómo entendiste la otra postura, qué hiciste para resolverlo
        y qué aprendiste, sin culpabilizar
      rationale: "Contar cómo entendiste la otra postura, qué hiciste para resolverlo y qué aprendiste, sin culpar."
  correct: a
  explanation: "El entrevistador busca madurez y colaboración: empatía con la otra
    postura, acciones concretas para resolver y aprendizaje. Echar culpas o
    negar todo conflicto (poco creíble) resta; quedarse sin resolución deja la
    señal incompleta."
  source: externa
  date: 2026-07-14
- id: star-005
  dimension: comportamental-star
  subtopic: yo-vs-nosotros
  difficulty: medium
  roles:
    - Cualquiera
  stem: En una respuesta comportamental, ¿por qué importa usar 'yo' al describir
    la Acción, aunque fuera un trabajo de equipo?
  options:
    - id: a
      text: Porque el entrevistador evalúa tu contribución individual; 'nosotros'
        constante difumina qué hiciste tú realmente
      rationale: "Porque se evalúa tu contribución: hablar siempre en plural difumina qué hiciste tú."
    - id: c
      text: Porque el 'yo' hace la historia más corta
      rationale: "Porque hablar en primera persona acorta la historia y va más al grano."
    - id: b
      text: Porque hablar en plural está prohibido en entrevistas
      rationale: "Porque el plural se considera poco profesional en una entrevista."
    - id: d
      text: No importa, da igual el pronombre
      rationale: "No importa: lo que se juzga es la historia, no cómo se cuenta."
  correct: a
  explanation: Reconocer al equipo está bien, pero la evaluación es de TU aporte.
    Si todo es 'nosotros', el entrevistador no puede distinguir tu contribución.
    Conviene ser claro en el 'yo' de la Acción sin negar el contexto
    colaborativo.
  source: externa
  date: 2026-07-14
- id: star-006
  dimension: comportamental-star
  subtopic: fracaso
  difficulty: medium
  roles:
    - Cualquiera
  stem: Cuando preguntan por un fracaso o error propio, ¿qué señal busca sobre
    todo el entrevistador?
  options:
    - id: b
      text: Que nunca fallas
      rationale: "Que tienes un historial sin fallos serios en lo que llevas trabajando."
    - id: c
      text: Un fracaso tan pequeño que no cuente como fracaso
      rationale: "Un fallo menor, que enseña honestidad sin poner en duda tu criterio."
    - id: d
      text: Que la culpa fue de causas externas
      rationale: "Que sabes identificar las causas externas que hicieron inevitable el fallo."
    - id: a
      text: Que asumes responsabilidad (ownership) y muestras qué aprendiste y qué
        cambiaste después
      rationale: "Que asumes la responsabilidad y muestras qué aprendiste y qué cambiaste después."
  correct: a
  explanation: "La pregunta de fracaso mide autoconciencia y crecimiento:
    reconocer el error, tu parte en él, y qué aprendiste/cambiaste. Negar fallos
    o culpar al entorno transmite falta de reflexión; un 'fracaso' trivial evade
    la pregunta."
  source: externa
  date: 2026-07-14
- id: star-007
  dimension: comportamental-star
  subtopic: metodo-star
  difficulty: hard
  roles:
    - Cualquiera
  stem: En STAR, ¿qué distingue la 'Task' de la 'Action'?
  options:
    - id: b
      text: Son lo mismo con distinto nombre
      rationale: "Son la misma parte, desdoblada para que la estructura tenga cuatro letras."
    - id: d
      text: La Action ocurre antes que la Task
      rationale: "Lo que hiciste viene antes de que se defina lo que había que lograr."
    - id: c
      text: La Task es el resultado final y la Action es el contexto
      rationale: "Una es el desenlace y la otra el contexto en que ocurrió."
    - id: a
      text: La Task es el objetivo o responsabilidad que te tocaba (el qué había que
        lograr); la Action es lo que concretamente hiciste tú para lograrlo (el
        cómo)
      rationale: "Una es el objetivo que te tocaba; la otra, lo que concretamente hiciste tú para lograrlo."
  correct: a
  explanation: Task define el reto/objetivo del que eras responsable en esa
    situación; Action detalla los pasos concretos que TÚ tomaste. Confundirlas
    hace que la respuesta salte del contexto al resultado sin dejar claro tu
    papel activo.
  source: externa
  date: 2026-07-14
- id: star-008
  dimension: comportamental-star
  subtopic: debilidades
  difficulty: medium
  roles:
    - Cualquiera
  stem: Ante '¿cuál es tu mayor debilidad?', ¿qué respuesta es más sólida?
  options:
    - id: c
      text: "'No tengo debilidades'"
      rationale: "Decir que no tienes ninguna, que transmite seguridad en tus capacidades."
    - id: d
      text: Una debilidad crítica para el puesto sin plan de mejora
      rationale: "Una que afecte de lleno al puesto, que demuestra sinceridad total."
    - id: a
      text: Una debilidad real y concreta acompañada de lo que estás haciendo
        activamente para mejorarla
      rationale: "Una real y concreta, con lo que estás haciendo para mejorarla."
    - id: b
      text: "'Soy demasiado perfeccionista' u otra fortaleza disfrazada"
      rationale: "Una fortaleza disfrazada, que cumple con la pregunta sin dar munición."
  correct: a
  explanation: La respuesta fuerte es honesta y muestra autoconciencia más acción
    de mejora. Las 'fortalezas disfrazadas' suenan a cliché y no engañan; negar
    debilidades resta credibilidad; y elegir una que inhabilite para el rol se
    dispara en el pie.
  source: externa
  date: 2026-07-14
- id: star-009
  dimension: comportamental-star
  subtopic: liderazgo
  difficulty: medium
  roles:
    - Cualquiera
    - Tech Lead
  stem: Piden un ejemplo de 'liderazgo sin autoridad formal'. ¿Qué historia encaja
    mejor?
  options:
    - id: a
      text: Una en la que alineaste a compañeros hacia una decisión mediante datos,
        contexto y persuasión, sin ser su jefe
      rationale: "Una donde alineaste a compañeros con datos, contexto y persuasión sin ser su jefe."
    - id: b
      text: Una en la que diste órdenes porque eras el manager
      rationale: "Una donde diste instrucciones al equipo que dependía de ti."
    - id: c
      text: Una en la que trabajaste solo sin implicar a nadie
      rationale: "Una donde sacaste el trabajo adelante tú solo sin depender de nadie."
    - id: d
      text: Una en la que impusiste tu criterio ignorando al equipo
      rationale: "Una donde mantuviste tu criterio pese a la oposición del equipo."
  correct: a
  explanation: Liderazgo sin autoridad significa influir por credibilidad, datos y
    comunicación, no por jerarquía. La historia ideal muestra cómo lograste
    alineamiento y acción de otros sobre los que no tenías poder formal.
  source: externa
  date: 2026-07-14
- id: star-010
  dimension: comportamental-star
  subtopic: motivacion
  difficulty: easy
  roles:
    - Cualquiera
  stem: Ante '¿por qué dejaste tu anterior trabajo?', ¿cuál es el mejor enfoque?
  options:
    - id: b
      text: Despotricar en detalle sobre tu antiguo jefe
      rationale: "Contar con detalle lo que no funcionaba, que demuestra criterio y franqueza."
    - id: c
      text: Decir que solo te interesa el dinero
      rationale: "Decir que buscas mejorar condiciones, que es la razón más habitual."
    - id: a
      text: Enmarcarlo en positivo, hacia lo que buscas (crecimiento, reto, encaje),
        sin criticar duramente a tu empresa anterior
      rationale: "Enmarcarlo hacia lo que buscas —crecimiento, reto, encaje— sin cargar contra la empresa anterior."
    - id: d
      text: Evitar la pregunta cambiando de tema
      rationale: "Esquivarla y llevar la conversación a lo que sí quieres contar."
  correct: a
  explanation: "Un buen framing es prospectivo y positivo: qué buscas en el
    siguiente paso, no un ajuste de cuentas. Hablar mal del empleador anterior
    transmite riesgo de que hagas lo mismo con el próximo; evadir la pregunta
    genera desconfianza."
  source: externa
  date: 2026-07-14
- id: star-011
  dimension: comportamental-star
  subtopic: preparacion
  difficulty: medium
  roles:
    - Cualquiera
  stem: Al preparar historias comportamentales para una entrevista, ¿qué
    estrategia rinde más?
  options:
    - id: a
      text: Tener unas pocas historias versátiles y bien estructuradas que puedas
        adaptar a varias preguntas (conflicto, liderazgo, fracaso, impacto)
      rationale: "Pocas historias versátiles y bien estructuradas que se adapten a varias preguntas."
    - id: b
      text: Memorizar una respuesta literal distinta para cada posible pregunta
      rationale: "Una respuesta memorizada para cada pregunta posible, para no dudar."
    - id: c
      text: Improvisar todo sin preparar nada
      rationale: "Improvisar: lo espontáneo suena más natural que lo ensayado."
    - id: d
      text: Preparar una única historia para todo
      rationale: "Una única historia muy buena que sirva para todo lo que pregunten."
  correct: a
  explanation: Un puñado de historias sólidas y reutilizables (cada una con
    Situación/Tarea/Acción/Resultado claros) cubre muchas preguntas si sabes
    reencuadrarlas según lo que se pide. Memorizar guiones literales suena
    rígido; no preparar nada arriesga divagar.
  source: externa
  date: 2026-07-14
- id: star-012
  dimension: comportamental-star
  subtopic: impacto
  difficulty: easy
  roles:
    - Cualquiera
  stem: ¿Por qué conviene cerrar una respuesta comportamental con el impacto
    medible de tus acciones?
  options:
    - id: c
      text: Porque los entrevistadores solo escuchan el final
      rationale: "Porque el final es lo que se recuerda de una respuesta larga."
    - id: d
      text: Porque evita tener que explicar la acción
      rationale: "Porque con el impacto claro no hace falta detallar qué hiciste."
    - id: a
      text: Porque las cifras concretas hacen la historia creíble y memorable, y
        demuestran que tu acción produjo un resultado real
      rationale: "Porque las cifras concretas hacen la historia creíble y demuestran que tu acción produjo algo."
    - id: b
      text: Porque alarga la respuesta
      rationale: "Porque da cuerpo a la respuesta y evita que quede demasiado corta."
  correct: a
  explanation: Cerrar con impacto medible (métricas, ahorro, mejora, adopción)
    ancla la historia en evidencia y la hace memorable. Sin resultado tangible,
    incluso una buena acción queda como una anécdota sin prueba de que sirvió.
  source: externa
  date: 2026-07-14
- id: star-013
  dimension: comportamental-star
  subtopic: resultado
  difficulty: medium
  type: escenario
  roles:
    - Cualquiera
  stem: |-
    Respuesta de un candidato:

      "Había un bug en producción (S). Yo era responsable de arreglarlo (T).
       Revisé los logs, encontré la causa raíz y desplegué un fix (A)."

    ¿Qué le falta a esta respuesta STAR?
  options:
    - id: c
      text: La Tarea (T)
      rationale: "La tarea: no se dice qué se esperaba concretamente de él."
    - id: a
      text: "El Resultado (R): el desenlace/impacto, idealmente cuantificado"
      rationale: "El resultado: no se cuenta el desenlace ni su impacto, idealmente con cifras."
    - id: b
      text: La Situación (S)
      rationale: "La situación: falta el contexto en el que ocurrió el problema."
    - id: d
      text: Nada, está completa
      rationale: "Nada: las cuatro partes están presentes en el relato."
  correct: a
  explanation: "Cubre Situación, Tarea y Acción, pero corta antes del Resultado:
    cuánto bajó el downtime, qué impacto tuvo, qué se aprendió. Sin la R no
    demuestra que la acción funcionó."
  source: externa
  date: 2026-07-14
- id: star-014
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: medium
  type: escenario
  roles:
    - Cualquiera
  stem: "'Cuéntame una vez que discrepaste con tu manager.' ¿Qué enfoque da mejor
    señal?"
  options:
    - id: d
      text: Dices que nunca has discrepado con un superior
      rationale: "Decir que nunca has discrepado, señal de que sabes trabajar con quien te dirige."
    - id: b
      text: Cediste enseguida para evitar el conflicto
      rationale: "Ceder rápido, que es lo que mantiene al equipo avanzando."
    - id: c
      text: Fuiste por encima de tu manager a su jefe
      rationale: "Llevarlo a su superior, que es quien puede resolver el desacuerdo."
    - id: a
      text: Expusiste tu punto con datos, escuchaste el suyo, y cuentas cómo se
        decidió y qué resultó
      rationale: "Exponer tu punto con datos, escuchar el suyo, y contar cómo se decidió y qué salió."
  correct: a
  explanation: "Buscan criterio y madurez: argumentar con datos, escuchar la otra
    postura y llegar a una decisión (aunque no sea la tuya) con un resultado.
    Ceder siempre, saltarse la jerarquía o negar toda discrepancia dan mala
    señal."
  source: externa
  date: 2026-07-14
- id: star-015
  dimension: comportamental-star
  subtopic: presentacion
  difficulty: easy
  type: concepto
  roles: &a1
    - Cualquiera
  stem: Ante 'háblame de ti', ¿qué estructura funciona mejor?
  options:
    - id: b
      text: Tu biografía completa desde el colegio
      rationale: "Un repaso cronológico completo, para que se entienda de dónde vienes."
    - id: a
      text: "Breve y orientada al puesto: presente (qué haces) → pasado relevante →
        por qué encajas aquí"
      rationale: "Breve y orientada al puesto: qué haces ahora, lo relevante de antes y por qué encajas."
    - id: c
      text: Solo hobbies
      rationale: "Lo personal, que es lo que diferencia de otros candidatos con perfil parecido."
    - id: d
      text: Una lista de tecnologías sin contexto
      rationale: "El listado de tecnologías, que es lo que se está evaluando."
  correct: a
  explanation: "El pitch debe ser conciso y relevante: quién eres profesionalmente
    hoy, un par de hitos relevantes y por qué este rol; no una autobiografía
    cronológica."
  source: externa
  date: 2026-07-14
- id: star-016
  dimension: comportamental-star
  subtopic: resultado
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Tu logro no tiene una métrica dura clara. ¿Cómo cuentas el Resultado sin
    inventar cifras?
  options:
    - id: d
      text: Decir que fue 'un éxito' sin más
      rationale: "Decir que salió bien y pasar al siguiente punto sin detenerse."
    - id: a
      text: Con impacto cualitativo concreto y proxies honestos ('desbloqueó al
        equipo', 'se adoptó en 3 equipos', estimaciones razonadas)
      rationale: "Con impacto cualitativo concreto y aproximaciones honestas: a quién desbloqueó o dónde se adoptó."
    - id: b
      text: Inventarte un porcentaje que suene bien
      rationale: "Poner una cifra plausible, que es lo que se espera oír."
    - id: c
      text: Omitir el resultado
      rationale: "Dejar el resultado fuera y cerrar con lo que hiciste."
  correct: a
  explanation: Si no hay número exacto, se usa impacto cualitativo verificable o
    una estimación razonada y honesta (tiempo ahorrado, adopción, desbloqueo).
    Inventar cifras es arriesgado; no dar resultado deja la historia coja.
  source: externa
  date: 2026-07-14
- id: star-017
  dimension: comportamental-star
  subtopic: comunicacion
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué es 'signposting' al responder y por qué ayuda?
  options:
    - id: a
      text: Anunciar la estructura ('primero el contexto, luego lo que hice y el
        resultado'), para que el entrevistador te siga y no divagues
      rationale: "Anunciar la estructura antes de entrar, para que te sigan y no divagues."
    - id: c
      text: Usar tecnicismos
      rationale: "Usar el vocabulario del sector para demostrar dominio de la materia."
    - id: d
      text: Evitar responder
      rationale: "Ganar tiempo antes de entrar en una respuesta que no tienes preparada."
    - id: b
      text: Hablar más rápido
      rationale: "Ir al grano rápido para que quepan más ejemplos en la entrevista."
  correct: a
  explanation: Señalizar la estructura ordena tu respuesta y guía al oyente;
    reduce la divagación y hace la historia fácil de seguir, especialmente en
    STAR.
  source: externa
  date: 2026-07-14
- id: star-018
  dimension: comportamental-star
  subtopic: logros
  difficulty: medium
  type: escenario
  roles: *a1
  stem: "'Cuéntame tu mayor logro.' ¿Qué historia eliges?"
  options:
    - id: c
      text: Un logro de equipo donde apenas participaste
      rationale: "Un logro colectivo importante, que enseña con qué nivel de equipo has trabajado."
    - id: a
      text: Una relevante para el rol, donde tu contribución sea clara y el impacto
        medible o tangible
      rationale: "Una relevante para el rol, con tu contribución clara y un impacto medible o tangible."
    - id: d
      text: Algo impresionante pero irrelevante para el puesto
      rationale: "Algo llamativo aunque no venga a cuento: se recuerda mejor que lo previsible."
    - id: b
      text: La más antigua que recuerdes
      rationale: "El más antiguo, que ya has contado muchas veces y sale redondo."
  correct: a
  explanation: Un buen logro es relevante al rol, deja claro qué hiciste TÚ y
    tiene un resultado tangible. Impresionar con algo irrelevante o atribuirte
    méritos ajenos resta credibilidad.
  source: externa
  date: 2026-07-14
- id: star-019
  dimension: comportamental-star
  subtopic: ambiguedad
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Te dan un problema mal definido. ¿Qué demuestra buen criterio?
  options:
    - id: c
      text: Empezar a programar sin entender el objetivo
      rationale: "Empezar cuanto antes: con algo en la pantalla se aclara mejor lo que hace falta."
    - id: a
      text: Clarificar objetivos y restricciones, hacer explícitas tus asunciones y
        avanzar en iteraciones en vez de bloquearte
      rationale: "Clarificar objetivos y restricciones, dejar explícitas las asunciones y avanzar en iteraciones."
    - id: b
      text: Esperar a que te lo den todo perfectamente definido
      rationale: "Esperar a que llegue bien definido, que es responsabilidad de quien lo pide."
    - id: d
      text: Quejarte de la falta de especificación
      rationale: "Señalar la falta de definición para que no se repita en el siguiente encargo."
  correct: a
  explanation: Ante ambigüedad, los buenos ingenieros acotan (preguntas,
    asunciones explícitas), priorizan y avanzan iterando. Ni parálisis por falta
    de spec ni lanzarse a ciegas.
  source: externa
  date: 2026-07-14
- id: star-020
  dimension: comportamental-star
  subtopic: prioridades
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Tres personas te piden cosas 'urgentes' a la vez. ¿Qué enfoque cuenta mejor?
  options:
    - id: c
      text: Intentar todo a la vez y no acabar nada
      rationale: "Avanzar en las tres a la vez para que nadie se quede esperando."
    - id: a
      text: Priorizar por impacto/dependencias, alinear expectativas comunicando qué
        harás y cuándo, y negociar plazos con datos
      rationale: "Priorizar por impacto y dependencias, decir qué harás y cuándo, y negociar plazos con datos."
    - id: b
      text: Hacerlas por orden de quien grita más
      rationale: "Atender primero a quien más aprieta, que suele ser lo más urgente de verdad."
    - id: d
      text: Ignorar dos y no avisar
      rationale: "Sacar la más importante y dejar las otras para cuando haya hueco."
  correct: a
  explanation: Se prioriza por impacto y dependencias, y se gestionan expectativas
    de forma transparente (qué, cuándo, por qué). La señal es criterio y
    comunicación, no heroísmo desorganizado.
  source: externa
  date: 2026-07-14
- id: star-021
  dimension: comportamental-star
  subtopic: colaboracion
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Un compañero (no tu subordinado) no entrega y bloquea al equipo. ¿Qué
    haces primero?
  options:
    - id: c
      text: Hacer tú su trabajo en silencio para siempre
      rationale: "Cubrirlo sin decir nada, que es lo que mantiene al equipo avanzando."
    - id: a
      text: Hablarlo con él en privado, entender la causa y ofrecer ayuda; si
        persiste, escalar de forma constructiva con datos
      rationale: "Hablarlo en privado, entender la causa y ofrecer ayuda; si sigue, escalar con datos."
    - id: b
      text: Criticarlo en público
      rationale: "Sacarlo en la reunión de equipo, donde todos ven el bloqueo."
    - id: d
      text: Ignorarlo y que reviente
      rationale: "Dejar que el bloqueo se note para que se resuelva por sí solo."
  correct: a
  explanation: Sin autoridad formal, primero se aborda directo y con empatía
    (causa, ayuda). Si no mejora y afecta al equipo, se escala con hechos, no
    con quejas. Ni humillar ni tapar indefinidamente.
  source: externa
  date: 2026-07-14
- id: star-022
  dimension: comportamental-star
  subtopic: feedback
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Al recibir feedback crítico en una review, ¿qué señal es positiva?
  options:
    - id: a
      text: Escuchar sin ponerte a la defensiva, pedir ejemplos concretos y actuar
        sobre ello
      rationale: "Escuchar sin defenderse, pedir ejemplos concretos y actuar sobre ellos."
    - id: d
      text: Tomártelo como algo personal
      rationale: "Tomárselo en serio a nivel personal, que es lo que hace que cambies."
    - id: b
      text: Justificarte y rebatir cada punto
      rationale: "Responder a cada punto para dejar claro el contexto que faltaba."
    - id: c
      text: Ignorarlo
      rationale: "Dejarlo estar: en una revisión siempre se dicen cosas que no aplican."
  correct: a
  explanation: "Buena recepción de feedback: escuchar, buscar entender con
    ejemplos y convertirlo en acción. Ponerse a la defensiva o ignorarlo señala
    poca capacidad de crecer."
  source: externa
  date: 2026-07-14
- id: star-023
  dimension: comportamental-star
  subtopic: feedback
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Tienes que dar feedback difícil a un compañero. ¿Qué enfoque es más efectivo?
  options:
    - id: a
      text: En privado, específico y sobre conductas concretas y su impacto
        (situación-conducta-impacto), no sobre la persona
      rationale: "En privado, concreto y sobre conductas y su impacto, no sobre la persona."
    - id: c
      text: Vago y general para no herir
      rationale: "En general y sin detalles, para que no se lo tome como un ataque."
    - id: d
      text: Guardártelo y que siga igual
      rationale: "Guardarlo para la revisión formal, que es donde toca decir estas cosas."
    - id: b
      text: En público para que aprenda
      rationale: "Delante del equipo, para que quede claro el criterio a todos."
  correct: a
  explanation: El feedback útil es privado, concreto y descriptivo (qué conducta,
    qué impacto), orientado a mejorar, no a etiquetar a la persona. Vago no
    sirve; público humilla.
  source: externa
  date: 2026-07-14
- id: star-024
  dimension: comportamental-star
  subtopic: colaboracion
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué significa 'disagree and commit'?
  options:
    - id: a
      text: Expresar tu desacuerdo con argumentos, pero una vez tomada la decisión,
        apoyarla y ejecutarla con lealtad
      rationale: "Discrepar con argumentos y, una vez decidido, apoyar y ejecutar sin reservas."
    - id: b
      text: Estar siempre de acuerdo
      rationale: "Alinearse siempre con la decisión del grupo para no frenar el avance."
    - id: d
      text: No opinar nunca
      rationale: "Reservarse la opinión y dejar decidir a quien tiene más contexto."
    - id: c
      text: Sabotear la decisión con la que no coincides
      rationale: "Ejecutar lo decidido dejando ver que no era tu opción."
  correct: a
  explanation: "Disagree and commit: aportas tu punto de vista honestamente en el
    debate, pero si la decisión final es otra, la respaldas y ejecutas sin
    socavarla. Equilibra criterio propio con avance del equipo."
  source: externa
  date: 2026-07-14
- id: star-025
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Discrepas técnicamente con un ingeniero senior y ninguno cede. ¿Qué
    demuestra madurez?
  options:
    - id: c
      text: Ceder sin más para evitar el roce
      rationale: "Ceder ante quien tiene más experiencia, que suele acertar más veces."
    - id: d
      text: Ir por detrás a implementarlo a tu manera
      rationale: "Implementarlo a tu manera y enseñar después que funcionaba mejor."
    - id: a
      text: Fundamentar con datos/pruebas (spike, benchmark), acotar el riesgo, y si
        sigue el empate, escalar a un decisor o hacer disagree-and-commit
      rationale: "Fundamentar con datos o una prueba, acotar el riesgo y, si sigue el empate, escalar o apoyar la decisión tomada."
    - id: b
      text: Imponer tu opinión por insistencia
      rationale: "Sostener tu posición hasta que el otro se convenza."
  correct: a
  explanation: En un desacuerdo técnico, se busca objetivar (datos, prototipo,
    criterios), se acota el coste de equivocarse y, si no hay consenso, se
    escala o se compromete con la decisión. Ni imponer ni ceder por comodidad ni
    actuar por detrás.
  source: externa
  date: 2026-07-14
- id: star-026
  dimension: comportamental-star
  subtopic: responsabilidad
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Vas a incumplir un plazo importante. ¿Qué haces?
  options:
    - id: c
      text: Culpar a otros
      rationale: "Explicar qué dependencias externas han hecho imposible cumplir."
    - id: a
      text: Avisar cuanto antes con una nueva estimación y un plan de mitigación,
        asumiendo tu parte
      rationale: "Avisar cuanto antes con una estimación nueva y un plan de mitigación, asumiendo tu parte."
    - id: b
      text: Callar y esperar que no se note
      rationale: "Apretar hasta el final: muchas veces se acaba llegando."
    - id: d
      text: Avisar el mismo día del vencimiento
      rationale: "Avisar el día del vencimiento, cuando ya se sabe con certeza."
  correct: a
  explanation: Comunicar pronto y con transparencia (nuevo plazo, qué reduces,
    cómo mitigas) permite reaccionar al equipo. Ocultarlo o avisar tarde es lo
    que más daño hace.
  source: externa
  date: 2026-07-14
- id: star-027
  dimension: comportamental-star
  subtopic: prioridades
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Te piden meter más alcance del que cabe en el plazo. ¿Qué respuesta es
    sólida?
  options:
    - id: a
      text: "Explicar el trade-off (alcance vs plazo vs calidad) y proponer
        alternativas: recortar alcance, mover fecha o priorizar lo esencial"
      rationale: "Explicar el compromiso entre alcance, plazo y calidad, y proponer alternativas concretas."
    - id: d
      text: Bajar la calidad en silencio
      rationale: "Entregar todo a tiempo aunque el acabado quede por debajo de lo habitual."
    - id: b
      text: Decir que sí a todo y quemarte
      rationale: "Aceptarlo y sacarlo adelante: es lo que se espera de quien resuelve."
    - id: c
      text: Decir que no en seco sin alternativas
      rationale: "Decir que no cabe, que es la respuesta honesta ante un plazo imposible."
  correct: a
  explanation: "Saber decir 'no... pero' con criterio: exponer los trade-offs y
    ofrecer opciones. Aceptar todo lleva a fallar o a deuda técnica oculta; el
    'no' seco sin alternativas tampoco ayuda."
  source: externa
  date: 2026-07-14
- id: star-028
  dimension: comportamental-star
  subtopic: fracaso
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En una pregunta de fracaso, ¿qué refleja 'mentalidad de crecimiento'?
  options:
    - id: b
      text: Que la culpa fue del entorno
      rationale: "Explicar qué condiciones del entorno hicieron inevitable el resultado."
    - id: c
      text: Que nunca fallas
      rationale: "Que no hay fracasos serios que contar en tu trayectoria."
    - id: d
      text: Un fracaso irrelevante para no comprometerte
      rationale: "Un caso menor, que cumple la pregunta sin dar munición al entrevistador."
    - id: a
      text: Reconocer el error, extraer un aprendizaje concreto y mostrar qué
        cambiaste después
      rationale: "Reconocer el error, sacar un aprendizaje concreto y mostrar qué cambiaste después."
  correct: a
  explanation: "La growth mindset ve el fallo como aprendizaje: ownership + qué
    aprendiste + qué hiciste distinto luego. Negar fallos o culpar fuera muestra
    lo contrario."
  source: externa
  date: 2026-07-14
- id: star-029
  dimension: comportamental-star
  subtopic: iniciativa
  difficulty: medium
  type: escenario
  roles: *a1
  stem: "'Cuéntame una vez que tomaste iniciativa más allá de tu rol.' ¿Qué buscan?"
  options:
    - id: a
      text: "Ownership: viste un problema u oportunidad y actuaste (con criterio y sin
        pisar a nadie), con un resultado"
      rationale: "Responsabilidad propia: viste un problema y actuaste con criterio, con un resultado detrás."
    - id: c
      text: Que ignoraras tus tareas asignadas
      rationale: "Que priorizaste lo importante aunque lo asignado se retrasara."
    - id: b
      text: Que hicieras horas extra sin motivo
      rationale: "Que le dedicaste el tiempo que hiciera falta, más allá del horario."
    - id: d
      text: Que tomaras decisiones ajenas sin avisar
      rationale: "Que tomaste decisiones que nadie estaba tomando en ese momento."
  correct: a
  explanation: "Buscan proactividad con buen juicio: detectar algo que aportaba
    valor y moverlo, comunicando y colaborando, con un resultado. No es hacer
    más horas ni actuar por libre sin alinear."
  source: externa
  date: 2026-07-14
- id: star-030
  dimension: comportamental-star
  subtopic: producto
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué demuestra 'product sense' o empatía con el usuario en una respuesta?
  options:
    - id: c
      text: Que ignoraste al usuario para ir más rápido
      rationale: "Que priorizaste entregar a tiempo por encima de pulir la experiencia."
    - id: b
      text: Que elegiste la tecnología más nueva
      rationale: "Que elegiste la tecnología que mejor resolvía el problema técnico."
    - id: d
      text: Que construiste todo lo que pidieron sin cuestionar
      rationale: "Que entregaste exactamente lo que el usuario pidió, sin interpretar."
    - id: a
      text: Que decidiste partiendo de la necesidad real del usuario (datos,
        conversaciones), no solo de lo técnicamente elegante
      rationale: "Que decidiste partiendo de la necesidad real del usuario, y no solo de lo técnicamente elegante."
  correct: a
  explanation: "Product sense: anclar decisiones en el problema del usuario y el
    impacto, no en el capricho técnico; a veces implica cuestionar el requisito
    para resolver la necesidad de fondo."
  source: externa
  date: 2026-07-14
- id: star-031
  dimension: comportamental-star
  subtopic: datos
  difficulty: medium
  type: escenario
  roles: *a1
  stem: "'Cuéntame una decisión basada en datos.' ¿Qué historia encaja?"
  options:
    - id: c
      text: Una donde ignoraste los datos disponibles
      rationale: "Una donde los datos apuntaban a algo y la experiencia decía otra cosa."
    - id: d
      text: Una sin ningún resultado
      rationale: "Una donde el proceso de decisión estuvo bien llevado, se llegara a donde se llegara."
    - id: a
      text: Una donde una hipótesis/opinión se contrastó con datos o un experimento y
        eso cambió (o confirmó) el rumbo
      rationale: "Una donde una hipótesis se contrastó con datos o un experimento y eso cambió o confirmó el rumbo."
    - id: b
      text: Una decisión tomada por intuición pura
      rationale: "Una decisión tomada con criterio propio, que es lo que se espera de alguien con experiencia."
  correct: a
  explanation: "Buscan que uses evidencia: medir, experimentar (A/B, prototipo) y
    dejar que el dato guíe la decisión, incluso cuando contradice la intuición o
    la jerarquía."
  source: externa
  date: 2026-07-14
- id: star-032
  dimension: comportamental-star
  subtopic: presion
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Un incidente en producción con usuarios afectados. ¿Qué transmite buen
    manejo bajo presión?
  options:
    - id: b
      text: Buscar de inmediato a quién culpar
      rationale: "Localizar cuanto antes de dónde vino el cambio que lo provocó."
    - id: c
      text: Arreglarlo en silencio sin avisar a nadie
      rationale: "Resolverlo sin generar ruido y contarlo cuando ya esté controlado."
    - id: d
      text: Bloquearte hasta que se resuelva solo
      rationale: "Esperar a tener el diagnóstico completo antes de mover nada."
    - id: a
      text: Mantener la calma, priorizar mitigar el impacto, comunicar estado con
        transparencia y hacer post-mortem sin culpar personas
      rationale: "Mantener la calma, priorizar mitigar el impacto, comunicar el estado y hacer una revisión posterior sin señalar personas."
  correct: a
  explanation: "Bajo presión: mitigar primero, comunicar con claridad y, después,
    un post-mortem sin culpa (blameless) para aprender. Buscar culpables en
    caliente empeora todo."
  source: externa
  date: 2026-07-14
- id: star-033
  dimension: comportamental-star
  subtopic: motivacion
  difficulty: easy
  type: concepto
  roles: *a1
  stem: "'¿Por qué quieres este puesto/empresa?' ¿Qué respuesta convence?"
  options:
    - id: c
      text: Una genérica que valdría para cualquier empresa
      rationale: "Una respuesta sólida sobre lo que buscas, que vale para cualquier sitio."
    - id: d
      text: "'Por el sueldo y ya'"
      rationale: "Que las condiciones son mejores, que es la razón real en la mayoría de casos."
    - id: a
      text: "Una específica: conexión real entre lo que buscas/aportas y lo que hace
        esa empresa/rol (haber investigado)"
      rationale: "Una específica: conexión real entre lo que buscas y lo que hace esa empresa, con trabajo previo detrás."
    - id: b
      text: "'Porque necesito trabajo'"
      rationale: "Que estás buscando y este puesto encaja con tu perfil."
  correct: a
  explanation: "Convence lo específico y bien informado: por qué ESTA empresa/rol
    encaja con tus objetivos y qué aportas. Lo genérico sugiere que no te has
    molestado en investigar."
  source: externa
  date: 2026-07-14
- id: star-034
  dimension: comportamental-star
  subtopic: adaptabilidad
  difficulty: medium
  type: escenario
  roles: *a1
  stem: A mitad de proyecto cambian los requisitos de golpe. ¿Qué señal es buena?
  options:
    - id: a
      text: "Adaptarte con flexibilidad: entender el porqué del cambio, re-priorizar y
        comunicar el nuevo plan sin dramatizar"
      rationale: "Adaptarte: entender el porqué del cambio, repriorizar y comunicar el plan nuevo sin dramatizar."
    - id: c
      text: Quejarte de que 'siempre cambian todo'
      rationale: "Señalar que los cambios continuos tienen un coste que alguien debería asumir."
    - id: b
      text: Resistirte y seguir con lo viejo
      rationale: "Terminar lo que estaba en marcha antes de cambiar de dirección."
    - id: d
      text: Empezar de cero sin evaluar qué se reutiliza
      rationale: "Rehacerlo con los requisitos nuevos, para no arrastrar decisiones viejas."
  correct: a
  explanation: La adaptabilidad se muestra entendiendo el motivo del cambio,
    ajustando prioridades y comunicando; reaprovechando lo que sirva. Rigidez o
    queja constante son mala señal.
  source: externa
  date: 2026-07-14
- id: star-035
  dimension: comportamental-star
  subtopic: etica
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Te piden algo que consideras poco ético o que perjudica al usuario. ¿Qué
    haces?
  options:
    - id: b
      text: Hacerlo sin más porque te lo mandaron
      rationale: "Ejecutarlo: la decisión y su responsabilidad son de quien la toma."
    - id: a
      text: Plantear tu preocupación con argumentos y proponer una alternativa;
        escalar si es necesario, dejando constancia
      rationale: "Plantear la preocupación con argumentos y proponer alternativa; escalar si hace falta, dejando constancia."
    - id: c
      text: Negarte en bloque sin explicar ni proponer nada
      rationale: "Negarte con claridad, que es lo único coherente con tus principios."
    - id: d
      text: Difundirlo por redes sociales primero
      rationale: "Sacarlo fuera, que suele ser lo único que hace reaccionar."
  correct: a
  explanation: Ante un dilema, se expone la preocupación de forma profesional, se
