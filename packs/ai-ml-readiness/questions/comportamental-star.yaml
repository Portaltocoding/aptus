  date: 2026-07-14
- id: star-040
  dimension: comportamental-star
  subtopic: onboarding
  difficulty: medium
  type: escenario
  roles: *a1
  stem: "'¿Cómo te pones al día rápido en un código/equipo nuevo?' ¿Qué demuestra
    madurez?"
  options:
    - id: a
      text: Leer/ejecutar el proyecto, hacer preguntas concretas, aportar valor pronto
        en algo pequeño y documentar lo que aprendes
      rationale: "Leer y ejecutar el proyecto, preguntar cosas concretas, aportar pronto en algo pequeño y documentar lo aprendido."
    - id: c
      text: Reescribir todo a tu manera el primer día
      rationale: "Proponer los cambios que ves claros desde fuera, antes de acostumbrarte."
    - id: b
      text: Esperar semanas a que te lo expliquen todo
      rationale: "Dedicar las primeras semanas a que te lo expliquen bien antes de tocar nada."
    - id: d
      text: No preguntar para no molestar
      rationale: "Resolverlo por tu cuenta para no consumir tiempo del equipo."
  correct: a
  explanation: "Ramp-up eficaz: explorar el sistema por tu cuenta, preguntar lo
    justo y concreto, entregar pronto algo pequeño (una fix, un test) y dejar
    documentado lo aprendido. Ni pasividad ni arrasar sin entender."
  source: externa
  date: 2026-07-14
- id: star-041
  dimension: comportamental-star
  subtopic: comunicacion
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Por qué la autenticidad supera a una respuesta demasiado ensayada?
  options:
    - id: a
      text: Una historia real, con matices y aprendizaje, resulta creíble y permite
        repreguntar; un guion memorizado suena falso y se cae ante detalles
      rationale: "Una historia real, con matices y aprendizaje, aguanta las repreguntas; un guion memorizado se cae en los detalles."
    - id: c
      text: Porque mentir con soltura es mejor
      rationale: "Porque lo importante es contarlo con seguridad, venga de donde venga."
    - id: b
      text: Porque no hay que preparar nada
      rationale: "Porque preparar demasiado quita naturalidad a la conversación."
    - id: d
      text: Porque las historias reales no importan
      rationale: "Porque lo que se juzga es cómo comunicas, no qué cuentas."
  correct: a
  explanation: "Preparar sí, pero contar hechos reales: sostienen las repreguntas
    y transmiten honestidad. Un guion rígido suena impostado y se desmorona
    cuando el entrevistador profundiza."
  source: externa
  date: 2026-07-14
- id: star-042
  dimension: comportamental-star
  subtopic: liderazgo
  difficulty: hard
  type: escenario
  roles: *a1
  stem: "'Cuéntame cómo ayudaste a crecer a alguien.' ¿Qué señal de seniority
    buscan?"
  options:
    - id: b
      text: Que hicieras tú su trabajo
      rationale: "Que sacaste adelante lo que esa persona no llegaba a resolver."
    - id: d
      text: Que no te involucraras
      rationale: "Que le diste espacio para que aprendiera por su cuenta."
    - id: c
      text: Que compitieras con esa persona
      rationale: "Que el listón alto del equipo hizo que se pusiera al nivel."
    - id: a
      text: "Impacto más allá de tu output: mentorizar, desbloquear y elevar a otros,
        con un resultado en la persona/equipo"
      rationale: "Impacto más allá de tu propio trabajo: mentorizar, desbloquear y elevar a otros, con un resultado en la persona."
  correct: a
  explanation: "A partir de mid/senior valoran el multiplicador: que eleves a
    otros (mentoría, code reviews formativas, desbloqueo) con un resultado
    tangible en su crecimiento, no solo tu producción individual."
  source: externa
  date: 2026-07-14
- id: star-043
  dimension: comportamental-star
  subtopic: liderazgo
  difficulty: experto
  type: escenario
  roles: *a1
  stem: "Nivel staff: necesitas alinear a VARIOS equipos (sin mando sobre ellos)
    hacia una dirección técnica. ¿Qué historia demuestra ese nivel?"
  options:
    - id: c
      text: Hacerlo tú solo sin contar con los equipos
      rationale: "Sacarlo adelante tú y presentarlo ya resuelto, que evita meses de reuniones."
    - id: b
      text: Imponerlo por email a todos
      rationale: "Comunicar la dirección por escrito a todos, para que quede claro el criterio."
    - id: d
      text: Dejar que cada equipo haga lo suyo sin alineación
      rationale: "Dejar que cada equipo elija: el que mejor conoce su terreno decide mejor."
    - id: a
      text: "Construir contexto y consenso: exponer el problema y los trade-offs,
        escuchar a cada equipo, y lograr una decisión compartida que luego se
        ejecuta"
      rationale: "Construir contexto y consenso: exponer el problema y sus compromisos, escuchar a cada equipo y llegar a una decisión compartida."
  correct: a
  explanation: "La señal staff es influir a escala sin autoridad: alinear equipos
    mediante contexto, trade-offs explícitos y consenso, generando una decisión
    compartida y sostenible. No es mandar ni actuar en solitario."
  source: externa
  date: 2026-07-14
- id: star-044
  dimension: comportamental-star
  subtopic: liderazgo
  difficulty: experto
  type: escenario
  roles: *a1
  stem: Defendiste un enfoque, el liderazgo eligió otro, y tú lideras la
    ejecución. ¿Qué demuestra madurez senior?
  options:
    - id: c
      text: Recordar a todos que tú opinabas distinto
      rationale: "Dejar constancia de tu posición, que es lo honesto con lo que defendiste."
    - id: d
      text: Delegar y desentenderte
      rationale: "Delegar la ejecución en quien defendía esa dirección desde el principio."
    - id: a
      text: "Disagree-and-commit real: apoyar la decisión de forma genuina, ejecutarla
        bien y asumir el resultado como propio, sin 'ya lo dije'"
      rationale: "Apoyar la decisión de verdad, ejecutarla bien y asumir el resultado como propio, sin recordar que opinabas otra cosa."
    - id: b
      text: Ejecutarla a medias para demostrar que estabas en lo cierto
      rationale: "Ejecutarla dejando ver dónde estaban los riesgos que señalaste."
  correct: a
  explanation: "Comprometerse de verdad tras discrepar: liderar la ejecución con
    lealtad y ownership del resultado, sin sabotaje pasivo ni 'te lo dije'. Es
    una señal fuerte de madurez y de poner al equipo por delante del ego."
  source: externa
  date: 2026-07-14
- id: star-045
  dimension: comportamental-star
  subtopic: impacto
  difficulty: experto
  type: concepto
  roles: *a1
  stem: ¿Qué distingue una señal de nivel staff de una de nivel senior en las
    preguntas de impacto?
  options:
    - id: c
      text: Que el staff programa más rápido
      rationale: "El ritmo: a más nivel, se resuelve más en el mismo tiempo."
    - id: a
      text: "El alcance: senior resuelve problemas complejos de su área; staff mejora
        sistemas/procesos y eleva a varios equipos, con impacto organizativo"
      rationale: "El alcance: uno resuelve problemas complejos de su área; el otro mejora sistemas y eleva a varios equipos."
    - id: d
      text: Que el senior no colabora
      rationale: "El grado de autonomía con el que se trabaja frente al equipo."
    - id: b
      text: Solo el número de años
      rationale: "Los años acumulados, que es lo que separa un nivel del siguiente."
  correct: a
  explanation: "No es más habilidad de teclado sino ALCANCE e impacto: staff opera
    a nivel de sistema/organización (estándares, arquitectura transversal,
    elevar el nivel de varios equipos), más allá del ámbito de un senior."
  source: externa
  date: 2026-07-14
- id: star-046
  dimension: comportamental-star
  subtopic: ambiguedad
  difficulty: experto
  type: escenario
  roles: *a1
  stem: Te dan un problema de negocio enorme y ambiguo, sin solución obvia (típico
    de staff). ¿Qué enfoque demuestra ese nivel?
  options:
    - id: b
      text: Pedir que te lo concreten del todo antes de empezar
      rationale: "Pedir que lo concreten antes de empezar: sin definición no se puede planificar."
    - id: d
      text: Delegar todo sin dar dirección
      rationale: "Repartirlo entre quienes conocen cada parte y dejar que avancen."
    - id: a
      text: Enmarcar el problema (qué resolvemos y por qué), descomponerlo, alinear a
        los implicados y definir un camino iterativo con hitos medibles
      rationale: "Enmarcar el problema, descomponerlo, alinear a los implicados y definir un camino iterativo con hitos medibles."
    - id: c
      text: Lanzarte a una solución técnica sin entender el problema
      rationale: "Arrancar con una solución técnica y ajustarla según se vea el terreno."
  correct: a
  explanation: El trabajo staff empieza por DEFINIR el problema y su porqué,
    descomponerlo, crear alineamiento y trazar un camino iterativo con hitos.
    Convertir la ambigüedad en un plan compartido es la competencia clave.
  source: externa
  date: 2026-07-14
- id: star-047
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: experto
  type: escenario
  roles: *a1
  stem: Dos stakeholders senior quieren direcciones opuestas y el proyecto está
    bloqueado. ¿Qué demuestra nivel?
  options:
    - id: d
      text: Decidir tú por tu cuenta ignorándolos
      rationale: "Tomar la decisión tú y avanzar: el bloqueo cuesta más que equivocarse."
    - id: a
      text: "Facilitar: sacar a la luz los intereses de fondo de cada uno, buscar
        objetivos comunes y datos, y conducir a una decisión que ambos puedan
        apoyar (o escalar con una recomendación)"
      rationale: "Facilitar: sacar los intereses de fondo de cada uno, buscar objetivos comunes y datos, y conducir a una decisión que ambos puedan apoyar."
    - id: b
      text: Ponerte del lado del más poderoso
      rationale: "Apoyar la posición que más peso tiene, que es la que va a acabar imponiéndose."
    - id: c
      text: Evitar el conflicto y dejarlo bloqueado
      rationale: "Dejar que lo resuelvan entre ellos y centrarte en lo que sí avanza."
  correct: a
  explanation: "Mediar entre seniors: entender los intereses reales (no solo
    posiciones), anclar en objetivos comunes y datos, y conducir a una decisión
    apoyada por ambos o escalar con una recomendación clara. Ni tomar partido
    por poder ni evadir."
  source: externa
  date: 2026-07-14
- id: star-048
  dimension: comportamental-star
  subtopic: fracaso
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Lideraste un proyecto que finalmente se canceló. ¿Cómo lo cuentas bien?
  options:
    - id: a
      text: "Con honestidad: qué aprendiste, qué valor se rescató (aprendizaje,
        tecnología reutilizada, decisión de parar a tiempo) y cómo cuidaste al
        equipo"
      rationale: "Con honestidad: qué aprendiste, qué se rescató —aprendizaje, tecnología, parar a tiempo— y cómo cuidaste al equipo."
    - id: b
      text: Ocultando que se canceló
      rationale: "Contando el trabajo hecho sin entrar en cómo acabó."
    - id: d
      text: Diciendo que fue un éxito rotundo
      rationale: "Presentándolo por lo que sí logró, que es lo que importa del proyecto."
    - id: c
      text: Culpando enteramente a la dirección
      rationale: "Explicando las decisiones de dirección que lo dejaron sin recorrido."
  correct: a
  explanation: "Un proyecto cancelado bien contado muestra madurez: aprendizaje,
    valor rescatado (a veces parar a tiempo ES la decisión correcta) y cómo
    gestionaste la moral del equipo. Negarlo o culpar a otros resta."
  source: externa
  date: 2026-07-14
- id: star-049
  dimension: comportamental-star
  subtopic: metodo-star
  difficulty: medium
  type: diagrama
  roles: *a1
  stem: |-
    Estructura de una respuesta STAR:

      [ Situación ] -> [ Tarea ] -> [ ? ] -> [ Resultado ]

    ¿Qué va en [ ? ], y dónde debe ir el grueso del tiempo?
  options:
    - id: c
      text: La conclusión final
      rationale: "El cierre, que resume lo aprendido y remata la respuesta."
    - id: b
      text: Otra Situación más de contexto
      rationale: "Más contexto, para que se entienda bien la dificultad del caso."
    - id: a
      text: "Acción: lo que hiciste TÚ; es donde va el grueso de la respuesta, junto
        con el Resultado"
      rationale: "La acción: lo que hiciste tú, y ahí va el grueso de la respuesta junto con el resultado."
    - id: d
      text: Las preguntas para el entrevistador
      rationale: "El turno de preguntas, que continúa la conversación con el entrevistador."
  correct: a
  explanation: Tras Situación y Tarea (contexto breve), la ACCIÓN (lo que hiciste
    tú) es el corazón de la respuesta, y el Resultado la cierra con impacto. El
    error común es gastar el tiempo en el contexto y quedarse corto en
    Acción/Resultado.
  source: externa
  date: 2026-07-14
- id: star-050
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: medium
  type: escenario
  roles: *a1
  stem: "'Cuéntame de una vez que perdiste un debate/decisión.' ¿Qué respuesta da
    buena señal?"
  options:
    - id: c
      text: Que seguiste peleándola indefinidamente
      rationale: "Que insististe hasta que se reconsideró la decisión."
    - id: d
      text: Que te enfadaste y te desentendiste
      rationale: "Que te apartaste de una decisión con la que no estabas de acuerdo."
    - id: a
      text: Aceptaste la decisión, la apoyaste, y cuentas qué aprendiste (o incluso
        que la otra opción resultó mejor)
      rationale: "Que aceptaste la decisión, la apoyaste y cuentas qué aprendiste, incluso si la otra opción salió mejor."
    - id: b
      text: Que nunca has perdido un debate
      rationale: "Que sueles convencer cuando defiendes algo con argumentos."
  correct: a
  explanation: "Perder con elegancia: reconocer que a veces la otra postura era
    mejor, comprometerte con la decisión y extraer aprendizaje. Muestra
    humildad, colaboración y foco en el resultado del equipo, no en tener
    razón."
  source: externa
  date: 2026-07-14
