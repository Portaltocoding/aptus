  source: externa
  date: 2026-07-14
- id: star-036
  dimension: comportamental-star
  subtopic: entrevista
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Al final de la entrevista te preguntan si TÚ tienes preguntas. ¿Qué conviene?
  options:
    - id: c
      text: Preguntar solo por vacaciones
      rationale: "Preguntar por condiciones y calendario, que es lo que decide si aceptas."
    - id: b
      text: No preguntar nada
      rationale: "No preguntar: si todo ha quedado claro, insistir alarga la reunión."
    - id: a
      text: "Tener preguntas buenas y específicas (equipo, retos, cómo se mide el
        éxito, cultura técnica): demuestra interés y te ayuda a evaluar el
        encaje"
      rationale: "Preguntas específicas —equipo, retos, cómo miden el éxito—: enseñan interés y te sirven para valorar el encaje."
    - id: d
      text: Repetir lo que ya te explicaron
      rationale: "Repasar lo explicado para confirmar que lo has entendido bien."
  correct: a
  explanation: Preguntar bien señala interés y criterio, y te sirve para valorar
    si el sitio te encaja (retos reales, cómo miden el éxito, deuda técnica,
    cómo es un día). No preguntar nada transmite desinterés.
  source: externa
  date: 2026-07-14
- id: star-037
  dimension: comportamental-star
  subtopic: entrevista
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Como candidato, ¿qué sería una 'red flag' razonable de un empleo?
  options:
    - id: d
      text: Que te pidan un ejemplo de tu trabajo
      rationale: "Que te pidan enseñar trabajo previo, que es material que no siempre puedes compartir."
    - id: c
      text: Que el proceso tenga varias fases
      rationale: "Que el proceso tenga muchas fases, señal de que no saben decidir."
    - id: b
      text: Que te hagan preguntas técnicas difíciles
      rationale: "Que las preguntas técnicas sean duras, señal de un listón poco realista."
    - id: a
      text: Respuestas vagas sobre expectativas, rotación alta, procesos caóticos o
        incapacidad de explicar cómo miden el éxito
      rationale: "Respuestas vagas sobre expectativas, rotación alta, procesos caóticos o no saber explicar cómo miden el éxito."
  correct: a
  explanation: "Señales de alarma: falta de claridad en expectativas/rol, mucha
    rotación, caos organizativo o no saber definir el éxito. Un proceso exigente
    y estructurado NO es una red flag."
  source: externa
  date: 2026-07-14
- id: star-038
  dimension: comportamental-star
  subtopic: negociacion
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Al negociar salario, ¿qué enfoque es más sólido?
  options:
    - id: b
      text: Aceptar la primera oferta siempre
      rationale: "Aceptar lo ofrecido: regatear puede enfriar una oferta ya cerrada."
    - id: c
      text: Mentir sobre otras ofertas
      rationale: "Mencionar otras opciones sobre la mesa para mejorar la posición."
    - id: d
      text: Dar la cifra más baja que aceptarías
      rationale: "Poner tu mínimo por delante, que evita perder tiempo si no llegan."
    - id: a
      text: Anclar en tu valor y en un rango informado por el mercado, evitando dar tú
        primero una cifra baja; negociar el paquete completo
      rationale: "Anclar en tu valor y en un rango informado por el mercado, sin dar tú primero una cifra baja, y negociar el paquete completo."
  correct: a
  explanation: Negociar desde el valor aportado y datos de mercado, sin anclarte
    tú a la baja, y mirando el paquete completo (base, variable, equity,
    condiciones). Mentir es arriesgado y contraproducente.
  source: externa
  date: 2026-07-14
- id: star-039
  dimension: comportamental-star
  subtopic: entrevista
  difficulty: easy
  type: concepto
  roles: *a1
  stem: ¿Aporta algo un mensaje de seguimiento/agradecimiento tras la entrevista?
  options:
    - id: b
      text: No, es contraproducente siempre
      rationale: "No: insistir después de la entrevista transmite necesidad."
    - id: a
      text: "Sí: breve, agradece, reafirma interés y encaje, y mantiene una buena
        impresión sin ser insistente"
      rationale: "Sí: breve, agradece, reafirma interés y encaje, y deja buena impresión sin insistir."
    - id: d
      text: Hay que enviar uno cada día
      rationale: "Sí, y con seguimiento periódico hasta tener respuesta."
    - id: c
      text: Solo si pides feedback exhaustivo
      rationale: "Solo si aprovechas para pedir una valoración detallada de tu desempeño."
  correct: a
  explanation: "Un follow-up breve y sincero refuerza el interés y deja buena
