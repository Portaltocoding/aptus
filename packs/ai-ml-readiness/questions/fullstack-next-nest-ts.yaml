# Dimensión: fullstack-next-nest-ts — 50 preguntas. Curadas, técnicamente correctas.
# type: concepto|diagrama|codigo|escenario. difficulty incl. experto (staff). source: externa (stack profesional).

- id: fs-001
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: easy
  roles:
    - Full Stack Engineer
    - AI Product Engineer
  stem: En TypeScript, ¿qué utility type convierte todas las propiedades de un
    tipo en opcionales?
  options:
    - id: a
      text: Required<T>
      rationale: "El que asegura que están todas presentes, quitando la opcionalidad que hubiera."
    - id: c
      text: Readonly<T>
      rationale: "El que impide reasignar las propiedades una vez creado el objeto."
    - id: d
      text: Pick<T, K>
      rationale: "El que se queda con un subconjunto de claves del tipo original."
    - id: b
      text: Partial<T>
      rationale: "El que marca todas las propiedades como opcionales."
  correct: b
  explanation: "Partial<T> mapea cada propiedad a opcional (prop?: tipo).
    Required<T> hace lo contrario, Readonly<T> las hace inmutables y Pick<T,K>
    selecciona un subconjunto de claves."
  source: externa
  date: 2026-07-14
- id: fs-002
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  roles:
    - Full Stack Engineer
  stem: ¿Cuál es la diferencia práctica clave entre los tipos 'unknown' y 'any' en
    TypeScript?
  options:
    - id: d
      text: "'unknown' no existe en TypeScript, es de Flow"
      rationale: "Ese tipo viene de otro comprobador estático y no del propio TypeScript."
    - id: c
      text: "'any' solo se puede usar en tipos de retorno y 'unknown' solo en
        parámetros"
      rationale: "Uno solo vale en la posición de retorno y el otro en la de parámetro."
    - id: a
      text: Son sinónimos, 'unknown' es solo un alias más moderno de 'any'
      rationale: "Son sinónimos: el segundo es la forma moderna de escribir lo mismo."
    - id: b
      text: "'unknown' es type-safe: obliga a estrechar el tipo (narrowing) antes de
        operar con el valor, mientras 'any' desactiva toda comprobación"
      rationale: "Uno obliga a estrechar el tipo antes de operar; el otro desactiva toda comprobación."
  correct: b
  explanation: "'unknown' acepta cualquier valor pero no permite acceder a
    propiedades ni llamarlo sin antes estrechar el tipo (typeof, instanceof,
    guards). 'any' apaga el chequeo de tipos por completo, propagando
    inseguridad."
  source: externa
  date: 2026-07-14
- id: fs-003
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  roles:
    - Full Stack Engineer
  stem: Tienes un tipo union 'type Shape = Circle | Square' donde cada miembro
    tiene un campo literal 'kind'. ¿Cómo se llama el patrón que permite a
    TypeScript estrechar el tipo dentro de un switch sobre 'shape.kind'?
  options:
    - id: d
      text: Mapped type
      rationale: "El patrón que construye un tipo recorriendo las claves de otro."
    - id: c
      text: Conditional type
      rationale: "El patrón que elige un tipo u otro según se cumpla una condición."
    - id: a
      text: Discriminated union (union etiquetada)
      rationale: "Unión etiquetada: un campo literal común permite distinguir cada miembro."
    - id: b
      text: Intersection type
      rationale: "La combinación de varios tipos en uno que cumple todos a la vez."
  correct: a
  explanation: Una discriminated union usa un campo literal común (el
    discriminante, aquí 'kind') para que el compilador estreche automáticamente
    al miembro correcto en cada rama del switch, dando exhaustividad
    verificable.
  source: externa
  date: 2026-07-14
- id: fs-004
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: hard
  roles:
    - Full Stack Engineer
  stem: "¿Qué aporta el operador 'satisfies' de TypeScript frente a una anotación
    de tipo normal ': T'?"
  options:
    - id: b
      text: Convierte el valor a T en tiempo de ejecución (cast real)
      rationale: "Convierte el valor al tipo indicado también en ejecución, no solo al comprobar."
    - id: d
      text: Es equivalente a 'as T' pero más lento
      rationale: "Hace lo mismo que una aserción de tipo, con algo más de trabajo del compilador."
    - id: a
      text: Comprueba que el valor cumple el tipo T pero conserva el tipo literal más
        estrecho inferido del valor, en vez de ensancharlo a T
      rationale: "Comprueba que el valor cumple el tipo pero conserva el tipo estrecho inferido en vez de ensancharlo."
    - id: c
      text: Hace que el valor sea readonly
      rationale: "Marca el valor como no modificable una vez declarado."
  correct: a
  explanation: "'satisfies' valida la compatibilidad con T sin descartar la
    información literal: p. ej. un objeto de config queda validado contra el
    tipo pero cada clave mantiene su tipo estrecho, algo que ': T' perdería al
    ensanchar. No hay efecto en runtime."
  source: externa
  date: 2026-07-14
- id: fs-005
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: easy
  roles:
    - Full Stack Engineer
    - AI Product Engineer
  stem: En Next.js, ¿qué diferencia hay entre SSG (Static Site Generation) y SSR
    (Server-Side Rendering)?
  options:
    - id: c
      text: Son lo mismo, solo cambia el nombre según la versión
      rationale: "Son lo mismo: el nombre cambió entre versiones del framework."
    - id: b
      text: SSG genera el HTML en tiempo de build (una vez); SSR lo genera en el
        servidor en cada petición
      rationale: "Uno genera el HTML al construir, una vez; el otro en el servidor en cada petición."
    - id: d
      text: SSR solo funciona sin JavaScript y SSG requiere JavaScript
      rationale: "Uno funciona sin JavaScript en el cliente y el otro lo necesita para pintar."
    - id: a
      text: SSG renderiza en el navegador; SSR en el servidor
      rationale: "Uno renderiza en el navegador y el otro en el servidor."
  correct: b
  explanation: SSG produce HTML estático en el build y lo sirve igual a todos
    (ideal para contenido que cambia poco). SSR ejecuta el render en el servidor
    por cada request, útil cuando el contenido depende de la petición (usuario,
    datos frescos).
  source: externa
  date: 2026-07-14
- id: fs-006
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles:
    - Full Stack Engineer
    - AI Product Engineer
  stem: En el App Router de Next.js, ¿qué caracteriza a un React Server Component
    (RSC) por defecto?
  options:
    - id: c
      text: Es idéntico a un componente cliente pero con otro nombre
      rationale: "Es lo mismo que un componente de cliente, con otro nombre según dónde se declare."
    - id: d
      text: Solo puede renderizar texto plano, no otros componentes
      rationale: "Solo puede devolver texto plano, sin componer con otros componentes."
    - id: b
      text: Se ejecuta solo en el cliente y siempre requiere 'use client'
      rationale: "Se ejecuta en el cliente y necesita marcarse explícitamente para funcionar."
    - id: a
      text: Se ejecuta en el servidor, no envía su JS al cliente y no puede usar hooks
        de estado como useState/useEffect
      rationale: "Corre en el servidor, su JavaScript no viaja al cliente y no puede usar hooks de estado."
  correct: a
  explanation: "En el App Router los componentes son Server Components por
    defecto: corren en el servidor, pueden hacer fetch/acceso a datos
    directamente y no mandan JS al bundle del cliente. Para interactividad con
    estado/efectos hace falta marcar 'use client'."
  source: externa
  date: 2026-07-14
- id: fs-007
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles:
    - Full Stack Engineer
  stem: ¿Qué hace Incremental Static Regeneration (ISR) en Next.js?
  options:
    - id: b
      text: Permite regenerar páginas estáticas en segundo plano tras un intervalo
        ('revalidate'), sirviendo la versión cacheada hasta que la nueva esté
        lista
      rationale: "Permite regenerar páginas estáticas en segundo plano tras un intervalo, sirviendo la cacheada mientras tanto."
    - id: c
      text: Deshabilita el cache por completo
      rationale: "Desactiva la caché para que cada visita reciba contenido recién generado."
    - id: a
      text: Regenera todo el sitio en cada request
      rationale: "Vuelve a generar el sitio entero en cada petición que llega."
    - id: d
      text: Convierte las páginas en client-side rendering
      rationale: "Pasa las páginas a renderizarse en el navegador con los datos frescos."
  correct: b
  explanation: "ISR combina lo estático con frescura: la página se sirve desde
    cache y, pasado el tiempo de 'revalidate', Next.js la regenera en background
    y sustituye la versión servida, sin rebuild completo del sitio ni SSR en
    cada petición."
  source: externa
  date: 2026-07-14
- id: fs-008
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: hard
  roles:
    - Full Stack Engineer
    - AI Product Engineer
  stem: Tras mutar datos con una Server Action en Next.js, ¿cuál es la forma
    idiomática de que la UI refleje el cambio sin recargar toda la página a
    mano?
  options:
    - id: d
      text: "No es posible: las Server Actions no pueden refrescar datos"
      rationale: "No es posible: una acción de servidor no puede tocar lo que ya se ha pintado."
    - id: c
      text: Guardar el estado en localStorage y leerlo en el próximo render
      rationale: "Guardar el resultado en el almacenamiento del navegador y leerlo al volver a pintar."
    - id: b
      text: Hacer window.location.reload() al final de la acción
      rationale: "Forzar una recarga completa al terminar la acción, que es lo más directo."
    - id: a
      text: Llamar a revalidatePath() o revalidateTag() para invalidar el cache del
        segmento afectado y que Next.js vuelva a renderizarlo
      rationale: "Invalidar la caché del segmento afectado para que el framework lo vuelva a renderizar."
  correct: a
  explanation: revalidatePath/revalidateTag invalidan el cache de datos/segmento
    tras la mutación, de modo que el siguiente render en servidor trae los datos
    frescos. Es el mecanismo idiomático; un reload completo pierde el beneficio
    de la navegación por RSC.
  source: externa
  date: 2026-07-14
- id: fs-009
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles:
    - Full Stack Engineer
  stem: ¿Cuál es una causa típica de un 'hydration mismatch' en Next.js/React?
  options:
    - id: b
      text: Usar demasiados componentes
      rationale: "Con demasiados componentes, el árbol tarda en estabilizarse y la hidratación falla."
    - id: a
      text: Renderizar en el servidor un HTML distinto al que produce el cliente en el
        primer render (p. ej. usar Date.now(), Math.random() o window durante el
        render)
      rationale: "Que el HTML del servidor no coincida con el primer render del cliente: fechas, aleatorios o acceso al navegador durante el render."
    - id: c
      text: Tener el bundle de JS demasiado pequeño
      rationale: "Que el paquete de JavaScript sea tan pequeño que llegue antes que el HTML."
    - id: d
      text: Definir tipos con TypeScript
      rationale: "Que los tipos declarados no se correspondan con lo que llega en ejecución."
  correct: a
  explanation: La hidratación asume que el HTML del servidor coincide con el
    primer render del cliente. Si el árbol difiere (valores no deterministas,
    acceso a APIs de navegador solo disponibles en cliente), React detecta el
    desajuste y avisa/re-renderiza, con parpadeos o errores.
  source: externa
  date: 2026-07-14
- id: fs-010
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  roles:
    - Full Stack Engineer
    - Backend Engineer
  stem: En NestJS, ¿qué principio arquitectónico está en el centro de cómo se
    conectan controllers, services y repositories?
  options:
    - id: c
      text: Variables globales compartidas entre módulos
      rationale: "Un espacio compartido entre módulos donde cada pieza encuentra lo que necesita."
    - id: d
      text: Singletons creados manualmente con 'new' en cada archivo
      rationale: "Instancias únicas creadas a mano en cada fichero que las necesita."
    - id: b
      text: Herencia múltiple entre controllers
      rationale: "Herencia entre controladores para compartir el comportamiento común."
    - id: a
      text: "Inyección de dependencias (DI): los providers se declaran y Nest los
        inyecta por su token/tipo, en vez de instanciarlos a mano"
      rationale: "Inyección de dependencias: se declaran los proveedores y el framework los inyecta por su token."
  correct: a
  explanation: "NestJS se apoya en un contenedor de inyección de dependencias: los
    providers (services, repositories) se registran en módulos y Nest resuelve e
    inyecta las dependencias por constructor, favoreciendo el desacople y la
    testabilidad (mocks)."
  source: externa
  date: 2026-07-14
- id: fs-011
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: hard
  roles:
    - Full Stack Engineer
    - Backend Engineer
  stem: En NestJS, ¿cuál es el rol correcto de un Guard frente a un Pipe?
  options:
    - id: a
      text: El Guard decide si una petición puede continuar
        (autorización/autenticación); el Pipe transforma o valida los datos de
        entrada antes de llegar al handler
      rationale: "Uno decide si la petición sigue adelante; el otro transforma o valida los datos antes del manejador."
    - id: d
      text: El Pipe controla el acceso y el Guard registra logs
      rationale: "Uno controla el acceso y el otro se encarga de registrar lo que pasa."
    - id: c
      text: El Guard formatea la respuesta y el Pipe gestiona la conexión a la base de
        datos
      rationale: "Uno da forma a la respuesta y el otro gestiona la conexión a la base de datos."
    - id: b
      text: Son intercambiables, hacen exactamente lo mismo
      rationale: "Hacen lo mismo y se eligen por preferencia de estilo."
  correct: a
  explanation: "Un Guard implementa canActivate() y decide si la request procede
    (típico: auth/roles). Un Pipe opera sobre los argumentos del handler para
    validarlos o transformarlos (p. ej. ValidationPipe con class-validator,
    ParseIntPipe). Son responsabilidades distintas en el ciclo de petición."
  source: externa
  date: 2026-07-14
- id: fs-012
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  roles:
    - Full Stack Engineer
    - Backend Engineer
  stem: ¿Cómo se valida idiomáticamente el body de una petición en NestJS?
  options:
    - id: d
      text: Validando en el frontend y desactivando la validación en el backend
      rationale: "Validando en el cliente, que es donde el usuario puede corregir sin ida y vuelta."
    - id: a
      text: Con un DTO decorado con class-validator y el ValidationPipe global, que
        rechaza la petición si el payload no cumple el esquema
      rationale: "Con un objeto de transferencia decorado y la validación global, que rechaza lo que no cumpla el esquema."
    - id: c
      text: Confiando en que el cliente envíe siempre datos válidos
      rationale: "Confiando en el cliente, que es quien conoce el formato esperado."
    - id: b
      text: Comprobando cada campo con if/else dentro del controller
      rationale: "Comprobando campo a campo dentro del controlador, donde se ve el flujo completo."
  correct: a
  explanation: El patrón idiomático es definir un DTO con decoradores de
    class-validator (@IsString, @IsEmail, etc.) y activar el ValidationPipe (a
    menudo global con whitelist), que transforma y valida el payload y devuelve
    400 automáticamente si no cumple, sin validación manual dispersa.
  source: externa
  date: 2026-07-14
- id: fs-013
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: codigo
  roles:
    - Full Stack Engineer
  stem: |-
    function Comp() {
      const [n, setN] = useState(0);
      useEffect(() => {
        setN(n + 1);          // sin array de dependencias
      });
      return <div>{n}</div>;
    }

    ¿Qué ocurre al montar este componente?
  options:
    - id: b
      text: Nada raro, n se queda en 1
      rationale: "El efecto corre una vez tras montar y deja el contador en uno."
    - id: a
      text: "Bucle infinito de renders: el effect corre en cada render y setN provoca
        otro render"
      rationale: "Bucle infinito: el efecto corre en cada render y la actualización provoca otro."
    - id: d
      text: n se queda en 0 para siempre
      rationale: "La actualización no llega a aplicarse y el contador se queda a cero."
    - id: c
      text: Error de compilación de TypeScript
      rationale: "El compilador rechaza el efecto por no declarar dependencias."
  correct: a
  explanation: "Sin array de dependencias, el effect se ejecuta tras CADA render;
    como llama a setN, dispara un nuevo render que vuelve a ejecutar el effect:
    bucle infinito. Se corrige con `[]` (una vez) o las dependencias correctas."
  source: externa
  date: 2026-07-14
- id: fs-014
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: hard
  type: diagrama
  roles:
    - Full Stack Engineer
    - Backend Engineer
  stem: |-
    Ciclo de una petición en NestJS (falta el paso ? justo antes del handler):

      Request -> Middleware -> Guard -> Interceptor -> [ ? ] -> Controller

    ¿Qué va en [ ? ]?
  options:
    - id: a
      text: Pipe (valida/transforma el payload, p. ej. ValidationPipe con el DTO)
      rationale: "La pieza que valida y transforma el cuerpo contra su esquema antes de entrar al manejador."
    - id: b
      text: Otro Controller
      rationale: "Otro controlador encadenado que prepara la petición para el siguiente."
    - id: d
      text: El navegador del cliente
      rationale: "El navegador, que confirma la petición antes de que se procese."
    - id: c
      text: La conexión a la base de datos
      rationale: "La conexión a la base de datos, que se abre justo antes de atender."
  correct: a
  explanation: El orden en Nest es middleware -> guards -> interceptors -> pipes
    -> handler. El Pipe valida y transforma los argumentos (típicamente el
    ValidationPipe contra el DTO) justo antes de que el controller los reciba.
  source: externa
  date: 2026-07-14
- id: fs-015
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: escenario
  roles:
    - Full Stack Engineer
  stem: En el App Router de Next.js pones useState en un componente sin la
    directiva 'use client' y falla. ¿Por qué?
  options:
    - id: c
      text: Falta importar React manualmente
      rationale: "Falta importar la librería de forma explícita para que el hook exista."
    - id: d
      text: Next.js no soporta estado en el cliente
      rationale: "El framework no admite estado en el cliente en esta forma de enrutado."
    - id: a
      text: Es un Server Component por defecto; los hooks de estado solo van en Client
        Components ('use client')
      rationale: "Por defecto es un componente de servidor, y los hooks de estado solo van en los de cliente."
    - id: b
      text: useState ya no existe en React
      rationale: "Ese hook se retiró en las versiones recientes de la librería."
  correct: a
  explanation: En el App Router los componentes son Server Components por defecto
    y no tienen estado ni efectos de cliente. Para usar useState/useEffect hay
    que marcar el archivo con 'use client'.
  source: externa
  date: 2026-07-14
- id: fs-016
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: easy
  type: concepto
  roles: &a1
    - Full Stack Engineer
  stem: ¿Qué diferencia hay entre los utility types Pick<T,K> y Omit<T,K>?
  options:
    - id: b
      text: Son idénticos
      rationale: "Son dos formas de escribir lo mismo, según se prefiera listar o descartar."
    - id: c
      text: Pick borra claves y Omit las añade
      rationale: "Uno quita las claves indicadas y el otro las añade al tipo."
    - id: a
      text: Pick construye un tipo con SOLO las claves K; Omit construye uno con todas
        MENOS las claves K
      rationale: "Uno construye el tipo solo con las claves indicadas; el otro, con todas menos esas."
    - id: d
      text: Solo funcionan con arrays
      rationale: "Solo funcionan sobre listas, no sobre objetos."
  correct: a
  explanation: Pick<T,K> selecciona un subconjunto de propiedades; Omit<T,K> es el
    complementario (todas salvo K). Útiles para derivar tipos sin repetir.
  source: externa
  date: 2026-07-14
- id: fs-017
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Cuál es una diferencia práctica entre 'interface' y 'type' en TypeScript?
  options:
    - id: c
      text: Las interface no permiten extender
      rationale: "Una de las dos formas no admite extender otro tipo y obliga a repetir campos."
    - id: b
      text: Los type no pueden describir objetos
      rationale: "Una de las dos no puede describir la forma de un objeto."
    - id: a
      text: Las interface admiten 'declaration merging' (varias declaraciones del
        mismo nombre se fusionan); los type no
      rationale: "Una admite que varias declaraciones del mismo nombre se fusionen; la otra no."
    - id: d
      text: Son intercambiables sin ninguna diferencia
      rationale: "Son intercambiables y la elección es puramente de estilo."
  correct: a
  explanation: Ambos describen formas de objeto, pero interface se puede
    reabrir/fusionar (útil para augmentar tipos de librerías) y type es más
    flexible para uniones, tuplas y tipos calculados.
  source: externa
  date: 2026-07-14
- id: fs-018
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: "¿Para qué sirve una restricción en un genérico, como `<T extends { id:
    string }>`?"
  options:
    - id: c
      text: Obliga a que T sea string
      rationale: "Fija el genérico a cadenas, que es lo que se puede usar como identificador."
    - id: d
      text: Desactiva el chequeo de tipos
      rationale: "Relaja la comprobación dentro de la función para poder trabajar con cualquier forma."
    - id: b
      text: Convierte T en 'any'
      rationale: "Convierte el genérico en un comodín que acepta cualquier cosa."
    - id: a
      text: Limita T a tipos que cumplen esa forma, permitiendo acceder a esas
        propiedades dentro de la función con seguridad de tipos
      rationale: "Acota el genérico a tipos con esa forma, y así se pueden usar esas propiedades con seguridad."
  correct: a
  explanation: La constraint `extends` acota qué tipos acepta el genérico y
    habilita el acceso a los miembros garantizados (aquí `.id`), manteniendo la
    seguridad de tipos sin perder generalidad.
  source: externa
  date: 2026-07-14
- id: fs-019
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué obtienes con `keyof T` y con un acceso indexado `T[K]`?
  options:
    - id: d
      text: Solo funcionan en runtime
      rationale: "Son construcciones que solo tienen efecto cuando el programa ya está corriendo."
    - id: c
      text: Ambos devuelven 'any'
      rationale: "Las dos acaban devolviendo un comodín que no aporta información."
    - id: b
      text: keyof T es el número de claves; T[K] su longitud
      rationale: "Una da cuántas claves hay y la otra el tamaño de su valor."
    - id: a
      text: keyof T es la unión de las claves de T; T[K] es el tipo del valor en esa
        clave
      rationale: "Una da la unión de las claves; la otra, el tipo del valor en esa clave."
  correct: a
  explanation: keyof T da la unión literal de nombres de propiedad; el acceso
    indexado T[K] da el tipo del valor asociado. Son la base de utilidades
    genéricas tipadas (p. ej. un get(obj, key) seguro).
  source: externa
  date: 2026-07-14
- id: fs-020
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué es el 'narrowing' (estrechamiento) de tipos y cómo se logra?
  options:
    - id: a
      text: Reducir un tipo amplio a uno más concreto en una rama de código con guards
        (typeof, instanceof, in, comprobaciones de igualdad)
      rationale: "Reducir un tipo amplio a uno concreto en una rama, con comprobaciones de tipo o de igualdad."
    - id: c
      text: Borrar tipos en runtime
      rationale: "Quitar la información de tipos para que no estorbe al ejecutar."
    - id: d
      text: Un tipo de bucle
      rationale: "Una forma de recorrer las claves de un tipo una a una."
    - id: b
      text: Ampliar cualquier tipo a 'any'
      rationale: "Ensanchar cualquier tipo al comodín para poder operar sin restricciones."
  correct: a
  explanation: "El compilador estrecha el tipo dentro de bloques según los guards:
    p. ej. `if (typeof x === 'string')` hace que x sea string en esa rama. Es
    cómo se opera con seguridad sobre uniones y unknown."
  source: externa
  date: 2026-07-14
- id: fs-021
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: codigo
  roles: *a1
  stem: |-
    type Shape = Circle | Square;
    function area(s: Shape) {
      switch (s.kind) {
        case 'circle': return ...;
        case 'square': return ...;
        default: const _e: never = s; return _e;
      }
    }

    ¿Qué consigue el `const _e: never = s` en el default?
  options:
    - id: a
      text: "Chequeo de exhaustividad: si se añade un miembro a la union y no se
        maneja, TypeScript da error de compilación"
      rationale: "Comprobación de exhaustividad: si se añade un miembro y no se maneja, el compilador avisa."
    - id: c
      text: Convierte s en any
      rationale: "Convierte el valor en comodín para poder devolverlo sin quejas."
    - id: d
      text: No hace nada útil
      rationale: "Es una convención sin efecto real sobre la comprobación."
    - id: b
      text: Lanza una excepción en runtime siempre
      rationale: "Provoca un fallo en ejecución cuando llega un caso no contemplado."
  correct: a
  explanation: Si la union crece y falta un case, `s` en el default ya no es
    `never` y la asignación a `never` falla en compilación. Es el patrón
    estándar de exhaustividad con discriminated unions.
  source: externa
  date: 2026-07-14
- id: fs-022
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: "¿Qué efecto tiene `as const` sobre un literal, p. ej. `const cfg = {
    modo: 'oscuro' } as const`?"
  options:
    - id: b
      text: Lo convierte en any
      rationale: "Relaja el tipo para poder asignarle después cualquier otra cosa."
    - id: a
      text: Hace el valor readonly e infiere los tipos más estrechos (literales) en
        vez de ensancharlos (p. ej. 'oscuro' en vez de string)
      rationale: "Lo deja de solo lectura e infiere los tipos literales más estrechos en vez de ensancharlos."
    - id: c
      text: Lo copia en profundidad en runtime
      rationale: "Hace una copia profunda del objeto al ejecutar."
    - id: d
      text: No cambia nada
      rationale: "Es documentación: no cambia el tipo inferido."
  correct: a
  explanation: "`as const` congela el valor (readonly) y conserva los tipos
    literales exactos, en vez de ensanchar 'oscuro' a string o 3 a number. Útil
    para configs, tuplas y uniones derivadas."
  source: externa
  date: 2026-07-14
- id: fs-023
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: hard
  type: concepto
  roles: *a1
  stem: "¿Qué es un 'mapped type', como `type Opt<T> = { [K in keyof T]?: T[K] }`?"
  options:
    - id: a
      text: Un tipo que transforma cada propiedad de otro iterando sobre sus claves
        (aquí hace todas opcionales, como Partial)
      rationale: "Un tipo que transforma cada propiedad de otro recorriendo sus claves."
    - id: c
      text: Un tipo que solo existe en runtime
      rationale: "Una construcción que solo existe cuando el programa está en marcha."
    - id: b
      text: Un array de tipos
      rationale: "Una lista de tipos que se recorre en orden."
    - id: d
      text: Una función genérica
      rationale: "Una función genérica escrita en el espacio de tipos."
  correct: a
  explanation: Los mapped types recorren `keyof T` y construyen un nuevo tipo
    transformando cada propiedad (opcional, readonly, remapeada...). Partial,
    Readonly y Record se definen así.
  source: externa
  date: 2026-07-14
- id: fs-024
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: experto
  type: codigo
  roles: *a1
  stem: |-
    type RetType<F> = F extends (...args: any[]) => infer R ? R : never;

    ¿Qué hace `infer R` aquí?
  options:
    - id: b
      text: Declara una variable en runtime
      rationale: "Declara una variable que se rellena al ejecutar la función."
    - id: a
      text: Captura (infiere) el tipo de retorno de la función F dentro del tipo
        condicional, para devolverlo
      rationale: "Captura el tipo de retorno de la función dentro del tipo condicional para devolverlo."
    - id: d
      text: Es un error de sintaxis
      rationale: "No es sintaxis válida y el compilador la rechaza."
    - id: c
      text: Fuerza R a ser any
      rationale: "Obliga a que el resultado sea el comodín que acepta todo."
  correct: a
  explanation: En un conditional type, `infer R` introduce una variable de tipo
    que el compilador deduce por unificación del patrón; aquí extrae el tipo de
    retorno de F (como el ReturnType nativo).
  source: externa
  date: 2026-07-14
- id: fs-025
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Con `strictNullChecks` activo, ¿qué aporta el encadenamiento opcional
    `a?.b?.c` frente a `a.b.c`?
  options:
    - id: b
      text: Lanza una excepción si algo es null
      rationale: "Provoca un fallo controlado en cuanto un eslabón viene vacío."
    - id: c
      text: Convierte todo a any
      rationale: "Ensancha el resultado al comodín para poder seguir encadenando."
    - id: a
      text: Cortocircuita a undefined si algún eslabón es null/undefined, evitando el
        error en tiempo de ejecución y de tipos
      rationale: "Corta y devuelve indefinido si algún eslabón falta, evitando el fallo en ejecución y en tipos."
    - id: d
      text: Es solo azúcar sin efecto de tipos
      rationale: "Es azúcar de sintaxis sin efecto sobre el tipo resultante."
  correct: a
  explanation: El optional chaining devuelve undefined en cuanto un eslabón es
    nullish, sin evaluar el resto; combinado con `??` (nullish coalescing) es la
    forma segura de navegar estructuras potencialmente nulas bajo
    strictNullChecks.
  source: externa
  date: 2026-07-14
- id: fs-026
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Por qué el sistema de tipos de TypeScript se describe como 'estructural'
    (structural typing)?
  options:
    - id: a
      text: La compatibilidad se decide por la FORMA (propiedades) de los tipos, no
        por su nombre o herencia declarada
      rationale: "La compatibilidad se decide por la forma —qué propiedades tiene—, no por el nombre ni la herencia."
    - id: b
      text: Porque usa clases obligatoriamente
      rationale: "Porque exige clases para poder comparar dos tipos entre sí."
    - id: c
      text: Porque comprueba tipos en runtime
      rationale: "Porque comprueba los tipos mientras el programa se ejecuta."
    - id: d
      text: Porque solo admite tipos primitivos
      rationale: "Porque solo admite tipos primitivos como base de la comparación."
  correct: a
  explanation: En tipado estructural (pato), un valor es asignable a un tipo si
    tiene las propiedades requeridas, aunque no declare implementar nada.
    Contrasta con el tipado nominal de lenguajes como Java/C#.
  source: externa
  date: 2026-07-14
- id: fs-027
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: experto
  type: concepto
  roles: *a1
  stem: "En un conditional type distributivo como `type ToArr<T> = T extends any ?
    T[] : never`, aplicado a `ToArr<string | number>`, ¿qué resulta?"
  options:
    - id: a
      text: string[] | number[] — el condicional se distribuye sobre cada miembro de
        la unión
      rationale: "El condicional se reparte sobre cada miembro de la unión y devuelve la unión de los resultados."
    - id: c
      text: never
      rationale: "Ningún miembro cumple la condición y el resultado queda vacío."
    - id: d
      text: any[]
      rationale: "El resultado se ensancha al comodín al haber varios miembros."
    - id: b
      text: (string | number)[]
      rationale: "La unión se resuelve primero y el resultado es una sola lista."
  correct: a
  explanation: "Cuando el tipo comprobado es un parámetro genérico desnudo y
    recibe una unión, el conditional type se aplica miembro a miembro
    (distributividad): string→string[], number→number[]. Para evitarlo se
    envuelve en tuplas: [T] extends [any]."
  source: externa
  date: 2026-07-14
- id: fs-028
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: easy
  type: concepto
  roles: *a1
  stem: ¿Para qué sirve la prop `key` al renderizar una lista en React?
  options:
    - id: d
      text: Es obligatoria solo en producción
      rationale: "Solo hace falta en la compilación optimizada, donde se activa la comprobación."
    - id: a
      text: Da identidad estable a cada elemento para que React reconcilie
        eficientemente qué cambió, se movió o se borró
      rationale: "Da identidad estable a cada elemento para reconciliar qué cambió, se movió o se borró."
    - id: c
      text: Define el color del elemento
      rationale: "Sirve para identificar el elemento al aplicarle estilos."
    - id: b
      text: Es el texto que se muestra
      rationale: "Es el contenido que se muestra dentro del elemento de la lista."
  correct: a
  explanation: Las keys identifican los elementos entre renders; con keys estables
    React actualiza/mueve en vez de recrear. Usar el índice como key causa bugs
    si la lista se reordena o filtra.
  source: externa
  date: 2026-07-14
- id: fs-029
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Cuándo aportan valor `useMemo`/`useCallback`?
  options:
    - id: c
      text: Para hacer peticiones HTTP
      rationale: "Para lanzar peticiones y quedarse con el resultado entre renders."
    - id: b
      text: Siempre, en cada variable
      rationale: "Siempre: memorizar por defecto evita trabajo repetido sin coste."
    - id: a
      text: Para memoizar cálculos caros o mantener referencias estables que evitan
        re-renders/recomputaciones innecesarias; no para todo
      rationale: "Para memorizar cálculos caros o mantener referencias estables que evitan renders innecesarios; no para todo."
    - id: d
      text: Para reemplazar useState
      rationale: "Para sustituir al estado cuando el valor no cambia con frecuencia."
  correct: a
  explanation: Memoizan un valor (useMemo) o una función (useCallback) entre
    renders según sus dependencias. Útiles ante cálculos caros o para
    estabilizar props que alimentan componentes memoizados; usarlos en todo
    añade coste sin beneficio.
  source: externa
  date: 2026-07-14
- id: fs-030
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué distingue un input 'controlado' de uno 'no controlado' en React?
  options:
    - id: b
      text: El no controlado no funciona
      rationale: "El no controlado no llega a funcionar sin un manejador de cambios."
    - id: d
      text: El controlado no usa estado
      rationale: "El controlado no guarda el valor: lo lee del DOM cuando hace falta."
    - id: a
      text: El controlado tiene su valor en el estado de React (value + onChange); el
        no controlado lo mantiene el propio DOM (se lee con ref)
      rationale: "Uno guarda su valor en el estado de la librería; el otro lo mantiene el propio DOM y se lee con una referencia."
    - id: c
      text: Son lo mismo
      rationale: "Son la misma cosa según se declare el valor inicial."
  correct: a
  explanation: En el controlado, React es la fuente de verdad (value ligado al
    estado). En el no controlado, el DOM guarda el valor y lo lees puntualmente
    con una ref. Lo habitual es controlado para validación/lógica reactiva.
  source: externa
  date: 2026-07-14
- id: fs-031
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿En qué se diferencia `useRef` de `useState`?
  options:
    - id: b
      text: Son idénticos
      rationale: "Guardan lo mismo y se eligen por costumbre del equipo."
    - id: a
      text: Mutar una ref (ref.current) NO provoca re-render; cambiar el estado SÍ.
        useRef sirve para valores mutables persistentes o acceso al DOM
      rationale: "Mutar una referencia no provoca render; cambiar el estado sí."
    - id: c
      text: useRef re-renderiza y useState no
      rationale: "Uno provoca render al cambiar y el otro no, justo al revés de lo que se supone."
    - id: d
      text: useRef solo guarda strings
      rationale: "La referencia solo admite cadenas de texto."
  correct: a
  explanation: useRef guarda un contenedor mutable estable entre renders sin
    disparar re-render al cambiarlo; útil para referencias al DOM o valores que
    no deben provocar repintado. useState sí re-renderiza al actualizar.
  source: externa
  date: 2026-07-14
- id: fs-032
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Un `useEffect` con `setInterval` que lee `count` muestra siempre el valor
    inicial aunque count cambie. ¿Cuál es la causa típica?
  options:
    - id: d
      text: Falta subir la versión de React
      rationale: "Es un comportamiento corregido en versiones más recientes de la librería."
    - id: b
      text: React está roto
      rationale: "El planificador de renders no propaga el valor a los temporizadores."
    - id: c
      text: setInterval no existe
      rationale: "El temporizador no está disponible en ese entorno de ejecución."
    - id: a
      text: "Stale closure: el intervalo capturó el `count` del primer render; se
        arregla con la forma funcional de setState o dependencias/cleanup
        correctos"
      rationale: "Cierre obsoleto: el intervalo capturó el valor del primer render; se arregla con la forma funcional o con dependencias y limpieza."
  correct: a
  explanation: El callback del intervalo cierra sobre el `count` del render en que
    se creó (stale closure). Se resuelve usando setCount(c => c + 1), o
    recreando el efecto con las deps adecuadas y limpiando el intervalo.
  source: externa
  date: 2026-07-14
- id: fs-033
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Por qué usar el índice del array como `key` puede causar bugs?
  options:
    - id: a
      text: Si la lista se reordena, inserta o filtra, los índices se reasignan y
        React asocia estado/DOM al elemento equivocado
      rationale: "Si la lista se reordena o se filtra, los índices se reasignan y el estado queda asociado al elemento equivocado."
    - id: d
      text: No causa ningún problema
      rationale: "No causa problemas: el índice es único dentro de la lista."
    - id: c
      text: Porque React prohíbe los números
      rationale: "La librería exige cadenas y convierte el número de forma poco fiable."
    - id: b
      text: Porque los índices son lentos de calcular
      rationale: "Calcular el índice en cada render es más costoso que leer un identificador."
  correct: a
  explanation: La key debe identificar al ITEM, no su posición. Con índices, al
    reordenar/insertar, React cree que el elemento de una posición es 'el mismo'
    y arrastra estado (inputs, foco) al item incorrecto. Usar un id estable.
  source: externa
  date: 2026-07-14
- id: fs-034
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué problema resuelve la Context API de React?
  options:
    - id: c
      text: Sustituir a TypeScript
      rationale: "Aporta los tipos que faltan cuando los datos atraviesan varios componentes."
    - id: a
      text: "El 'prop drilling': pasar datos a componentes profundos sin encadenar
        props por cada nivel intermedio"
      rationale: "El encadenado de props: llevar datos a componentes profundos sin pasarlos nivel a nivel."
    - id: d
      text: Renderizar en el servidor
      rationale: "Permite que el árbol se renderice en el servidor con sus datos."
    - id: b
      text: Hacer peticiones HTTP
      rationale: "Centraliza las peticiones para que no se repitan en cada componente."
  correct: a
  explanation: Context provee un valor a un subárbol sin pasarlo prop a prop.
    Bueno para temas transversales (tema, auth, i18n); abusar de él para estado
    que cambia mucho puede causar re-renders amplios.
  source: externa
  date: 2026-07-14
- id: fs-035
  dimension: fullstack-next-nest-ts
  subtopic: react
  difficulty: experto
  type: concepto
  roles: *a1
  stem: ¿Por qué pasar `{}` u `() => {}` en línea como prop puede provocar
    re-renders de un hijo memoizado (React.memo)?
  options:
    - id: b
      text: Porque los objetos no se pueden pasar como props
      rationale: "Los objetos no se pueden pasar como props y hay que serializarlos antes."
    - id: a
      text: Se crea una referencia NUEVA en cada render; React.memo compara por
        igualdad referencial y la ve como prop cambiada
      rationale: "Se crea una referencia nueva en cada render, y la comparación por identidad la ve como prop cambiada."
    - id: c
      text: Porque memo está roto
      rationale: "La memorización no funciona bien con props que no son primitivas."
    - id: d
      text: Porque TypeScript lo impide
      rationale: "El comprobador de tipos rechaza los literales creados en línea."
  correct: a
  explanation: React.memo hace comparación superficial (referencial) de props. Un
    objeto/función literal se recrea cada render (nueva referencia), así que
    memo no evita el re-render. Se estabiliza con useMemo/useCallback.
  source: externa
  date: 2026-07-14
- id: fs-036
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: easy
  type: concepto
  roles: *a1
  stem: En el App Router de Next.js, ¿qué representan los archivos especiales
    `page.tsx`, `layout.tsx`, `loading.tsx` y `error.tsx`?
  options:
    - id: a
      text: "Convenciones de fichero por segmento de ruta: la página, su layout
        envolvente, el estado de carga (Suspense) y el límite de error"
      rationale: "Convenciones por segmento de ruta: la página, su envoltorio, el estado de carga y el límite de error."
    - id: c
      text: Archivos de configuración de webpack
      rationale: "Ficheros de configuración del empaquetador para ese segmento."
    - id: d
      text: Tests
      rationale: "Ficheros de prueba que acompañan a cada segmento de ruta."
    - id: b
      text: Son solo ejemplos, no tienen significado
      rationale: "Son nombres de ejemplo de la documentación, sin significado especial."
  correct: a
  explanation: "El App Router usa convenciones por carpeta/segmento: page (UI de
    la ruta), layout (envoltura persistente), loading (fallback de Suspense) y
    error (error boundary del segmento)."
  source: externa
  date: 2026-07-14
- id: fs-037
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En el App Router, ¿cómo se define un endpoint de API (no una página)?
  options:
    - id: b
      text: Con un archivo page.tsx
      rationale: "Con el fichero de página, devolviendo datos en vez de interfaz."
    - id: a
      text: "Con un route handler: `app/.../route.ts` exportando funciones
        GET/POST/etc."
      rationale: "Con un manejador de ruta que exporta una función por cada método HTTP."
    - id: d
      text: Con un componente cliente
      rationale: "Con un componente de cliente que responde a las peticiones entrantes."
    - id: c
      text: No se puede, hay que usar otro framework
      rationale: "No se puede: para eso hace falta un servidor aparte."
  correct: a
  explanation: Los route handlers (`route.ts`) exportan funciones por método HTTP
    (GET, POST...) y devuelven Response. Son el equivalente en App Router a las
    API routes de `pages/api`.
  source: externa
  date: 2026-07-14
- id: fs-038
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En un Server Component del App Router, ¿qué controla que un `fetch()` se
    cachee o se reejecute?
  options:
    - id: d
      text: El tamaño de la respuesta
      rationale: "El tamaño de la respuesta, que decide si compensa guardarla."
    - id: c
      text: El color del componente
      rationale: "Dónde se declare el componente dentro del árbol de rutas."
    - id: b
      text: Nada, siempre se cachea eternamente
      rationale: "Nada: una vez obtenido, el resultado se guarda indefinidamente."
    - id: a
      text: "Opciones como `cache: 'no-store'` (sin caché) o `next: { revalidate: N }`
        (revalidar cada N segundos)"
      rationale: "Las opciones de la propia llamada: no guardar nada, o revalidar cada cierto tiempo."
  correct: a
  explanation: "Next extiende fetch con control de caché: por defecto puede
    cachear, `no-store` lo desactiva (dinámico) y `revalidate` fija un tiempo de
    frescura (ISR a nivel de dato). Determina si la ruta es estática o
    dinámica."
  source: externa
  date: 2026-07-14
- id: fs-039
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Qué hace que una ruta del App Router pase a renderizarse de forma
    DINÁMICA (en cada petición) en vez de estática?
  options:
    - id: c
      text: Usar TypeScript
      rationale: "Usar tipos hace que el framework no pueda resolver la ruta al construir."
    - id: d
      text: Importar un CSS
      rationale: "Importar estilos obliga a resolver la ruta en cada petición."
    - id: a
      text: "Usar APIs dinámicas (cookies(), headers(), searchParams) o fetch con
        no-store: Next no puede prerenderizarla en build"
      rationale: "Usar APIs que dependen de la petición —cookies, cabeceras, parámetros— o pedir datos sin caché."
    - id: b
      text: Tener muchos componentes
      rationale: "Tener muchos componentes en el árbol de esa ruta."
  correct: a
  explanation: Si la ruta depende de la petición (cookies/headers/searchParams) o
    de datos sin caché, no se puede generar en build y pasa a render dinámico
    por request. Si todo es estático/cacheable, Next la prerenderiza.
  source: externa
  date: 2026-07-14
- id: fs-040
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: experto
  type: concepto
  roles: *a1
  stem: El App Router tiene varias capas de caché. ¿Cuál describe correctamente
    dos de ellas?
  options:
    - id: a
      text: Data Cache (persiste resultados de fetch entre peticiones/deploys según
        revalidate) y Full Route Cache (HTML/RSC prerenderizado de rutas
        estáticas en build)
      rationale: "Una guarda resultados de peticiones entre visitas; otra, el render de las rutas estáticas."
    - id: d
      text: Next no cachea nada
      rationale: "No hay capas de caché: cada petición se resuelve entera."
    - id: b
      text: Solo hay una caché, la del navegador
      rationale: "Solo existe la del navegador, que es la que guarda el resultado."
    - id: c
      text: Todas las cachés son en cliente
      rationale: "Todas viven en el cliente y se pierden al recargar."
  correct: a
  explanation: "Next tiene: Request Memoization (dedup de fetch en un render),
    Data Cache (persistente, controlada por revalidate/tags), Full Route Cache
    (render estático en build) y Router Cache (navegación en cliente).
    Entenderlas es clave para frescura vs rendimiento."
  source: externa
  date: 2026-07-14
- id: fs-041
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Pasas una función (callback) como prop desde un Server Component a un
    Client Component y Next lanza un error de serialización. ¿Por qué?
  options:
    - id: c
      text: Falta 'use server' en la función
      rationale: "Falta marcar la función para que pueda ejecutarse en el servidor."
    - id: b
      text: Next no permite props
      rationale: "En esa frontera no se pueden pasar props de ningún tipo."
    - id: d
      text: Es un bug de React
      rationale: "Es una limitación temporal de la integración entre las dos capas."
    - id: a
      text: Las props que cruzan de servidor a cliente deben ser serializables; una
        función no lo es. Hay que mover la lógica al cliente o pasar datos
        serializables / Server Actions
      rationale: "Lo que cruza de servidor a cliente tiene que ser serializable, y una función no lo es."
  correct: a
  explanation: El límite servidor→cliente serializa las props (para enviarlas al
    cliente); funciones, clases o valores no serializables no cruzan. Se pasan
    datos planos, o se usa una Server Action (marcada) como acción del cliente.
  source: externa
  date: 2026-07-14
- id: fs-042
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Para qué se usa típicamente el `middleware.ts` en Next.js?
  options:
    - id: c
      text: Definir el modelo de datos
      rationale: "Definir el modelo de datos que comparten las rutas de la aplicación."
    - id: b
      text: Estilar componentes
      rationale: "Aplicar estilos comunes antes de que se pinte cada página."
    - id: a
      text: Interceptar peticiones antes de resolver la ruta (p. ej. auth,
        redirecciones, i18n) en el edge
      rationale: "Interceptar la petición antes de resolver la ruta: autenticación, redirecciones o idioma."
    - id: d
      text: Ejecutar tests
      rationale: "Ejecutar las pruebas automáticas antes de servir la ruta."
  correct: a
  explanation: El middleware corre antes de renderizar la ruta y puede reescribir,
    redirigir o bloquear la petición (auth, geolocalización, A/B, i18n). Se
    ejecuta en el runtime edge, así que tiene límites de APIs.
  source: externa
  date: 2026-07-14
- id: fs-043
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  type: diagrama
  roles: *a1
  stem: >-
    Flujo de una ruta en el App Router (falta el paso ?):

      request -> Server Components (render en servidor) -> HTML + payload RSC -> [ ? ] -> UI interactiva

    ¿Qué va en [ ? ]?
  options:
    - id: d
      text: Reiniciar el servidor
      rationale: "Reiniciar el proceso del servidor para servir la versión recién generada."
    - id: c
      text: Compilar TypeScript en el navegador
      rationale: "Compilar los tipos en el navegador antes de poder ejecutar el código."
    - id: b
      text: Otra petición al servidor por cada click
      rationale: "Una petición nueva al servidor por cada interacción del usuario."
    - id: a
      text: Hidratación en el cliente de los Client Components ('use client')
      rationale: "Hidratar en el cliente los componentes marcados para ejecutarse allí."
  correct: a
  explanation: El servidor renderiza los Server Components y envía HTML + el
    payload RSC; en el cliente, React HIDRATA los Client Components para
    hacerlos interactivos. Los Server Components no se hidratan (no envían su
    JS).
  source: externa
  date: 2026-07-14
- id: fs-044
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Cuál es el rol de un Interceptor en NestJS?
  options:
    - id: d
      text: Conectar a la base de datos
      rationale: "Abrir y cerrar la conexión a la base de datos alrededor de cada petición."
    - id: b
      text: Validar el payload de entrada
      rationale: "Comprobar que el cuerpo de la petición cumple el esquema esperado."
    - id: a
      text: Envolver la ejecución del handler para transformar la respuesta, medir
        tiempos, cachear o mapear excepciones (lógica transversal antes/después)
      rationale: "Envolver la ejecución del manejador para transformar la respuesta, medir tiempos, cachear o mapear excepciones."
    - id: c
      text: Decidir si la petición procede (auth)
      rationale: "Decidir si la petición puede continuar según quién la haga."
  correct: a
  explanation: "Los interceptors usan un patrón alrededor del handler (RxJS):
    pueden transformar la respuesta, añadir logging/timing o mapear resultados.
    La validación es de los Pipes y la autorización de los Guards."
  source: externa
  date: 2026-07-14
- id: fs-045
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Para qué sirve un Exception Filter en NestJS?
  options:
    - id: d
      text: Definir rutas
      rationale: "Declarar qué rutas atiende cada controlador de la aplicación."
    - id: c
      text: Inyectar dependencias
      rationale: "Resolver qué dependencias recibe cada clase al construirse."
    - id: a
      text: Capturar excepciones lanzadas y traducirlas a una respuesta HTTP
        consistente (código y cuerpo de error)
      rationale: "Capturar las excepciones lanzadas y traducirlas a una respuesta HTTP coherente."
    - id: b
      text: Filtrar filas de la base de datos
      rationale: "Filtrar los resultados que devuelve la consulta a la base de datos."
  correct: a
  explanation: "Los exception filters centralizan el manejo de errores: capturan
    excepciones (o una clase concreta) y devuelven una respuesta uniforme,
    evitando fugas de stack traces y unificando el formato de error de la API."
  source: externa
  date: 2026-07-14
- id: fs-046
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Por defecto, ¿qué scope tienen los providers en NestJS?
  options:
    - id: a
      text: "Singleton: una única instancia compartida en toda la aplicación"
      rationale: "Una única instancia compartida por toda la aplicación."
    - id: b
      text: Uno nuevo por cada petición siempre
      rationale: "Uno nuevo en cada petición, para que no se cruce estado entre usuarios."
    - id: d
      text: No se instancian nunca
      rationale: "No se instancian: se resuelven en el momento de usarlos."
    - id: c
      text: Uno por cada método invocado
      rationale: "Uno por cada invocación de método, que es lo más aislado posible."
  correct: a
  explanation: Por defecto los providers son singleton (una instancia para toda la
    app). Se puede pedir scope REQUEST (una por petición) o TRANSIENT cuando
    haga falta, con coste de rendimiento.
  source: externa
  date: 2026-07-14
- id: fs-047
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Para qué sirve un 'custom provider' con `useFactory` o `useValue` y un
    token de inyección?
  options:
    - id: b
      text: Para desactivar la inyección de dependencias
      rationale: "Desactivar la inyección para esa dependencia y construirla a mano."
    - id: a
      text: Registrar dependencias no triviales (valores, instancias construidas
        condicionalmente, config) bajo un token que luego se inyecta
      rationale: "Registrar dependencias no triviales —valores, instancias condicionales, configuración— bajo un token que luego se inyecta."
    - id: c
      text: Para definir rutas HTTP
      rationale: "Declarar rutas asociadas a ese proveedor dentro del módulo."
    - id: d
      text: Para escribir tests solamente
      rationale: "Sustituir dependencias solo en el contexto de las pruebas."
  correct: a
  explanation: Cuando lo que quieres inyectar no es una clase simple (un valor de
    config, una instancia creada por una fábrica, algo condicional), lo
    registras como custom provider con un token (string/símbolo) y lo inyectas
    con @Inject(token).
  source: externa
  date: 2026-07-14
- id: fs-048
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En NestJS, ¿cómo comparte un módulo un provider con otros módulos?
  options:
    - id: a
      text: Debe declararlo en `exports`; el módulo que lo necesita lo trae con
        `imports`
      rationale: "Declarándolo entre lo que exporta; quien lo necesita importa ese módulo."
    - id: b
      text: Todos los providers son globales automáticamente
      rationale: "Todos son visibles desde cualquier módulo sin declarar nada."
    - id: c
      text: Copiando el archivo
      rationale: "Duplicando la declaración del proveedor en cada módulo que lo use."
    - id: d
      text: No se puede compartir
      rationale: "No se comparte: cada módulo instancia el suyo."
  correct: a
  explanation: "Los módulos encapsulan sus providers: solo los que aparecen en
    `exports` son visibles para quien haga `imports` de ese módulo. Es el
    mecanismo de encapsulación/reuso de Nest (salvo módulos marcados @Global)."
  source: externa
  date: 2026-07-14
- id: fs-049
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: experto
  type: concepto
  roles: *a1
  stem: Dos servicios de NestJS se necesitan mutuamente y falla la inyección por
    dependencia circular. ¿Cuál es la solución idiomática?
  options:
    - id: d
      text: Es imposible de resolver
      rationale: "No tiene solución dentro del sistema de inyección: hay que rediseñar."
    - id: c
      text: Fusionar todo en un único archivo gigante
      rationale: "Juntar los dos servicios en uno para que la dependencia desaparezca."
    - id: b
      text: Instanciarlos con 'new' a mano
      rationale: "Construir uno de los dos a mano y pasárselo al otro."
    - id: a
      text: Usar `forwardRef(() => OtroServicio)` en ambos lados para que Nest
        resuelva la referencia diferida
      rationale: "Envolver la referencia para que se resuelva de forma diferida en los dos lados."
  correct: a
  explanation: Ante una dependencia circular, Nest ofrece forwardRef() para
    diferir la resolución del token en ambos providers/módulos. Aun así, una
    circularidad suele señalar que conviene extraer la lógica compartida a un
    tercer servicio.
  source: externa
  date: 2026-07-14
- id: fs-050
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  type: codigo
  roles: *a1
  stem: |-
    @Injectable()
    export class RolesGuard implements CanActivate {
      canActivate(ctx: ExecutionContext): boolean {
        const req = ctx.switchToHttp().getRequest();
        return req.user?.role === 'admin';
      }
    }

    ¿Qué hace este Guard?
  options:
    - id: b
      text: Valida el body de la petición
      rationale: "Comprueba que el cuerpo de la petición cumple lo esperado antes de seguir."
    - id: a
      text: Autoriza la petición solo si el usuario tiene rol 'admin'; si devuelve
        false, Nest responde 403 y no ejecuta el handler
      rationale: "Autoriza solo si el usuario tiene el rol adecuado; si no, responde con prohibido y no ejecuta el manejador."
    - id: c
      text: Transforma la respuesta
      rationale: "Da forma a la respuesta antes de devolverla al cliente."
    - id: d
      text: Conecta a la base de datos
      rationale: "Resuelve la conexión con la base de datos para esa petición."
  correct: a
  explanation: "Un Guard implementa canActivate y decide si la request procede:
    aquí comprueba el rol del usuario (RBAC). Si devuelve false (o lanza), Nest
    corta con 403 y no llega al controlador."
  source: externa
  date: 2026-07-14
