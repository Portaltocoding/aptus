# Banco real v2 (Phase 2) — 66 preguntas hand-curadas, técnicamente correctas.
# 5 dimensiones: llm-rag-evals (15), ml-clasico (15), fullstack-next-nest-ts (12),
# ai-product-system-design (12), comportamental-star (12).
#
# Semántica de `source` (para auditar el sesgo de autocuración, curador = evaluado):
#   - "bootcamp-ml-llm": pregunta sobre material que forma parte del temario del
#     bootcamp que Carlos estudió/creó (módulos m0-m17). Mayor solape con su
#     autoestudio => mayor riesgo de que el score refleje familiaridad, no dominio.
#   - "externa": conocimiento externo independiente del bootcamp (p. ej. su stack
#     profesional Next/Nest/TS, o marcos universales como STAR). Señal más objetiva.

# ============================================================
# Dimensión: llm-rag-evals (LLM / RAG / evals)
# ============================================================

- id: llm-001
  dimension: llm-rag-evals
  subtopic: chunking
  difficulty: easy
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "En un pipeline RAG, ¿cuál es el motivo principal de usar 'chunk overlap' (solape) al trocear los documentos?"
  options:
    - id: a
      text: "Reducir el tamaño total del índice vectorial"
    - id: b
      text: "Evitar que información relevante quede cortada justo en el límite entre dos fragmentos"
    - id: c
      text: "Acelerar la generación de embeddings"
    - id: d
      text: "Eliminar la necesidad de un modelo de reranking"
  correct: b
  explanation: "El overlap entre chunks consecutivos evita que una idea o frase relevante quede partida exactamente en el corte, de forma que al menos uno de los fragmentos solapados la contenga completa y pueda recuperarse."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-002
  dimension: llm-rag-evals
  subtopic: embeddings
  difficulty: easy
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Qué representa, en esencia, un embedding de texto generado por un modelo de lenguaje?"
  options:
    - id: a
      text: "Un resumen comprimido en texto plano del contenido original"
    - id: b
      text: "Un vector numérico de dimensión fija que codifica el significado semántico del texto en un espacio donde textos similares quedan cerca"
    - id: c
      text: "El identificador único (hash) del texto en la base de datos"
    - id: d
      text: "La lista de tokens exactos que componen el texto"
  correct: b
  explanation: "Un embedding es una representación vectorial de dimensión fija; el modelo se entrena para que textos semánticamente similares se ubiquen cerca en ese espacio vectorial, permitiendo búsqueda por similitud."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-003
  dimension: llm-rag-evals
  subtopic: retrieval
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "En un sistema de recuperación semántica que usa similitud coseno sobre embeddings normalizados (norma 1), ¿qué relación existe con la distancia euclídea a la hora de ordenar resultados?"
  options:
    - id: a
      text: "No guardan ninguna relación, hay que calcular ambas por separado"
    - id: b
      text: "Para vectores normalizados, maximizar la similitud coseno equivale a minimizar la distancia euclídea, por lo que el ranking resultante es el mismo"
    - id: c
      text: "La similitud coseno solo funciona con vectores de números enteros"
    - id: d
      text: "La distancia euclídea siempre da un ranking inverso al de la similitud coseno"
  correct: b
  explanation: "Cuando los vectores están normalizados a norma 1, ||a-b||^2 = 2 - 2·cos(a,b); como la relación es monótona decreciente, ordenar por mayor similitud coseno da exactamente el mismo orden que ordenar por menor distancia euclídea."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-004
  dimension: llm-rag-evals
  subtopic: alucinacion
  difficulty: easy
  roles: ["AI Engineer", "LLM Engineer", "Product Manager"]
  stem: "¿Qué se entiende por 'alucinación' en un modelo de lenguaje generativo?"
  options:
    - id: a
      text: "Un fallo de red que impide al modelo responder"
    - id: b
      text: "La generación de contenido que suena fluido y seguro pero es factualmente incorrecto o no está respaldado por las fuentes/datos disponibles"
    - id: c
      text: "Un error de sintaxis en el JSON de salida"
    - id: d
      text: "El uso de un vocabulario excesivamente técnico"
  correct: b
  explanation: "La alucinación es la generación de afirmaciones plausibles y bien redactadas que no se corresponden con hechos reales ni con la evidencia/contexto proporcionado, sin que el modelo señale incertidumbre."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-005
  dimension: llm-rag-evals
  subtopic: evals-faithfulness
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "En evaluación de sistemas RAG, la métrica 'faithfulness' (fidelidad) mide principalmente..."
  options:
    - id: a
      text: "Si la respuesta generada está soportada por el contexto recuperado, sin añadir afirmaciones no presentes en él"
    - id: b
      text: "La velocidad de respuesta del sistema en milisegundos"
    - id: c
      text: "Si la pregunta del usuario está bien formulada gramaticalmente"
    - id: d
      text: "El número total de documentos recuperados"
  correct: a
  explanation: "Faithfulness evalúa si cada afirmación de la respuesta puede atribuirse al contexto recuperado; una respuesta poco fiel introduce contenido que no proviene de las fuentes, es decir, alucina sobre el propio contexto."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-006
  dimension: llm-rag-evals
  subtopic: evals-context-precision
  difficulty: hard
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Qué diferencia a 'context precision' de 'context recall' al evaluar el módulo de recuperación de un RAG?"
  options:
    - id: a
      text: "Son sinónimos, dos nombres para la misma métrica"
    - id: b
      text: "Context precision mide qué proporción de los fragmentos recuperados son realmente relevantes; context recall mide qué proporción de los fragmentos relevantes existentes en el corpus fueron efectivamente recuperados"
    - id: c
      text: "Context precision solo aplica a modelos cerrados (closed-source)"
    - id: d
      text: "Context recall se calcula sobre la respuesta generada, no sobre los fragmentos recuperados"
  correct: b
  explanation: "Precision y recall aplicados a retrieval: precision = relevantes_recuperados / total_recuperados (ruido en lo recuperado); recall = relevantes_recuperados / total_relevantes_existentes (cobertura). Un RAG puede tener alta precisión pero baja cobertura si el top-k es pequeño."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-007
  dimension: llm-rag-evals
  subtopic: sampling
  difficulty: easy
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "Al generar texto con un LLM, ¿qué efecto tiene aumentar el parámetro 'temperature' (por encima de 0)?"
  options:
    - id: a
      text: "Hace la salida más determinista y repetitiva"
    - id: b
      text: "Aplana la distribución de probabilidad sobre el siguiente token, aumentando la aleatoriedad y diversidad de la salida"
    - id: c
      text: "Reduce el tamaño del contexto disponible"
    - id: d
      text: "Aumenta la longitud máxima de la respuesta"
  correct: b
  explanation: "Temperature reescala los logits antes del softmax; valores más altos aplanan la distribución de probabilidad, haciendo que tokens menos probables tengan más chance de ser elegidos, lo que incrementa la diversidad (y el riesgo de incoherencia)."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-008
  dimension: llm-rag-evals
  subtopic: rag-vs-finetuning
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer", "Product Manager"]
  stem: "Un equipo necesita que su asistente responda con información que cambia semanalmente (precios, stock). ¿Por qué RAG suele ser más adecuado que el fine-tuning para este caso?"
  options:
    - id: a
      text: "Porque el fine-tuning es siempre gratuito y RAG siempre es más caro"
    - id: b
      text: "Porque RAG permite actualizar el conocimiento simplemente actualizando el índice/documentos, sin reentrenar el modelo, mientras que el fine-tuning fija el conocimiento en los pesos hasta el siguiente reentrenamiento"
    - id: c
      text: "Porque RAG elimina por completo la posibilidad de alucinación"
    - id: d
      text: "Porque el fine-tuning no puede usarse nunca con datos privados"
  correct: b
  explanation: "RAG separa el conocimiento (en un índice externo, actualizable en tiempo real) del modelo; el fine-tuning 'hornea' el conocimiento en los pesos del modelo, por lo que datos que cambian con frecuencia quedarían desactualizados hasta un nuevo ciclo de reentrenamiento."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-009
  dimension: llm-rag-evals
  subtopic: vector-db
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Para qué se usan índices de búsqueda aproximada de vecinos más cercanos (ANN, p. ej. HNSW) en una base de datos vectorial?"
  options:
    - id: a
      text: "Para garantizar siempre el resultado exacto más similar, sin excepción"
    - id: b
      text: "Para encontrar vecinos aproximados de forma mucho más rápida que una búsqueda exhaustiva (fuerza bruta), a cambio de una pequeña pérdida de exactitud"
    - id: c
      text: "Para comprimir los embeddings a texto plano"
    - id: d
      text: "Para entrenar el modelo de embeddings desde cero"
  correct: b
  explanation: "En corpus grandes, comparar un vector contra todos los demás (búsqueda exacta) es demasiado costoso; estructuras como HNSW o IVF sacrifican una pequeña cantidad de exactitud (aproximado) para lograr búsquedas sublineales mucho más rápidas."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-010
  dimension: llm-rag-evals
  subtopic: context-window
  difficulty: easy
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Qué es la 'ventana de contexto' (context window) de un LLM?"
  options:
    - id: a
      text: "El número máximo de usuarios que pueden usar el modelo a la vez"
    - id: b
      text: "La cantidad máxima de tokens (entrada + salida) que el modelo puede procesar/tener en cuenta en una sola llamada"
    - id: c
      text: "El tiempo máximo de espera antes de que expire una petición"
    - id: d
      text: "El número de capas (layers) del modelo"
  correct: b
  explanation: "La ventana de contexto es el límite de tokens que el modelo puede atender simultáneamente en una llamada; todo lo que exceda ese límite (prompt + contexto recuperado + historial + respuesta) queda fuera o debe truncarse/resumirse."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-011
  dimension: llm-rag-evals
  subtopic: tokenization
  difficulty: hard
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Por qué la mayoría de LLMs modernos usan tokenización por subpalabras (p. ej. BPE/byte-pair encoding) en lugar de tokenizar por palabra completa?"
  options:
    - id: a
      text: "Porque es más fácil de leer para los humanos"
    - id: b
      text: "Porque permite un vocabulario finito que aun así puede representar palabras raras, nombres propios o errores tipográficos combinando subunidades, evitando el problema de palabras fuera de vocabulario (OOV)"
    - id: c
      text: "Porque reduce a la mitad el número de parámetros del modelo"
    - id: d
      text: "Porque elimina por completo la necesidad de un embedding por token"
  correct: b
  explanation: "La tokenización por palabra completa requeriría un vocabulario enorme y aun así fallaría con palabras nuevas (OOV); BPE construye subpalabras frecuentes de modo que cualquier palabra, incluso desconocida, pueda componerse a partir de fragmentos ya presentes en el vocabulario."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-012
  dimension: llm-rag-evals
  subtopic: prompting
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer", "Prompt Engineer"]
  stem: "¿Cuál es la diferencia entre un prompt 'zero-shot' y uno 'few-shot'?"
  options:
    - id: a
      text: "El zero-shot no usa ningún modelo de lenguaje"
    - id: b
      text: "El few-shot incluye en el propio prompt varios ejemplos de entrada/salida deseada antes de la pregunta real, mientras que el zero-shot no incluye ningún ejemplo"
    - id: c
      text: "Son sinónimos"
    - id: d
      text: "El few-shot solo funciona con modelos ajustados por fine-tuning"
  correct: b
  explanation: "En few-shot prompting se incluyen ejemplos representativos de la tarea directamente en el contexto para guiar el formato/estilo de la respuesta; en zero-shot se pide la tarea directamente, confiando solo en la capacidad general del modelo."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-013
  dimension: llm-rag-evals
  subtopic: rag-failure-modes
  difficulty: hard
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "El fenómeno 'lost in the middle' observado en LLMs con contextos largos se refiere a que..."
  options:
    - id: a
      text: "El modelo pierde la conexión de red a mitad de la generación"
    - id: b
      text: "El modelo tiende a prestar menos atención a la información situada en el medio de un contexto largo, siendo más preciso con lo que aparece al principio o al final"
    - id: c
      text: "Los embeddings del medio del texto siempre tienen menor dimensión"
    - id: d
      text: "Los documentos recuperados en la posición intermedia del ranking nunca se muestran al usuario"
  correct: b
  explanation: "Estudios empíricos muestran que, ante contextos largos, los LLMs recuperan y usan mejor la información situada al inicio o al final del contexto que la que está en posiciones intermedias, lo que afecta el diseño del orden en que se inyectan los fragmentos recuperados en un RAG."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-014
  dimension: llm-rag-evals
  subtopic: reranking
  difficulty: medium
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "¿Qué función cumple un 'reranker' en un pipeline RAG, tras la recuperación inicial por embeddings?"
  options:
    - id: a
      text: "Genera la respuesta final en lugar del LLM principal"
    - id: b
      text: "Reordena un conjunto más amplio de candidatos recuperados usando un modelo más preciso (aunque más costoso) para priorizar los fragmentos realmente más relevantes antes de pasarlos al LLM"
    - id: c
      text: "Elimina la necesidad de generar embeddings"
    - id: d
      text: "Traduce automáticamente los documentos a otro idioma"
  correct: b
  explanation: "La recuperación inicial por similitud de embeddings es rápida pero aproximada; un reranker (habitualmente un cross-encoder) analiza pregunta y documento conjuntamente para dar un score de relevancia más fino, reordenando el top-k antes de construir el prompt final."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: llm-015
  dimension: llm-rag-evals
  subtopic: grounding
  difficulty: hard
  roles: ["AI Engineer", "LLM Engineer"]
  stem: "Aunque RAG reduce la alucinación respecto a un LLM sin contexto externo, ¿por qué NO la elimina por completo?"
  options:
    - id: a
      text: "Porque RAG nunca recupera documentos reales"
    - id: b
      text: "Porque el LLM puede seguir generando afirmaciones no soportadas por el contexto recuperado (falta de fidelidad), o el retriever puede devolver contexto irrelevante o insuficiente, en ambos casos abriendo espacio a contenido inventado"
    - id: c
      text: "Porque los embeddings siempre son aleatorios"
    - id: d
      text: "Porque RAG desactiva el mecanismo de atención del modelo"
  correct: b
  explanation: "RAG mitiga la alucinación dando al modelo contexto verificado, pero no lo garantiza: el modelo puede ignorar o distorsionar ese contexto (falta de faithfulness), y el propio retriever puede fallar trayendo fragmentos poco relevantes, dejando al modelo sin evidencia real para responder con precisión."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

# ============================================================
# Dimensión: ml-clasico (ML clásico)
# ============================================================

- id: ml-001
  dimension: ml-clasico
  subtopic: bias-variance
  difficulty: easy
  roles: ["ML Engineer", "Data Scientist"]
  stem: "En el compromiso sesgo-varianza (bias-variance tradeoff), un modelo con alto sesgo (bias) y baja varianza típicamente..."
  options:
    - id: a
      text: "Se ajusta demasiado a los datos de entrenamiento y generaliza mal (overfitting)"
    - id: b
      text: "Es demasiado simple para capturar la relación real de los datos, produciendo errores sistemáticos tanto en train como en test (underfitting)"
    - id: c
      text: "Siempre logra el mejor rendimiento posible en test"
    - id: d
      text: "No depende del conjunto de datos usado para entrenar"
  correct: b
  explanation: "Alto sesgo significa que el modelo hace suposiciones demasiado simples (p. ej. una recta para una relación no lineal), por lo que no logra capturar el patrón real ni siquiera en entrenamiento: es underfitting, con error alto y estable en train y test."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-002
  dimension: ml-clasico
  subtopic: overfitting
  difficulty: easy
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Qué señal característica indica que un modelo está sobreajustando (overfitting) a los datos de entrenamiento?"
  options:
    - id: a
      text: "Error alto tanto en entrenamiento como en validación"
    - id: b
      text: "Error muy bajo en entrenamiento pero notablemente más alto en validación/test"
    - id: c
      text: "Error igual en entrenamiento y validación, ambos altos"
    - id: d
      text: "El modelo tarda más en entrenar que en predecir"
  correct: b
  explanation: "El overfitting ocurre cuando el modelo memoriza patrones específicos (incluido ruido) del set de entrenamiento; por eso el error de entrenamiento es muy bajo mientras que el de validación/test, con datos no vistos, es claramente peor: el modelo no generaliza."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-003
  dimension: ml-clasico
  subtopic: regularizacion-l2
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Qué efecto tiene añadir un término de regularización L2 (ridge) a la función de pérdida de un modelo lineal?"
  options:
    - id: a
      text: "Fuerza a que algunos coeficientes sean exactamente cero, actuando como selección de variables"
    - id: b
      text: "Penaliza la magnitud al cuadrado de los coeficientes, encogiéndolos hacia cero (sin anularlos necesariamente) y reduciendo la varianza del modelo"
    - id: c
      text: "Aumenta artificialmente el tamaño del dataset de entrenamiento"
    - id: d
      text: "Elimina la necesidad de normalizar las features"
  correct: b
  explanation: "La regularización L2 añade lambda * suma(w_i^2) a la pérdida; esto penaliza coeficientes grandes y los encoge de forma suave hacia cero, reduciendo la varianza (y el riesgo de overfitting) a costa de un pequeño aumento de sesgo, pero rara vez lleva coeficientes exactamente a cero."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-004
  dimension: ml-clasico
  subtopic: regularizacion-l1
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "A diferencia de L2, la regularización L1 (lasso) es conocida por..."
  options:
    - id: a
      text: "Producir soluciones dispersas (sparse), llevando algunos coeficientes exactamente a cero, lo que la hace útil para selección automática de features"
    - id: b
      text: "Ser matemáticamente idéntica a L2 en sus efectos"
    - id: c
      text: "Solo poder aplicarse a modelos de árboles"
    - id: d
      text: "Aumentar siempre la varianza del modelo respecto a no regularizar"
  correct: a
  explanation: "La penalización L1 (suma de valores absolutos de los coeficientes) tiene una geometría que favorece soluciones en las esquinas de la región factible, anulando exactamente algunos coeficientes; esto la convierte en un mecanismo de selección de variables implícito, a diferencia de L2."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-005
  dimension: ml-clasico
  subtopic: precision-recall
  difficulty: easy
  roles: ["ML Engineer", "Data Scientist"]
  stem: "En un problema de clasificación binaria, la 'precision' (precisión) se define como..."
  options:
    - id: a
      text: "TP / (TP + FN): de todos los positivos reales, cuántos se detectaron"
    - id: b
      text: "TP / (TP + FP): de todas las predicciones positivas del modelo, cuántas eran realmente positivas"
    - id: c
      text: "(TP + TN) / total: proporción total de aciertos"
    - id: d
      text: "TN / (TN + FP): de todos los negativos reales, cuántos se detectaron correctamente"
  correct: b
  explanation: "Precision mide la fiabilidad de las predicciones positivas del modelo: de todo lo que el modelo marcó como positivo, qué fracción era efectivamente positivo (TP / (TP+FP)). No debe confundirse con recall, que mide cobertura sobre los positivos reales."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-006
  dimension: ml-clasico
  subtopic: precision-recall
  difficulty: easy
  roles: ["ML Engineer", "Data Scientist"]
  stem: "El 'recall' (sensibilidad/exhaustividad) en clasificación binaria mide..."
  options:
    - id: a
      text: "TP / (TP + FP)"
    - id: b
      text: "TP / (TP + FN): de todos los casos positivos reales, cuántos logró detectar el modelo"
    - id: c
      text: "El porcentaje de predicciones negativas correctas"
    - id: d
      text: "La media aritmética entre precision y accuracy"
  correct: b
  explanation: "Recall (o sensibilidad) responde a: de todos los casos que realmente eran positivos, ¿cuántos identificó el modelo correctamente? Se calcula como TP / (TP + FN); un recall bajo indica que el modelo deja escapar muchos positivos reales (falsos negativos)."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-007
  dimension: ml-clasico
  subtopic: f1-score
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Por qué el F1-score se define como la media armónica de precision y recall, en lugar de su media aritmética?"
  options:
    - id: a
      text: "Porque es matemáticamente más simple de calcular"
    - id: b
      text: "Porque la media armónica penaliza más fuertemente los valores bajos, de modo que el F1 solo es alto cuando AMBAS métricas (precision y recall) son razonablemente altas, evitando que un valor extremo compense al otro"
    - id: c
      text: "Porque la media armónica siempre da un resultado mayor que la aritmética"
    - id: d
      text: "Porque el F1-score no tiene relación con precision y recall"
  correct: b
  explanation: "La media armónica se ve dominada por el valor más bajo de los dos; así, un modelo con precision=1.0 y recall=0.1 tendría una media aritmética engañosamente alta (0.55) pero un F1 bajo (~0.18), reflejando mejor que el modelo falla gravemente en una de las dos dimensiones."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-008
  dimension: ml-clasico
  subtopic: cross-validation
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Cuál es el propósito principal de la validación cruzada k-fold frente a usar un único split train/test?"
  options:
    - id: a
      text: "Entrenar k modelos distintos para hacer ensemble obligatoriamente en producción"
    - id: b
      text: "Obtener una estimación más robusta y menos dependiente del azar del rendimiento del modelo, promediando el desempeño sobre k particiones distintas de los datos"
    - id: c
      text: "Eliminar por completo la necesidad de un conjunto de test final"
    - id: d
      text: "Aumentar artificialmente el tamaño del dataset"
  correct: b
  explanation: "Un único split train/test puede dar una estimación de rendimiento sesgada por cómo cayeron los datos en esa partición concreta. K-fold divide los datos en k partes, entrena y evalúa k veces rotando qué parte se usa como validación, y promedia los resultados para una estimación más estable y fiable."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-009
  dimension: ml-clasico
  subtopic: gradient-descent
  difficulty: hard
  roles: ["ML Engineer", "Data Scientist"]
  stem: "Si el learning rate (tasa de aprendizaje) del descenso de gradiente es demasiado alto, el síntoma típico durante el entrenamiento es..."
  options:
    - id: a
      text: "Convergencia extremadamente lenta pero estable"
    - id: b
      text: "La función de pérdida oscila, diverge o 'rebota' sin converger, en vez de disminuir de forma estable hacia un mínimo"
    - id: c
      text: "El modelo converge instantáneamente al mínimo global en una sola iteración"
    - id: d
      text: "No tiene ningún efecto sobre el entrenamiento"
  correct: b
  explanation: "Con un learning rate excesivo, cada actualización de los pesos da 'pasos' demasiado grandes en la superficie de la función de pérdida, pudiendo saltar por encima del mínimo repetidamente; esto se manifiesta como una pérdida que oscila o incluso crece (diverge) en lugar de bajar monotónicamente."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-010
  dimension: ml-clasico
  subtopic: feature-scaling
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Por qué suele ser necesario escalar (normalizar/estandarizar) las features antes de entrenar un modelo basado en distancias, como KNN, o un modelo con descenso de gradiente?"
  options:
    - id: a
      text: "Porque los algoritmos no aceptan números decimales"
    - id: b
      text: "Porque features con rangos de magnitud muy distintos dominan el cálculo de distancia o el gradiente, sesgando el modelo hacia las variables de mayor escala aunque no sean más informativas"
    - id: c
      text: "Porque reduce el número de features automáticamente"
    - id: d
      text: "Solo es necesario para variables categóricas"
  correct: b
  explanation: "Si una feature va de 0 a 1 y otra de 0 a 100000, en un cálculo de distancia euclídea o en el gradiente la segunda dominará completamente el resultado independientemente de su relevancia real; escalar (p. ej. estandarizar a media 0 y varianza 1) pone a todas las features en una escala comparable."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-011
  dimension: ml-clasico
  subtopic: decision-trees
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "Los árboles de decisión sin restricciones (sin poda ni profundidad máxima) tienden a..."
  options:
    - id: a
      text: "Underfitting sistemático, sin importar el dataset"
    - id: b
      text: "Sobreajustar (overfitting) el conjunto de entrenamiento, creciendo hasta separar casos muy específicos o ruido, por lo que necesitan poda o límites de profundidad para generalizar bien"
    - id: c
      text: "Ser insensibles al ruido en los datos"
    - id: d
      text: "No poder usarse nunca para clasificación, solo para regresión"
  correct: b
  explanation: "Un árbol sin límite puede seguir dividiendo hasta que cada hoja contenga un único ejemplo, memorizando el ruido del set de entrenamiento; técnicas como la poda (pruning), max_depth o min_samples_leaf limitan esa complejidad para mejorar la generalización."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-012
  dimension: ml-clasico
  subtopic: random-forest
  difficulty: hard
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Por qué un Random Forest (bagging de árboles con selección aleatoria de features) suele reducir la varianza respecto a un único árbol de decisión?"
  options:
    - id: a
      text: "Porque cada árbol individual se vuelve por sí solo menos propenso a overfitting"
    - id: b
      text: "Porque promedia (o vota) las predicciones de muchos árboles entrenados sobre distintos subconjuntos de datos y features; si los errores de cada árbol están poco correlacionados, tienden a cancelarse al promediar"
    - id: c
      text: "Porque usa una sola muestra de datos para todos los árboles, garantizando consistencia"
    - id: d
      text: "Porque reduce automáticamente el número de features del dataset original"
  correct: b
  explanation: "Cada árbol del bosque puede seguir siendo de alta varianza individualmente, pero al entrenarlos sobre bootstrap samples distintos y subconjuntos aleatorios de features, sus errores tienden a estar poco correlacionados; promediar (regresión) o votar (clasificación) esas predicciones reduce la varianza global del conjunto sin aumentar mucho el sesgo."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-013
  dimension: ml-clasico
  subtopic: svm
  difficulty: hard
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Para qué sirve el 'kernel trick' en una Support Vector Machine (SVM)?"
  options:
    - id: a
      text: "Para acelerar el entrenamiento reduciendo el número de muestras"
    - id: b
      text: "Para permitir separar clases que no son linealmente separables en el espacio original, calculando de forma eficiente el producto escalar equivalente a proyectar los datos a un espacio de mayor dimensión sin construir explícitamente esa proyección"
    - id: c
      text: "Para convertir un problema de clasificación en uno de regresión"
    - id: d
      text: "Para eliminar la necesidad de un margen de separación"
  correct: b
  explanation: "El kernel trick permite calcular el producto escalar que tendrían los datos en un espacio de características de dimensión mayor (donde sí podrían ser linealmente separables) sin tener que transformarlos explícitamente a ese espacio, lo cual sería computacionalmente muy costoso: solo se calcula la función kernel K(x,y)."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-014
  dimension: ml-clasico
  subtopic: k-means
  difficulty: medium
  roles: ["ML Engineer", "Data Scientist"]
  stem: "¿Cuál es una limitación conocida del algoritmo k-means?"
  options:
    - id: a
      text: "No requiere especificar de antemano el número de clusters k"
    - id: b
      text: "Requiere elegir k de antemano y el resultado final es sensible a la inicialización aleatoria de los centroides, pudiendo converger a un óptimo local distinto en cada corrida"
    - id: c
      text: "Solo puede usarse con datos etiquetados (aprendizaje supervisado)"
    - id: d
      text: "Garantiza siempre encontrar la partición óptima global"
  correct: b
  explanation: "k-means necesita que el número de clusters k se fije de antemano (no lo aprende de los datos) y, al depender de una inicialización aleatoria de los centroides, distintas corridas pueden converger a óptimos locales diferentes; por eso en la práctica se ejecuta varias veces (p. ej. k-means++) y se elige la mejor."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: ml-015
  dimension: ml-clasico
  subtopic: class-imbalance
  difficulty: easy
  roles: ["ML Engineer", "Data Scientist"]
  stem: "En un dataset con fuerte desbalanceo de clases (p. ej. 99% clase A, 1% clase B), ¿por qué la métrica 'accuracy' puede ser engañosa?"
  options:
    - id: a
      text: "Porque accuracy no puede calcularse en problemas binarios"
    - id: b
      text: "Porque un modelo trivial que siempre predice la clase mayoritaria obtendría un 99% de accuracy sin haber aprendido nada útil sobre la clase minoritaria"
    - id: c
      text: "Porque accuracy solo existe para problemas de regresión"
    - id: d
      text: "Porque accuracy siempre penaliza más a la clase mayoritaria"
  correct: b
  explanation: "Con clases muy desbalanceadas, un clasificador que ignore por completo la clase minoritaria y prediga siempre la mayoritaria logra una accuracy muy alta sin ningún valor práctico; por eso en estos casos se prefieren métricas como precision, recall, F1 o AUC-PR, sensibles al desempeño sobre la clase minoritaria."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

# ============================================================
# Dimensión: fullstack-next-nest-ts (Next.js / NestJS / TypeScript)
# source: externa — stack profesional de Carlos, fuera del temario del bootcamp.
# ============================================================

- id: fs-001
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: easy
  roles: ["Full Stack Engineer", "AI Product Engineer"]
  stem: "En TypeScript, ¿qué utility type convierte todas las propiedades de un tipo en opcionales?"
  options:
    - id: a
      text: "Required<T>"
    - id: b
      text: "Partial<T>"
    - id: c
      text: "Readonly<T>"
    - id: d
      text: "Pick<T, K>"
  correct: b
  explanation: "Partial<T> mapea cada propiedad a opcional (prop?: tipo). Required<T> hace lo contrario, Readonly<T> las hace inmutables y Pick<T,K> selecciona un subconjunto de claves."
  source: "externa"
  date: "2026-07-14"

- id: fs-002
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  roles: ["Full Stack Engineer"]
  stem: "¿Cuál es la diferencia práctica clave entre los tipos 'unknown' y 'any' en TypeScript?"
  options:
    - id: a
      text: "Son sinónimos, 'unknown' es solo un alias más moderno de 'any'"
    - id: b
      text: "'unknown' es type-safe: obliga a estrechar el tipo (narrowing) antes de operar con el valor, mientras 'any' desactiva toda comprobación"
    - id: c
      text: "'any' solo se puede usar en tipos de retorno y 'unknown' solo en parámetros"
    - id: d
      text: "'unknown' no existe en TypeScript, es de Flow"
  correct: b
  explanation: "'unknown' acepta cualquier valor pero no permite acceder a propiedades ni llamarlo sin antes estrechar el tipo (typeof, instanceof, guards). 'any' apaga el chequeo de tipos por completo, propagando inseguridad."
  source: "externa"
  date: "2026-07-14"

- id: fs-003
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: medium
  roles: ["Full Stack Engineer"]
  stem: "Tienes un tipo union 'type Shape = Circle | Square' donde cada miembro tiene un campo literal 'kind'. ¿Cómo se llama el patrón que permite a TypeScript estrechar el tipo dentro de un switch sobre 'shape.kind'?"
  options:
    - id: a
      text: "Discriminated union (union etiquetada)"
    - id: b
      text: "Intersection type"
    - id: c
      text: "Conditional type"
    - id: d
      text: "Mapped type"
  correct: a
  explanation: "Una discriminated union usa un campo literal común (el discriminante, aquí 'kind') para que el compilador estreche automáticamente al miembro correcto en cada rama del switch, dando exhaustividad verificable."
  source: "externa"
  date: "2026-07-14"

- id: fs-004
  dimension: fullstack-next-nest-ts
  subtopic: typescript
  difficulty: hard
  roles: ["Full Stack Engineer"]
  stem: "¿Qué aporta el operador 'satisfies' de TypeScript frente a una anotación de tipo normal ': T'?"
  options:
    - id: a
      text: "Comprueba que el valor cumple el tipo T pero conserva el tipo literal más estrecho inferido del valor, en vez de ensancharlo a T"
    - id: b
      text: "Convierte el valor a T en tiempo de ejecución (cast real)"
    - id: c
      text: "Hace que el valor sea readonly"
    - id: d
      text: "Es equivalente a 'as T' pero más lento"
  correct: a
  explanation: "'satisfies' valida la compatibilidad con T sin descartar la información literal: p. ej. un objeto de config queda validado contra el tipo pero cada clave mantiene su tipo estrecho, algo que ': T' perdería al ensanchar. No hay efecto en runtime."
  source: "externa"
  date: "2026-07-14"

- id: fs-005
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: easy
  roles: ["Full Stack Engineer", "AI Product Engineer"]
  stem: "En Next.js, ¿qué diferencia hay entre SSG (Static Site Generation) y SSR (Server-Side Rendering)?"
  options:
    - id: a
      text: "SSG renderiza en el navegador; SSR en el servidor"
    - id: b
      text: "SSG genera el HTML en tiempo de build (una vez); SSR lo genera en el servidor en cada petición"
    - id: c
      text: "Son lo mismo, solo cambia el nombre según la versión"
    - id: d
      text: "SSR solo funciona sin JavaScript y SSG requiere JavaScript"
  correct: b
  explanation: "SSG produce HTML estático en el build y lo sirve igual a todos (ideal para contenido que cambia poco). SSR ejecuta el render en el servidor por cada request, útil cuando el contenido depende de la petición (usuario, datos frescos)."
  source: "externa"
  date: "2026-07-14"

- id: fs-006
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles: ["Full Stack Engineer", "AI Product Engineer"]
  stem: "En el App Router de Next.js, ¿qué caracteriza a un React Server Component (RSC) por defecto?"
  options:
    - id: a
      text: "Se ejecuta en el servidor, no envía su JS al cliente y no puede usar hooks de estado como useState/useEffect"
    - id: b
      text: "Se ejecuta solo en el cliente y siempre requiere 'use client'"
    - id: c
      text: "Es idéntico a un componente cliente pero con otro nombre"
    - id: d
      text: "Solo puede renderizar texto plano, no otros componentes"
  correct: a
  explanation: "En el App Router los componentes son Server Components por defecto: corren en el servidor, pueden hacer fetch/acceso a datos directamente y no mandan JS al bundle del cliente. Para interactividad con estado/efectos hace falta marcar 'use client'."
  source: "externa"
  date: "2026-07-14"

- id: fs-007
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles: ["Full Stack Engineer"]
  stem: "¿Qué hace Incremental Static Regeneration (ISR) en Next.js?"
  options:
    - id: a
      text: "Regenera todo el sitio en cada request"
    - id: b
      text: "Permite regenerar páginas estáticas en segundo plano tras un intervalo ('revalidate'), sirviendo la versión cacheada hasta que la nueva esté lista"
    - id: c
      text: "Deshabilita el cache por completo"
    - id: d
      text: "Convierte las páginas en client-side rendering"
  correct: b
  explanation: "ISR combina lo estático con frescura: la página se sirve desde cache y, pasado el tiempo de 'revalidate', Next.js la regenera en background y sustituye la versión servida, sin rebuild completo del sitio ni SSR en cada petición."
  source: "externa"
  date: "2026-07-14"

- id: fs-008
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: hard
  roles: ["Full Stack Engineer", "AI Product Engineer"]
  stem: "Tras mutar datos con una Server Action en Next.js, ¿cuál es la forma idiomática de que la UI refleje el cambio sin recargar toda la página a mano?"
  options:
    - id: a
      text: "Llamar a revalidatePath() o revalidateTag() para invalidar el cache del segmento afectado y que Next.js vuelva a renderizarlo"
    - id: b
      text: "Hacer window.location.reload() al final de la acción"
    - id: c
      text: "Guardar el estado en localStorage y leerlo en el próximo render"
    - id: d
      text: "No es posible: las Server Actions no pueden refrescar datos"
  correct: a
  explanation: "revalidatePath/revalidateTag invalidan el cache de datos/segmento tras la mutación, de modo que el siguiente render en servidor trae los datos frescos. Es el mecanismo idiomático; un reload completo pierde el beneficio de la navegación por RSC."
  source: "externa"
  date: "2026-07-14"

- id: fs-009
  dimension: fullstack-next-nest-ts
  subtopic: nextjs
  difficulty: medium
  roles: ["Full Stack Engineer"]
  stem: "¿Cuál es una causa típica de un 'hydration mismatch' en Next.js/React?"
  options:
    - id: a
      text: "Renderizar en el servidor un HTML distinto al que produce el cliente en el primer render (p. ej. usar Date.now(), Math.random() o window durante el render)"
    - id: b
      text: "Usar demasiados componentes"
    - id: c
      text: "Tener el bundle de JS demasiado pequeño"
    - id: d
      text: "Definir tipos con TypeScript"
  correct: a
  explanation: "La hidratación asume que el HTML del servidor coincide con el primer render del cliente. Si el árbol difiere (valores no deterministas, acceso a APIs de navegador solo disponibles en cliente), React detecta el desajuste y avisa/re-renderiza, con parpadeos o errores."
  source: "externa"
  date: "2026-07-14"

- id: fs-010
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  roles: ["Full Stack Engineer", "Backend Engineer"]
  stem: "En NestJS, ¿qué principio arquitectónico está en el centro de cómo se conectan controllers, services y repositories?"
  options:
    - id: a
      text: "Inyección de dependencias (DI): los providers se declaran y Nest los inyecta por su token/tipo, en vez de instanciarlos a mano"
    - id: b
      text: "Herencia múltiple entre controllers"
    - id: c
      text: "Variables globales compartidas entre módulos"
    - id: d
      text: "Singletons creados manualmente con 'new' en cada archivo"
  correct: a
  explanation: "NestJS se apoya en un contenedor de inyección de dependencias: los providers (services, repositories) se registran en módulos y Nest resuelve e inyecta las dependencias por constructor, favoreciendo el desacople y la testabilidad (mocks)."
  source: "externa"
  date: "2026-07-14"

- id: fs-011
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: hard
  roles: ["Full Stack Engineer", "Backend Engineer"]
  stem: "En NestJS, ¿cuál es el rol correcto de un Guard frente a un Pipe?"
  options:
    - id: a
      text: "El Guard decide si una petición puede continuar (autorización/autenticación); el Pipe transforma o valida los datos de entrada antes de llegar al handler"
    - id: b
      text: "Son intercambiables, hacen exactamente lo mismo"
    - id: c
      text: "El Guard formatea la respuesta y el Pipe gestiona la conexión a la base de datos"
    - id: d
      text: "El Pipe controla el acceso y el Guard registra logs"
  correct: a
  explanation: "Un Guard implementa canActivate() y decide si la request procede (típico: auth/roles). Un Pipe opera sobre los argumentos del handler para validarlos o transformarlos (p. ej. ValidationPipe con class-validator, ParseIntPipe). Son responsabilidades distintas en el ciclo de petición."
  source: "externa"
  date: "2026-07-14"

- id: fs-012
  dimension: fullstack-next-nest-ts
  subtopic: nestjs
  difficulty: medium
  roles: ["Full Stack Engineer", "Backend Engineer"]
  stem: "¿Cómo se valida idiomáticamente el body de una petición en NestJS?"
  options:
    - id: a
      text: "Con un DTO decorado con class-validator y el ValidationPipe global, que rechaza la petición si el payload no cumple el esquema"
    - id: b
      text: "Comprobando cada campo con if/else dentro del controller"
    - id: c
      text: "Confiando en que el cliente envíe siempre datos válidos"
    - id: d
      text: "Validando en el frontend y desactivando la validación en el backend"
  correct: a
  explanation: "El patrón idiomático es definir un DTO con decoradores de class-validator (@IsString, @IsEmail, etc.) y activar el ValidationPipe (a menudo global con whitelist), que transforma y valida el payload y devuelve 400 automáticamente si no cumple, sin validación manual dispersa."
  source: "externa"
  date: "2026-07-14"

# ============================================================
# Dimensión: ai-product-system-design (AI product & system design)
# source: mixta — m4-m7/m11 del bootcamp (product/AI) vs canónico externo (system design).
# ============================================================

- id: aps-001
  dimension: ai-product-system-design
  subtopic: agent-vs-workflow
  difficulty: medium
  roles: ["AI Product Engineer", "AI Engineer"]
  stem: "Diseñando un feature con LLMs, ¿cuándo es preferible un 'workflow' (pasos fijos orquestados) frente a un 'agent' (el LLM decide los pasos y qué herramientas usar)?"
  options:
    - id: a
      text: "Cuando el problema tiene pasos conocidos y acotados: un workflow es más predecible, barato y fácil de evaluar que dar autonomía al modelo"
    - id: b
      text: "Siempre un agent, porque más autonomía es siempre mejor"
    - id: c
      text: "Siempre un workflow, porque los agents no funcionan nunca"
    - id: d
      text: "Da igual, el coste y la fiabilidad son idénticos"
  correct: a
  explanation: "Si la tarea se puede descomponer en pasos deterministas, un workflow orquestado es más predecible, depurable, barato y evaluable. Reservar la autonomía de un agent para problemas realmente abiertos evita sobre-ingeniería y variabilidad difícil de controlar en producción."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-002
  dimension: ai-product-system-design
  subtopic: llm-en-produccion
  difficulty: medium
  roles: ["AI Product Engineer", "AI Engineer"]
  stem: "Un AI feature funciona en demo pero su coste por petición es demasiado alto en producción. ¿Cuál es una palanca legítima para bajar coste sin romper la calidad?"
  options:
    - id: a
      text: "Cachear respuestas a prompts repetidos y enrutar los casos fáciles a un modelo más pequeño, reservando el modelo grande para los difíciles"
    - id: b
      text: "Eliminar toda la evaluación de calidad para ahorrar llamadas"
    - id: c
      text: "Subir siempre al modelo más caro porque es el mejor"
    - id: d
      text: "Ignorar el coste, no es responsabilidad del ingeniero"
  correct: a
  explanation: "Estrategias de coste sin sacrificar calidad: caching de prompts frecuentes, routing por dificultad (modelo pequeño para lo fácil, grande para lo difícil), acortar contexto y batching. Quitar evals no baja coste real y destruye la garantía de calidad."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-003
  dimension: ai-product-system-design
  subtopic: evals-como-contrato
  difficulty: hard
  roles: ["AI Product Engineer", "AI Engineer"]
  stem: "Al diseñar un 'AI Skill', ¿por qué conviene definir sus evals e invariantes verificables ANTES de codificarlo?"
  options:
    - id: a
      text: "Porque el eval actúa como contrato: fija qué significa 'correcto' de forma medible, permite iterar el prompt/modelo sin regresiones y evita el 'creo que funciona' subjetivo"
    - id: b
      text: "Porque los evals son obligatorios legalmente"
    - id: c
      text: "Porque así el modelo entrena más rápido"
    - id: d
      text: "No conviene: los evals se escriben solo al final, si sobra tiempo"
  correct: a
  explanation: "Definir el eval primero convierte 'parece que va' en un criterio medible y reproducible. Funciona como contrato del skill: puedes cambiar prompt, modelo o lógica y comprobar objetivamente que no hay regresión, y aísla la definición de 'correcto' del capricho subjetivo."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-004
  dimension: ai-product-system-design
  subtopic: human-in-the-loop
  difficulty: medium
  roles: ["AI Product Engineer"]
  stem: "¿En qué situación tiene más sentido meter a un humano en el bucle (human-in-the-loop) de un sistema con LLMs?"
  options:
    - id: a
      text: "En decisiones de alto impacto o irreversibles con baja tolerancia al error, donde el coste de un fallo del modelo supera el coste de la revisión humana"
    - id: b
      text: "En todas las decisiones, siempre, sin excepción"
    - id: c
      text: "Nunca, porque frena la automatización"
    - id: d
      text: "Solo cuando el modelo es muy barato"
  correct: a
  explanation: "El human-in-the-loop se justifica donde el error es caro o irreversible (pagos, decisiones legales/médicas, acciones destructivas). Poner revisión humana en todo mata el valor de automatizar; quitarla en decisiones críticas expone al negocio a fallos costosos del modelo."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-005
  dimension: ai-product-system-design
  subtopic: llm-ux-latencia
  difficulty: medium
  roles: ["AI Product Engineer", "AI Engineer"]
  stem: "Para mejorar la latencia PERCIBIDA de un chat con LLM, ¿qué técnica es la más directa?"
  options:
    - id: a
      text: "Streaming de tokens: mostrar la respuesta a medida que se genera, en vez de esperar a tenerla entera"
    - id: b
      text: "Aumentar el max_tokens de la respuesta"
    - id: c
      text: "Deshabilitar el caché"
    - id: d
      text: "Renderizar la respuesta solo cuando el usuario recargue"
  correct: a
  explanation: "El streaming (SSE/token-by-token) reduce drásticamente la latencia percibida: el usuario empieza a leer casi de inmediato aunque la generación total tarde lo mismo. Es una mejora de UX de percepción, complementaria a optimizar la latencia real."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-006
  dimension: ai-product-system-design
  subtopic: guardrails
  difficulty: hard
  roles: ["AI Product Engineer", "AI Engineer"]
  stem: "En un sistema con LLMs en producción, ¿qué es un 'guardrail' y dónde encaja?"
  options:
    - id: a
      text: "Una comprobación programática alrededor del LLM (validación de formato/salida, filtros, límites) que rechaza o corrige salidas fuera de contrato antes de que lleguen al usuario o a un sistema aguas abajo"
    - id: b
      text: "Un parámetro del modelo que garantiza que nunca alucina"
    - id: c
      text: "Un tipo de fine-tuning"
    - id: d
      text: "Una métrica de coste"
  correct: a
  explanation: "Un guardrail es lógica determinista que envuelve al modelo: valida que la salida cumple el contrato (schema, rangos, políticas), la filtra o la reintenta si no. No es una propiedad mágica del modelo; es defensa en profundidad para acotar el comportamiento no determinista del LLM."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

- id: aps-007
  dimension: ai-product-system-design
  subtopic: system-design
  difficulty: easy
  roles: ["Full Stack Engineer", "AI Product Engineer"]
  stem: "En diseño de sistemas, ¿qué distingue 'latencia' de 'throughput'?"
  options:
    - id: a
      text: "La latencia es el tiempo de una operación individual; el throughput es cuántas operaciones se completan por unidad de tiempo"
    - id: b
      text: "Son sinónimos"
    - id: c
      text: "La latencia mide bytes y el throughput mide segundos"
    - id: d
      text: "El throughput solo aplica a bases de datos"
  correct: a
  explanation: "Latencia = cuánto tarda una petición (p. ej. p95 en ms). Throughput = capacidad, peticiones/segundo. Se pueden optimizar por separado e incluso entrar en conflicto (el batching sube throughput pero puede subir la latencia individual)."
  source: "externa"
  date: "2026-07-14"

- id: aps-008
  dimension: ai-product-system-design
  subtopic: system-design
  difficulty: medium
  roles: ["Full Stack Engineer", "Backend Engineer"]
  stem: "Un endpoint de pago puede reintentarse por timeouts de red. ¿Qué mecanismo evita cobrar dos veces al reintentar la misma operación?"
  options:
    - id: a
      text: "Una idempotency key: el cliente envía un identificador único y el servidor descarta reintentos con la misma clave"
    - id: b
      text: "Aumentar el timeout hasta que nunca falle"
    - id: c
      text: "Guardar el pago en una variable global"
    - id: d
      text: "Reintentar más veces para asegurar que entra"
  correct: a
  explanation: "Una idempotency key hace que repetir la petición produzca el mismo efecto que hacerla una vez: el servidor registra la clave y, ante un reintento con la misma, devuelve el resultado previo sin re-ejecutar el cobro. Es el patrón estándar para operaciones no idempotentes por naturaleza."
  source: "externa"
  date: "2026-07-14"

- id: aps-009
  dimension: ai-product-system-design
  subtopic: system-design
  difficulty: hard
  roles: ["Backend Engineer", "Full Stack Engineer"]
  stem: "Según el teorema CAP, ante una partición de red (P) en un sistema distribuido, ¿entre qué dos propiedades hay que elegir?"
  options:
    - id: a
      text: "Consistencia (C) y Disponibilidad (A): durante la partición no se pueden garantizar ambas a la vez"
    - id: b
      text: "Coste y Rendimiento"
    - id: c
      text: "Concurrencia y Persistencia"
    - id: d
      text: "Caché y Autenticación"
  correct: a
  explanation: "CAP dice que, cuando hay partición de red (P, inevitable en sistemas distribuidos reales), debes sacrificar Consistencia o Disponibilidad: o rechazas peticiones para no servir datos inconsistentes (CP), o respondes aun a riesgo de datos desactualizados (AP)."
  source: "externa"
  date: "2026-07-14"

- id: aps-010
  dimension: ai-product-system-design
  subtopic: system-design
  difficulty: medium
  roles: ["Backend Engineer", "Full Stack Engineer"]
  stem: "¿Qué problema resuelve principalmente introducir una cola de mensajes (message queue) entre un productor y un consumidor?"
  options:
    - id: a
      text: "Desacoplar y absorber picos: el productor no espera al consumidor y la cola amortigua ráfagas, dando resiliencia y backpressure"
    - id: b
      text: "Cifrar los datos en tránsito"
    - id: c
      text: "Eliminar la necesidad de una base de datos"
    - id: d
      text: "Hacer el sistema síncrono y bloqueante"
  correct: a
  explanation: "Una cola desacopla productor y consumidor en el tiempo: el productor encola y sigue, el consumidor procesa a su ritmo. Absorbe picos de carga, aporta reintentos y backpressure, y evita que un consumidor lento tumbe al productor."
  source: "externa"
  date: "2026-07-14"

- id: aps-011
  dimension: ai-product-system-design
  subtopic: system-design
  difficulty: medium
  roles: ["Backend Engineer", "AI Product Engineer"]
  stem: "Para limitar cuántas peticiones por segundo acepta una API permitiendo a la vez ráfagas cortas, ¿qué algoritmo es el idiomático?"
  options:
    - id: a
      text: "Token bucket: se rellenan tokens a una tasa fija y cada petición consume uno; el tamaño del bucket permite ráfagas hasta agotarlo"
    - id: b
      text: "Bubble sort"
    - id: c
      text: "Round-robin de DNS"
    - id: d
      text: "Hashing consistente"
  correct: a
  explanation: "El token bucket rellena tokens a ritmo constante (la tasa media permitida) y cada request gasta uno; mientras haya tokens acumulados se toleran ráfagas, y al agotarse se limita al ritmo de recarga. Es el estándar para rate limiting con burst."
  source: "externa"
  date: "2026-07-14"

- id: aps-012
  dimension: ai-product-system-design
  subtopic: influencia-tecnica
  difficulty: medium
  roles: ["AI Product Engineer", "Tech Lead"]
  stem: "Pasar de 'buen ejecutor' a alguien que diseña sistemas end-to-end e influye sin autoridad implica sobre todo..."
  options:
    - id: a
      text: "Alinear a otros mediante contexto y trade-offs explícitos (por qué esta decisión y qué se sacrifica), no imponer por jerarquía"
    - id: b
      text: "Escribir más código que nadie para demostrar valía"
    - id: c
      text: "Evitar documentar para mantener el conocimiento propio"
    - id: d
      text: "Tomar todas las decisiones en solitario y comunicarlas al final"
  correct: a
  explanation: "Influir sin autoridad se basa en hacer visible el razonamiento: exponer trade-offs, contexto y criterios para que otros se alineen por convicción. El impacto senior es de diseño y de elevar al equipo, no de volumen de código ni de acaparar conocimiento."
  source: "bootcamp-ml-llm"
  date: "2026-07-14"

# ============================================================
# Dimensión: comportamental-star (entrevista comportamental / método STAR)
# source: externa — STAR es un marco universal de entrevista, no del bootcamp.
# ============================================================

- id: star-001
  dimension: comportamental-star
  subtopic: metodo-star
  difficulty: easy
  roles: ["Cualquiera"]
  stem: "En el contexto de entrevistas comportamentales, ¿qué significa el acrónimo STAR?"
  options:
    - id: a
      text: "Situation, Task, Action, Result"
    - id: b
      text: "Strategy, Timing, Analysis, Review"
    - id: c
      text: "Skill, Talent, Attitude, Reward"
    - id: d
      text: "Story, Tone, Approach, Reaction"
  correct: a
  explanation: "STAR estructura una respuesta comportamental en Situación (contexto), Tarea (tu responsabilidad/objetivo), Acción (lo que hiciste tú) y Resultado (el desenlace, idealmente medible). Da orden y evita divagar."
  source: "externa"
  date: "2026-07-14"

- id: star-002
  dimension: comportamental-star
  subtopic: resultado
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "Al contar el 'Result' de una respuesta STAR, ¿qué la hace más convincente?"
  options:
    - id: a
      text: "Cuantificar el impacto siempre que se pueda (p. ej. 'reduje la latencia un 40%') y añadir qué aprendiste"
    - id: b
      text: "Dejarlo vago para no comprometerse con cifras"
    - id: c
      text: "Terminar en la Acción y no mencionar el resultado"
    - id: d
      text: "Atribuir el resultado al equipo sin decir tu parte"
  correct: a
  explanation: "Un Result con métricas concretas demuestra impacto real y credibilidad, mucho más que afirmaciones genéricas. Añadir el aprendizaje muestra reflexión. Omitir el resultado deja la historia sin cierre y sin evidencia de que funcionó."
  source: "externa"
  date: "2026-07-14"

- id: star-003
  dimension: comportamental-star
  subtopic: errores-comunes
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "¿Cuál es un error frecuente al responder con STAR que conviene evitar?"
  options:
    - id: a
      text: "Dedicar demasiado tiempo a la Situación y quedarse sin contar la Acción y el Resultado"
    - id: b
      text: "Explicar la Acción con detalle"
    - id: c
      text: "Cuantificar el Resultado"
    - id: d
      text: "Elegir una historia relevante para el rol"
  correct: a
  explanation: "Un fallo típico es sobre-explicar el contexto (Situación/Tarea) y llegar con el tiempo agotado a lo que de verdad evalúa el entrevistador: qué hiciste TÚ (Acción) y qué conseguiste (Resultado). El contexto debe ser breve y suficiente."
  source: "externa"
  date: "2026-07-14"

- id: star-004
  dimension: comportamental-star
  subtopic: conflicto
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "Ante 'háblame de un conflicto con un compañero', ¿qué enfoque transmite mejor señal?"
  options:
    - id: a
      text: "Centrarse en cómo entendiste la otra postura, qué hiciste para resolverlo y qué aprendiste, sin culpabilizar"
    - id: b
      text: "Demostrar que la otra persona estaba equivocada y tú tenías razón"
    - id: c
      text: "Decir que nunca has tenido conflictos"
    - id: d
      text: "Describir el conflicto sin contar cómo se resolvió"
  correct: a
  explanation: "El entrevistador busca madurez y colaboración: empatía con la otra postura, acciones concretas para resolver y aprendizaje. Echar culpas o negar todo conflicto (poco creíble) resta; quedarse sin resolución deja la señal incompleta."
  source: "externa"
  date: "2026-07-14"

- id: star-005
  dimension: comportamental-star
  subtopic: yo-vs-nosotros
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "En una respuesta comportamental, ¿por qué importa usar 'yo' al describir la Acción, aunque fuera un trabajo de equipo?"
  options:
    - id: a
      text: "Porque el entrevistador evalúa tu contribución individual; 'nosotros' constante difumina qué hiciste tú realmente"
    - id: b
      text: "Porque hablar en plural está prohibido en entrevistas"
    - id: c
      text: "Porque el 'yo' hace la historia más corta"
    - id: d
      text: "No importa, da igual el pronombre"
  correct: a
  explanation: "Reconocer al equipo está bien, pero la evaluación es de TU aporte. Si todo es 'nosotros', el entrevistador no puede distinguir tu contribución. Conviene ser claro en el 'yo' de la Acción sin negar el contexto colaborativo."
  source: "externa"
  date: "2026-07-14"

- id: star-006
  dimension: comportamental-star
  subtopic: fracaso
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "Cuando preguntan por un fracaso o error propio, ¿qué señal busca sobre todo el entrevistador?"
  options:
    - id: a
      text: "Que asumes responsabilidad (ownership) y muestras qué aprendiste y qué cambiaste después"
    - id: b
      text: "Que nunca fallas"
    - id: c
      text: "Un fracaso tan pequeño que no cuente como fracaso"
    - id: d
      text: "Que la culpa fue de causas externas"
  correct: a
  explanation: "La pregunta de fracaso mide autoconciencia y crecimiento: reconocer el error, tu parte en él, y qué aprendiste/cambiaste. Negar fallos o culpar al entorno transmite falta de reflexión; un 'fracaso' trivial evade la pregunta."
  source: "externa"
  date: "2026-07-14"

- id: star-007
  dimension: comportamental-star
  subtopic: metodo-star
  difficulty: hard
  roles: ["Cualquiera"]
  stem: "En STAR, ¿qué distingue la 'Task' de la 'Action'?"
  options:
    - id: a
      text: "La Task es el objetivo o responsabilidad que te tocaba (el qué había que lograr); la Action es lo que concretamente hiciste tú para lograrlo (el cómo)"
    - id: b
      text: "Son lo mismo con distinto nombre"
    - id: c
      text: "La Task es el resultado final y la Action es el contexto"
    - id: d
      text: "La Action ocurre antes que la Task"
  correct: a
  explanation: "Task define el reto/objetivo del que eras responsable en esa situación; Action detalla los pasos concretos que TÚ tomaste. Confundirlas hace que la respuesta salte del contexto al resultado sin dejar claro tu papel activo."
  source: "externa"
  date: "2026-07-14"

- id: star-008
  dimension: comportamental-star
  subtopic: debilidades
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "Ante '¿cuál es tu mayor debilidad?', ¿qué respuesta es más sólida?"
  options:
    - id: a
      text: "Una debilidad real y concreta acompañada de lo que estás haciendo activamente para mejorarla"
    - id: b
      text: "'Soy demasiado perfeccionista' u otra fortaleza disfrazada"
    - id: c
      text: "'No tengo debilidades'"
    - id: d
      text: "Una debilidad crítica para el puesto sin plan de mejora"
  correct: a
  explanation: "La respuesta fuerte es honesta y muestra autoconciencia más acción de mejora. Las 'fortalezas disfrazadas' suenan a cliché y no engañan; negar debilidades resta credibilidad; y elegir una que inhabilite para el rol se dispara en el pie."
  source: "externa"
  date: "2026-07-14"

- id: star-009
  dimension: comportamental-star
  subtopic: liderazgo
  difficulty: medium
  roles: ["Cualquiera", "Tech Lead"]
  stem: "Piden un ejemplo de 'liderazgo sin autoridad formal'. ¿Qué historia encaja mejor?"
  options:
    - id: a
      text: "Una en la que alineaste a compañeros hacia una decisión mediante datos, contexto y persuasión, sin ser su jefe"
    - id: b
      text: "Una en la que diste órdenes porque eras el manager"
    - id: c
      text: "Una en la que trabajaste solo sin implicar a nadie"
    - id: d
      text: "Una en la que impusiste tu criterio ignorando al equipo"
  correct: a
  explanation: "Liderazgo sin autoridad significa influir por credibilidad, datos y comunicación, no por jerarquía. La historia ideal muestra cómo lograste alineamiento y acción de otros sobre los que no tenías poder formal."
  source: "externa"
  date: "2026-07-14"

- id: star-010
  dimension: comportamental-star
  subtopic: motivacion
  difficulty: easy
  roles: ["Cualquiera"]
  stem: "Ante '¿por qué dejaste tu anterior trabajo?', ¿cuál es el mejor enfoque?"
  options:
    - id: a
      text: "Enmarcarlo en positivo, hacia lo que buscas (crecimiento, reto, encaje), sin criticar duramente a tu empresa anterior"
    - id: b
      text: "Despotricar en detalle sobre tu antiguo jefe"
    - id: c
      text: "Decir que solo te interesa el dinero"
    - id: d
      text: "Evitar la pregunta cambiando de tema"
  correct: a
  explanation: "Un buen framing es prospectivo y positivo: qué buscas en el siguiente paso, no un ajuste de cuentas. Hablar mal del empleador anterior transmite riesgo de que hagas lo mismo con el próximo; evadir la pregunta genera desconfianza."
  source: "externa"
  date: "2026-07-14"

- id: star-011
  dimension: comportamental-star
  subtopic: preparacion
  difficulty: medium
  roles: ["Cualquiera"]
  stem: "Al preparar historias comportamentales para una entrevista, ¿qué estrategia rinde más?"
  options:
    - id: a
      text: "Tener unas pocas historias versátiles y bien estructuradas que puedas adaptar a varias preguntas (conflicto, liderazgo, fracaso, impacto)"
    - id: b
      text: "Memorizar una respuesta literal distinta para cada posible pregunta"
    - id: c
      text: "Improvisar todo sin preparar nada"
    - id: d
      text: "Preparar una única historia para todo"
  correct: a
  explanation: "Un puñado de historias sólidas y reutilizables (cada una con Situación/Tarea/Acción/Resultado claros) cubre muchas preguntas si sabes reencuadrarlas según lo que se pide. Memorizar guiones literales suena rígido; no preparar nada arriesga divagar."
  source: "externa"
  date: "2026-07-14"

- id: star-012
  dimension: comportamental-star
  subtopic: impacto
  difficulty: easy
  roles: ["Cualquiera"]
  stem: "¿Por qué conviene cerrar una respuesta comportamental con el impacto medible de tus acciones?"
  options:
    - id: a
      text: "Porque las cifras concretas hacen la historia creíble y memorable, y demuestran que tu acción produjo un resultado real"
    - id: b
      text: "Porque alarga la respuesta"
    - id: c
      text: "Porque los entrevistadores solo escuchan el final"
    - id: d
      text: "Porque evita tener que explicar la acción"
  correct: a
  explanation: "Cerrar con impacto medible (métricas, ahorro, mejora, adopción) ancla la historia en evidencia y la hace memorable. Sin resultado tangible, incluso una buena acción queda como una anécdota sin prueba de que sirvió."
  source: "externa"
  date: "2026-07-14"
