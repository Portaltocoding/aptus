    - AI Engineer
    - Agent Engineer
  stem: Comparas dos configuraciones con un juez con LLM. La variante B gana por 8 puntos.
    Antes de darlo por bueno, ¿qué comprobación específica del instrumento haces?
  options:
    - id: c
      text: "Si el juez tiene una preferencia sistemática que la variante B explota sin ser mejor:
        se comprueba invirtiendo el orden en las comparaciones por pares, mirando si B
        produce respuestas sistemáticamente más largas o mejor formateadas, y contrastando
        una muestra con etiquetas humanas"
      rationale: "La pregunta no es si B es mejor, sino si el instrumento tiene una preferencia que B satisface por casualidad."
    - id: a
      text: Repetir la comparación tres veces y quedarse con la mediana
      rationale: "Repitiendo la comparación y quedándose con el valor central se quita la variabilidad de una pasada."
    - id: b
      text: Aumentar el tamaño del conjunto hasta que la diferencia sea significativa
      rationale: "Ampliando el conjunto hasta que la diferencia sea significativa se despeja la duda estadística."
    - id: d
      text: Cambiar el modelo juez por uno más capaz y repetir
      rationale: "Un juez más capaz comete menos errores de criterio, así que repetir con él confirma o tumba el resultado."
  correct: c
  explanation: "Con un juez de por medio hay dos hipótesis para una ventaja: B es mejor, o B
    le gusta más al juez. Repetir y ampliar la muestra reducen la varianza pero no
    distinguen entre las dos, porque un sesgo sistemático no se promedia. Lo que discrimina
    es atacar los sesgos conocidos —posición invirtiendo el orden, longitud y formato
    mirando las salidas— y anclar en una muestra etiquetada por humanos. Cambiar de juez es
    útil como comprobación cruzada, pero sin la calibración no sabes cuál de los dos tiene
    razón."
  source: externa:practica-industria
  date: 2026-08-10
- id: evals-054
  dimension: evals-observabilidad
  subtopic: produccion
  difficulty: experto
  type: escenario
  roles: *a5
  stem: Tu evaluación fuera de línea dice que la variante nueva es mejor y en producción los
    usuarios se quejan más. Ambas mediciones parecen correctas. ¿Qué explica la
    contradicción?
  options:
    - id: a
      text: Que la muestra fuera de línea era demasiado pequeña
      rationale: "Con pocos casos, una diferencia a favor puede aparecer por azar y no sostenerse fuera."
    - id: b
      text: "Que el conjunto y el tráfico real no son la misma distribución, y que lo que mide el
        calificador no es lo que le duele al usuario: hay que comparar la distribución de
        entradas y comprobar si los casos que generan queja están representados y bien
        puntuados por la rúbrica"
      rationale: "Las dos mediciones pueden ser correctas y aun así contradecirse: miden poblaciones distintas con varas distintas."
    - id: d
      text: Que los usuarios tardan en acostumbrarse a los cambios
      rationale: "Todo cambio molesta al principio, y las quejas bajan cuando la gente se acostumbra."
    - id: c
      text: Que la variante nueva es más lenta y eso genera insatisfacción
      rationale: "Si la variante nueva tarda más, la insatisfacción viene por ahí aunque responda mejor."
  correct: b
  explanation: "Cuando las dos mediciones son técnicamente correctas y discrepan, el desajuste
    está en qué se mide y sobre qué. Las dos causas típicas: el conjunto no representa el
    tráfico real (casos frecuentes infrarrepresentados, o al revés), y la rúbrica premia
    algo que no es lo que molesta —una respuesta más completa que se lee peor, por ejemplo—.
    Se diagnostica comparando distribuciones y puntuando con la rúbrica los casos concretos
    que generaron queja. La latencia es una hipótesis razonable que se descarta en un minuto
    mirando los percentiles."
  source: externa:practica-industria
  date: 2026-08-10
