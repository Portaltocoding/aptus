# Dimensión: agentes-harnesses — el oficio del bucle: tool use, contexto, harness,
# scaffolding y las superficies sobre las que se construye un agente.
#
# source: jd-codeway (la oferta lo pide explícitamente) | externa:<ref> (hecho verificable
# en documentación pública e independiente de la oferta).
# type: concepto|diagrama|codigo|escenario. Incluye tramo 'experto' (nivel staff).

- id: agentes-001
  dimension: agentes-harnesses
  subtopic: bucle-agentico
  difficulty: easy
  type: concepto
  roles: &a1
    - Applied AI Engineer
    - AI Engineer
  stem: En un bucle agéntico construido a pelo sobre la API de mensajes, ¿qué condición marca
    el final del bucle?
  options:
    - id: a
      text: Que la respuesta del modelo ya no pida ejecutar herramientas (stop_reason distinto de
        'tool_use')
      rationale: "El bucle existe para atender peticiones de herramienta: si el turno cierra sin pedir ninguna, no queda nada que devolver."
    - id: b
      text: "Que el modelo agote el presupuesto de tokens de razonamiento que le hayas fijado, momento en el que la API deja de admitir más turnos en esa conversación"
      rationale: "El razonamiento tiene su propio presupuesto, y agotarlo es la señal de que el modelo ha llegado hasta donde podía."
    - id: c
      text: "Que todas las herramientas declaradas en la petición hayan sido invocadas al menos una vez, señal de que el modelo ya ha recorrido todo lo que le ofreciste"
      rationale: "Si se declaran herramientas es porque hacen falta: el turno no está completo hasta haberlas usado todas."
    - id: d
      text: "Que el usuario envíe un mensaje nuevo, porque cada turno de usuario abre un bucle propio y cierra automáticamente el que estuviera en marcha"
      rationale: "El bucle es de un turno: se cierra cuando entra la siguiente petición de la persona."
  correct: a
  explanation: "El bucle es: pedir → si el modelo devuelve bloques tool_use, ejecutarlos y
    devolver los tool_result → repetir. Termina cuando el modelo deja de pedir herramientas
    (típicamente stop_reason 'end_turn'). Ni el presupuesto de razonamiento ni haber tocado
    todas las herramientas son criterios: el modelo decide cuáles usa y cuántas veces."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-002
  dimension: agentes-harnesses
  subtopic: definiciones
  difficulty: easy
  type: concepto
  roles: &a2
    - Applied AI Engineer
    - AI Engineer
    - Agent Engineer
  stem: En la jerga de agentes, ¿qué es un 'harness'?
  options:
    - id: c
      text: El prompt de sistema que define la personalidad del agente
      rationale: "Es lo que se toca cuando el agente responde raro; casi nunca lo que se toca cuando se atasca a mitad de una tarea."
    - id: b
      text: "El código que rodea al modelo: el bucle, la gestión de contexto, la ejecución de
        herramientas y los permisos"
      rationale: "Cambiando solo esta pieza, el mismo modelo pasa de perderse a terminar la tarea: es donde vive casi toda la ingeniería."
    - id: a
      text: "El modelo de lenguaje concreto que hay por debajo, con su ventana de contexto y su forma de llamar a herramientas"
      rationale: "Es lo que se compara entre proveedores, aunque dos productos con el mismo por debajo se comporten de forma muy distinta."
    - id: d
      text: El conjunto de evaluaciones que mide la calidad del agente
      rationale: "Es lo que dice si va bien, pero no interviene en ninguna de sus decisiones mientras trabaja."
  correct: b
  explanation: "El harness es el arnés alrededor del modelo: quién ejecuta el bucle, cómo se
    administra el contexto, cómo se ejecutan y se autorizan las herramientas, cómo se
    recupera de errores. El prompt es una pieza dentro del harness, no el harness; el modelo
    es lo que el harness conduce."
  source: jd-codeway
  date: 2026-08-10
- id: agentes-003
  dimension: agentes-harnesses
  subtopic: tool-use-protocolo
  difficulty: easy
  type: concepto
  roles: *a1
  stem: Al devolver el resultado de una herramienta a la API de mensajes, ¿qué campo
    correlaciona ese resultado con la petición que lo originó?
  options:
    - id: a
      text: El nombre de la herramienta
      rationale: "El nombre identifica qué se ha ejecutado, que es lo que el modelo necesita para leer el resultado."
    - id: d
      text: El índice del bloque dentro del contenido de la respuesta
      rationale: "El orden de los bloques se conserva en la respuesta, así que la posición basta para emparejarlos."
    - id: b
      text: El tool_use_id del bloque tool_use correspondiente
      rationale: "Cada bloque de petición trae su propio id, y el resultado se devuelve marcado con ese mismo id."
    - id: c
      text: El id del mensaje del asistente
      rationale: "El id del mensaje del asistente identifica el turno al que pertenece ese resultado."
  correct: b
  explanation: "Cada bloque tool_use lleva un id, y el tool_result debe repetirlo en
    tool_use_id. El nombre no basta: el modelo puede llamar dos veces a la misma herramienta
    en el mismo turno, y hay que saber qué resultado corresponde a qué llamada."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-004
  dimension: agentes-harnesses
  subtopic: tool-use-protocolo
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Tu agente recibe un turno con tres bloques tool_use. Los ejecutas en paralelo y, según
    va terminando cada uno, envías su tool_result en un mensaje 'user' distinto. Funciona,
    pero con el tiempo observas que el modelo deja de pedir herramientas en paralelo. ¿Por
    qué?
  options:
    - id: c
      text: "Porque ejecutar tres herramientas a la vez consume el límite de peticiones por minuto de la organización y, al detectar el estrangulamiento, la API va reduciendo el paralelismo que le ofrece al modelo"
      rationale: "Tres llamadas a la vez consumen cuota mucho más rápido, y al limitarse el ritmo se pierde el paralelismo."
    - id: b
      text: "Porque el paralelismo de herramientas solo está soportado cuando la petición activa salidas estructuradas, y sin ese modo el modelo vuelve por su cuenta a pedirlas de una en una"
      rationale: "El paralelismo de herramientas se apoya en el esquema tipado que activan las salidas estructuradas."
    - id: d
      text: "Porque los tool_result deben viajar en mensajes con rol 'assistant' para que el modelo los reconozca como continuación de su propio turno; en mensajes 'user' los lee como texto suelto"
      rationale: "Los resultados continúan el trabajo del asistente, así que el rol del mensaje que los lleva debería ser el suyo."
    - id: a
      text: Porque partir los tool_result en varios mensajes le enseña al modelo que sus llamadas
        paralelas no se atienden como tales; hay que devolver todos los tool_result en un
        único mensaje 'user'
      rationale: "La pista está en que fue empeorando: el modelo aprende del historial que devuelves, no de la petición actual."
  correct: a
  explanation: "El contrato es: un turno del asistente puede contener varios bloques tool_use,
    y TODOS sus tool_result vuelven en un solo mensaje de rol 'user'. Repartirlos en
    mensajes sucesivos reescribe la historia como si hubieran sido llamadas secuenciales, y
    el modelo aprende de esa historia a no pedirlas en paralelo."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-005
  dimension: agentes-harnesses
  subtopic: errores-y-reintentos
  difficulty: easy
  type: concepto
  roles: *a1
  stem: Una herramienta de tu agente falla (la API externa devuelve 500). ¿Qué haces con ese
    turno?
  options:
    - id: a
      text: Devolver un tool_result con is_error activado y un mensaje de error informativo
      rationale: "Devolver el error como resultado marcado deja que el modelo lo lea y decida: reintentar, cambiar de vía o avisar."
    - id: b
      text: Omitir el tool_result de esa herramienta y devolver solo los que sí funcionaron
      rationale: "Un resultado con error solo añade ruido al contexto; con los que sí funcionaron el modelo puede seguir."
    - id: c
      text: Abortar el bucle y devolver el error al usuario final
      rationale: "Un 500 no lo arregla el modelo: cortar y decirlo es más honesto que dejarle improvisar sobre el fallo."
    - id: d
      text: Reintentar la llamada en silencio hasta que funcione
      rationale: "Los fallos de una API externa suelen ser transitorios, así que reintentar sin molestar al modelo es lo eficiente."
  correct: a
  explanation: Un fallo de herramienta se comunica al modelo como tool_result con is_error y
    un texto que explique qué pasó, para que pueda adaptarse (probar otros parámetros, otra
    vía, o avisar). Omitir el bloque rompe el emparejamiento tool_use/tool_result; abortar
    desperdicia la capacidad del modelo de recuperarse; reintentar en silencio esconde el
    problema y puede duplicar efectos.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-006
  dimension: agentes-harnesses
  subtopic: stop-reasons
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Tu agente usa herramientas de servidor (búsqueda web) y recibe una respuesta con
    stop_reason 'pause_turn'. ¿Cuál es la reacción correcta?
  options:
    - id: d
      text: "Tratarlo como un error transitorio de la capa de transporte y reintentar la petición original desde cero, con espera exponencial entre intentos hasta que el turno salga completo"
      rationale: "Una parada a mitad de turno apunta a un problema pasajero, y repetir la petición limpia el estado."
    - id: b
      text: Volver a llamar a la API con el mensaje de usuario y el turno del asistente tal cual,
        sin añadir un mensaje de 'Continúa'
      rationale: "El turno está a medias: se reenvía tal cual, con el turno del asistente incluido, para que siga por donde iba."
    - id: a
      text: "Añadir un mensaje de usuario que diga 'Continúa' y reenviar la conversación entera, que es la forma de retomar un turno que el modelo ha dejado a medias"
      rationale: "El modelo se ha detenido esperando indicación, así que un 'continúa' es lo que reanuda el trabajo."
    - id: c
      text: "Considerar la respuesta completa: 'pause_turn' indica que el modelo terminó su turno y se queda a la espera, así que lo generado hasta ahí ya se puede entregar al usuario"
      rationale: "Si la API ha cerrado el turno, lo que hay es la respuesta final; insistir duplicaría el trabajo ya hecho."
  correct: b
  explanation: "'pause_turn' significa que el bucle de herramientas del servidor alcanzó su
    límite de iteraciones. Se reanuda reenviando la conversación con el turno del asistente
    añadido; el servidor detecta el bloque de uso de herramienta pendiente y continúa solo.
    Añadir un 'Continúa' mete ruido en la conversación y no hace falta. Conviene poner un
    tope de reanudaciones para no encadenar un bucle infinito."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-007
  dimension: agentes-harnesses
  subtopic: stop-reasons
  difficulty: medium
  type: codigo
  roles: *a1
  stem: |-
    El siguiente manejador de respuesta tiene un fallo real de robustez. ¿Cuál?

        resp = client.messages.create(model=MODEL, max_tokens=4096, messages=msgs)
        texto = resp.content[0].text
        guardar(texto)
  options:
    - id: b
      text: "Falta pasar el prompt de sistema, que en esta API viaja como primer elemento de la lista de mensajes; sin él la llamada se rechaza con un error de validación antes de llegar al modelo"
      rationale: "Sin prompt de sistema el modelo no sabe qué papel juega, y la llamada queda incompleta."
    - id: c
      text: "max_tokens debería calcularse siempre por encima de la longitud del prompt de entrada, porque el límite se aplica a la suma de entrada y salida y aquí se agota antes de generar nada"
      rationale: "max_tokens acota la ventana de la llamada, así que quedarse corto respecto a la entrada la trunca."
    - id: a
      text: "Da por hecho que content[0] existe y es texto: si el turno acaba en un rechazo
        (stop_reason 'refusal') content puede venir vacío, y si el modelo razona o pide
        herramientas el primer bloque no es de texto"
      rationale: "El código funciona en las pruebas y revienta en producción, que es donde llegan turnos que empiezan razonando o pidiendo herramientas."
    - id: d
      text: "La respuesta hay que recorrerla de forma asíncrona porque este método devuelve siempre un flujo por trozos; leer content[0] antes de que el flujo haya terminado devuelve un bloque vacío, y por eso el guardado sale a medias de forma intermitente"
      rationale: "La respuesta llega por partes, así que hay que consumirla de forma asíncrona antes de tocar su contenido."
  correct: a
  explanation: content es una lista de bloques heterogéneos (texto, razonamiento, uso de
    herramienta) y puede llegar vacía cuando el turno acaba en rechazo. Lo correcto es mirar
    stop_reason antes de leer el contenido y filtrar los bloques por tipo en vez de indexar
    a ciegas.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-008
  dimension: agentes-harnesses
  subtopic: superficies-de-agente
  difficulty: hard
  type: concepto
  roles: *a2
  stem: "Dos piezas de Anthropic se confunden constantemente: el 'tool runner' del SDK de la
    API y el Claude Agent SDK. ¿Cuál es la diferencia de fondo?"
  options:
    - id: c
      text: "El tool runner es la versión de pago, incluida en el nivel empresarial de la API, y el Agent SDK la versión de código abierto del mismo bucle: mismas capacidades, distinto soporte"
      rationale: "Son la misma pieza con dos licencias distintas: una gestionada y otra abierta."
    - id: a
      text: "El tool runner ejecuta las herramientas dentro de la infraestructura de Anthropic, mientras que el Agent SDK las ejecuta en tu máquina o en tu servidor, que es justo lo que lo hace apto para tocar ficheros locales y lanzar comandos"
      rationale: "La diferencia está en dónde corre el código de las herramientas: en la infraestructura del proveedor o en la tuya."
    - id: d
      text: "El tool runner solo funciona con salidas estructuradas y el Agent SDK solo con streaming, así que la elección la marca el formato de respuesta que necesite tu producto, no el tipo de agente"
      rationale: "Cada una está atada a un modo de respuesta distinto, y por eso no se pueden intercambiar."
    - id: b
      text: El tool runner recorre el bucle sobre las herramientas que TÚ defines (no trae
        herramientas propias); el Agent SDK es el harness de Claude Code empaquetado como
        librería, con herramientas integradas de ficheros, bash y búsqueda
      rationale: "Uno te lo pone todo menos las herramientas; el otro te trae las herramientas hechas. La elección depende de si ya tienes las tuyas."
  correct: b
  explanation: "Son paquetes distintos. El tool runner es una ayuda del SDK de la API
    (client.beta.messages.tool_runner) que automatiza pedir→ejecutar→repetir sobre tus
    herramientas; no trae herramientas ni sandbox. El Agent SDK es Claude Code como
    librería: bucle completo, herramientas integradas, hooks, subagentes, permisos. Los dos
    son 'solo harness': el despliegue lo pones tú."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-009
  dimension: agentes-harnesses
  subtopic: superficies-de-agente
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Separando 'quién pone el harness' de 'quién pone el despliegue', ¿qué distingue a los
    agentes gestionados (Managed Agents) del resto de formas de construir un agente sobre la
    API?
  options:
    - id: d
      text: "Que son la única opción que aporta a la vez el harness y el despliegue: Anthropic
        ejecuta el bucle y hospeda un contenedor por sesión donde corren las herramientas"
      rationale: "La pregunta que lo distingue: ¿quién ejecuta el bucle y en qué máquina corre el bash? En el resto de opciones, esa máquina es la tuya."
    - id: b
      text: "Que son la única opción que permite definir herramientas propias, porque el resto de formas de construir un agente se limitan a las herramientas que ya trae la plataforma"
      rationale: "Es la vía pensada para herramientas propias: se declaran una vez y el servicio las orquesta."
    - id: a
      text: "Que son la única opción compatible con MCP: el resto de superficies hablan solo el formato de herramientas nativo de la API y no saben conectarse a un servidor externo"
      rationale: "Es la superficie que habla MCP de forma nativa, sin adaptador por medio."
    - id: c
      text: "Que son la única opción que soporta razonamiento extendido, porque el bucle necesita conservar los bloques de pensamiento entre turnos y eso solo se garantiza del lado del servidor"
      rationale: "El razonamiento extendido necesita mantener estado entre pasos, y solo esa superficie lo conserva."
  correct: d
  explanation: "El bucle manual, el tool runner y el Agent SDK son harness: el despliegue
    sigue siendo tuyo. Los agentes gestionados añaden el despliegue —el bucle corre en la
    capa de orquestación de Anthropic y las herramientas se ejecutan en un contenedor
    provisionado por sesión—. Herramientas propias, MCP y razonamiento existen en las otras
    opciones también."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-010
  dimension: agentes-harnesses
  subtopic: diseno-tool-surface
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Tu agente ya tiene una herramienta 'bash' con la que puede hacer casi cualquier cosa.
    ¿Cuál es la razón más sólida para promover una acción concreta (por ejemplo, enviar un
    correo) a herramienta dedicada?
  options:
    - id: c
      text: "Porque el modelo escribe comandos de shell con más errores de sintaxis que JSON, y cada error obliga a un turno extra de corrección que encarece el bucle y alarga la latencia percibida por el usuario"
      rationale: "Una línea de shell tiene mil formas de escribirse mal; un objeto tipado se valida antes de ejecutar nada."
    - id: b
      text: Porque una herramienta dedicada le da al harness un punto de enganche con argumentos
        tipados que puede interceptar, pedir confirmación, renderizar o auditar; una cadena
        de shell opaca no
      rationale: "El día que alguien pida confirmar antes de enviar, con una cadena de shell no hay dónde poner el gancho: habría que interpretarla."
    - id: a
      text: "Porque reduce el número de tokens del esquema de herramientas que viaja en cada petición, y con ello el coste de la parte cacheada del prompt"
      rationale: "Cada herramienta declarada ocupa esquema en el prompt, así que concentrarlas en una sale más barato."
    - id: d
      text: "Porque bash no puede ejecutar acciones irreversibles fuera de la máquina, así que enviar un correo exige por fuerza una herramienta aparte"
      rationale: "Las acciones sin vuelta atrás necesitan una vía aparte, porque por shell no se pueden ejecutar."
  correct: b
  explanation: Bash da alcance; una herramienta dedicada da control. Con argumentos tipados el
    harness puede poner una puerta de aprobación, comprobar invariantes, dibujar una UI
    específica o marcar la acción como paralelizable. Con `bash -c "curl -X POST ..."` todas
    las acciones tienen la misma forma opaca y el harness no puede distinguirlas.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-011
  dimension: agentes-harnesses
  subtopic: diseno-tool-surface
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué contenido pertenece a la 'description' de una herramienta y cuál no?
  options:
    - id: b
      text: "Cuanto más corta mejor: una línea con el verbo y el objeto basta, porque el modelo deduce el resto del esquema de parámetros y toda descripción larga solo gasta contexto en cada petición"
      rationale: "El esquema se lee en cada llamada: cuanto más corta, menos tokens y menos ruido para el modelo."
    - id: c
      text: "Debe incluir siempre dos o tres ejemplos completos de llamada y de respuesta, que es lo que fija el formato de los argumentos; sin ellos el modelo los improvisa"
      rationale: "Los ejemplos completos son lo que fija el formato: con dos o tres, el modelo deja de improvisar la llamada."
    - id: a
      text: "Sí: qué hace, cuándo llamarla y cuándo no, qué significa cada parámetro, límites y
        qué NO devuelve. No: diálogos de ejemplo, protocolos numerados o instrucciones de
        conversación"
      rationale: "Regla al escribirla: si el texto le habla al usuario en vez de describir la función, está en el sitio equivocado."
    - id: d
      text: "Debe listar qué otras herramientas NO usar cuando esta aplica, porque la desambiguación entre herramientas parecidas se resuelve en la descripción de cada una"
      rationale: "Decir qué otras no usar evita que el modelo se vaya a la herramienta equivocada cuando esta es la que aplica."
  correct: a
  explanation: "La descripción es la página de manual de la herramienta: contrato y
    condiciones de disparo. Ser demasiado escueto es el fallo más común y perjudica el
    rendimiento. Los ejemplos largos y los protocolos incrustados ocupan contexto en cada
    petición y limitan la exploración: ese material va a skills o carga progresiva. Y las
    referencias cruzadas del tipo 'nunca uses X' meten instrucción conversacional en un
    contrato."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-012
  dimension: agentes-harnesses
  subtopic: contexto
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Compactación, edición de contexto y memoria resuelven cosas distintas. ¿Cuál es la
    correspondencia correcta?
  options:
    - id: a
      text: "Compactación = elimina los bloques más viejos del historial; edición de contexto = los resume en su lugar; memoria = amplía la ventana de contexto del modelo para que quepa todo"
      rationale: "Compactar es tirar lo viejo, editar es resumirlo, y la memoria es lo que permite mirar más atrás."
    - id: b
      text: "Las tres son nombres del mismo mecanismo en distintas versiones de la API, y hoy conviven solo por compatibilidad con integraciones antiguas que fijaron una de ellas"
      rationale: "Suena razonable si se han leído en distintas versiones de la documentación, donde los nombres fueron cambiando."
    - id: d
      text: "Compactación y edición operan entre sesiones, guardando el estado para la siguiente; memoria opera dentro de una sesión, recortando lo que deja de caber en la ventana"
      rationale: "Lo que se compacta y se edita persiste entre sesiones; la memoria vive dentro de una sola."
    - id: c
      text: Compactación = resume el historial antiguo; edición de contexto = elimina resultados
        de herramienta o bloques de razonamiento viejos; memoria = persiste estado entre
        sesiones
      rationale: "Se distinguen por el ahorro: una recorta tokens conservando el sentido, otra los borra sin más, y la tercera no ahorra nada porque vive fuera de la sesión."
  correct: c
  explanation: La edición de contexto PODA (borra resultados de herramienta o razonamiento
    antiguos), la compactación RESUME cuando te acercas al límite de ventana, y la memoria
    PERSISTE fuera de la conversación para sobrevivir al reinicio del proceso. Las dos
    primeras operan dentro de una sesión; la memoria es la que cruza sesiones. Muchos
    agentes largos usan las tres.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-013
  dimension: agentes-harnesses
  subtopic: contexto
  difficulty: hard
  type: codigo
  roles: *a1
  stem: >-
    Un agente de conversación larga activa la compactación del servidor. Tras varios turnos,
    el modelo pierde el hilo de lo hablado al principio. Este es el manejo del turno:

        resp = client.beta.messages.create(..., context_management={"edits": [{"type": "compact_20260112"}]})
        texto = "".join(b.text for b in resp.content if b.type == "text")
        mensajes.append({"role": "assistant", "content": texto})

    ¿Dónde está el fallo?
  options:
    - id: d
      text: "Se vuelve a añadir solo el texto: los bloques de compactación que devuelve la API se
        pierden, y con ellos el resumen que sustituye al historial compactado. Hay que
        añadir resp.content entero"
      rationale: "Al turno siguiente el modelo escribe como si nunca hubiera visto lo de antes: la pista es que el historial parece corto."
    - id: a
      text: "La compactación no está disponible en el espacio beta del cliente sino en el estable, y llamarla desde ahí la deja sin efecto de forma silenciosa"
      rationale: "Cambia el prefijo del cliente, no la petición; si estuviera mal por eso, la llamada fallaría en vez de responder de menos."
    - id: b
      text: "Falta fijar un umbral de disparo dentro de context_management; sin él la compactación queda declarada pero no llega a activarse en ningún momento, por larga que se ponga la conversación y por muchos turnos que acumule"
      rationale: "Si eso faltara, el historial crecería sin parar y el síntoma sería el gasto, no el olvido."
    - id: c
      text: "El rol del mensaje que se vuelve a añadir debería ser 'system' y no 'assistant', porque el resumen compactado no es una respuesta del modelo sino contexto de la sesión"
      rationale: "Ese rol no existe dentro del array de mensajes, así que la petición ni saldría."
  correct: d
  explanation: "La compactación devuelve bloques que la API usa en la siguiente petición para
    reemplazar el historial resumido. Extraer solo la cadena de texto y añadir eso descarta
    el estado de compactación en silencio: no falla nada, simplemente se pierde el resumen.
    La regla es añadir resp.content completo, no el texto extraído."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-014
  dimension: agentes-harnesses
  subtopic: cache-en-agentes
  difficulty: medium
  type: concepto
  roles: *a1
  stem: La caché de prompts funciona por coincidencia de prefijo. Sabiendo que el orden de
    renderizado es herramientas → sistema → mensajes, ¿qué cambio invalida MÁS caché?
  options:
    - id: b
      text: Añadir un mensaje nuevo al final de la conversación
      rationale: "Cada mensaje nuevo alarga la conversación, y el prefijo que estaba cacheado se queda atrás."
    - id: a
      text: Añadir, quitar o reordenar una herramienta
      rationale: "Las herramientas se renderizan las primeras: tocar una invalida todo lo que viene detrás."
    - id: c
      text: Cambiar tool_choice entre peticiones
      rationale: "Cambiar cómo se elige la herramienta cambia la petición desde el principio."
    - id: d
      text: Activar o desactivar el razonamiento
      rationale: "Activar el razonamiento cambia la forma del turno, así que el prefijo deja de coincidir."
  correct: a
  explanation: "Las herramientas se renderizan en la posición 0, así que tocarlas invalida
    herramientas, sistema y mensajes: todo. El prompt de sistema invalida sistema y
    mensajes. tool_choice y el razonamiento invalidan solo el tramo de mensajes. Añadir al
    final no invalida nada. De ahí la regla práctica: no cambies el conjunto de herramientas
    a mitad de conversación."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-015
  dimension: agentes-harnesses
  subtopic: cache-en-agentes
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Tu agente necesita meterle una instrucción de operador a mitad de sesión ('modo
    conciso activado'). Editar el prompt de sistema funcionaría, pero te destroza la caché
    de todo el historial. ¿Cuál es la alternativa que preserva el prefijo cacheado?
  options:
    - id: b
      text: "Reenviar la instrucción en cada llamada como primer elemento del array de mensajes, por delante de todo el historial"
      rationale: "Puesta la primera, la instrucción se lee antes que nada y aplica al turno entero."
    - id: a
      text: "Duplicar el prompt de sistema con y sin la instrucción e ir alternando entre los dos según el modo activo"
      rationale: "Con dos versiones ya calentadas se alterna entre ellas sin reescribir ninguna a mitad de sesión."
    - id: c
      text: Añadir un mensaje con rol 'system' al final del array de mensajes, después del
        historial cacheado
      rationale: "Añadirla al final deja intacto todo el prefijo cacheado y solo agrega contenido nuevo detrás."
    - id: d
      text: "Meterla como descripción de una herramienta nueva que el modelo no llegue a invocar nunca"
      rationale: "Una herramienta nueva lleva su propia descripción, y el modelo la lee como instrucción."
  correct: c
  explanation: "En los modelos que lo soportan se puede añadir {'role':'system', ...} dentro
    del array de mensajes: al ir DESPUÉS del historial, el prefijo cacheado sigue intacto, y
    además es un canal de operador no falsificable (a diferencia de meter la instrucción
    como texto de usuario). Ponerla la primera, o editar el system de arriba, cambia el
    prefijo y reprocesa toda la conversación."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-016
  dimension: agentes-harnesses
  subtopic: cache-en-agentes
  difficulty: experto
  type: escenario
  roles: *a2
  stem: Un agente con muchas llamadas a herramientas por turno empieza a fallar la caché entre
    peticiones, aunque el prefijo es idéntico y los puntos de corte están puestos. Los
    turnos añaden 30-40 bloques de contenido cada uno. ¿Cuál es la causa más probable?
  options:
    - id: a
      text: "El límite de cuatro puntos de corte por petición se ha superado y la API los ignora todos, no solo los que sobran, así que la petición entera se factura como escritura de caché nueva"
      rationale: "Se detecta enseguida: si fuera eso, todas las peticiones fallarían la caché por igual, también las de turnos cortos."
    - id: b
      text: "Los resultados de herramienta no son cacheables porque su contenido cambia en cada ejecución, así que rompen el prefijo en cuanto aparecen en el historial y obligan a reescribir la entrada entera"
      rationale: "Si así fuera, el ahorro sería el mismo en todos los turnos y no habría empezado a fallar con el tiempo."
    - id: c
      text: "El TTL de cinco minutos expira entre turnos por culpa de la latencia de las herramientas, y cada turno vuelve a escribir la caché desde cero"
      rationale: "Se descarta midiendo: el hueco entre turnos se ve en la traza, y con herramientas rápidas el fallo sigue."
    - id: d
      text: Cada punto de corte solo mira hacia atrás un número acotado de bloques (unos 20)
        buscando una entrada previa; un turno que añade más bloques que esa ventana deja el
        corte fuera de alcance
      rationale: "La pista es que falla justo en los turnos más gordos: el ancla queda detrás de todo lo que se añadió de golpe."
  correct: d
  explanation: El punto de corte retrocede un número limitado de bloques (del orden de 20)
    para encontrar la entrada anterior. Un turno agéntico que añade 30-40 bloques de
    tool_use/tool_result deja la entrada previa fuera de esa ventana y el fallo es
    silencioso. El arreglo es intercalar cortes intermedios cada ~15 bloques dentro de los
    turnos largos. El TTL es plausible pero se descartaría mirando los tiempos; los
    resultados de herramienta sí son cacheables.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-017
  dimension: agentes-harnesses
  subtopic: cache-en-agentes
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Lanzas 20 peticiones en paralelo que comparten un prefijo grande idéntico. Ninguna lee
    caché y pagas 20 escrituras. ¿Cuál es el patrón correcto?
  options:
    - id: c
      text: Enviar una primera petición, esperar a que empiece a llegar su respuesta, y solo
        entonces lanzar las 19 restantes
      rationale: "La primera petición materializa la entrada; una vez empieza a responder, las otras diecinueve ya encuentran el prefijo escrito."
    - id: a
      text: "Subir el TTL a una hora: con el TTL corto la caché no llega a materializarse antes de que entren las peticiones concurrentes"
      rationale: "Con una vida corta la entrada caduca antes de que las peticiones hermanas lleguen a leerla."
    - id: b
      text: "Poner el punto de corte al final del prompt completo en lugar de al final del prefijo común, para que la entrada de caché abarque más"
      rationale: "El corte tiene que abarcar todo lo que se repite, y eso incluye el prompt entero de cada petición."
    - id: d
      text: "No hay solución por diseño: las peticiones concurrentes nunca comparten entrada de caché, así que el prefijo se escribe tantas veces como peticiones lances"
      rationale: "Al salir a la vez, ninguna ha escrito todavía cuando las demás buscan: la concurrencia y la caché no casan."
  correct: c
  explanation: "Una entrada de caché no es legible hasta que la primera respuesta empieza a
    emitirse. Veinte peticiones simultáneas escriben todas en frío. Calentando con una y
    esperando al primer token, las demás ya leen. Subir el TTL no cambia el problema (es de
    carrera, no de expiración) y poner el corte al final del prompt completo empeoraría:
    cada petición escribiría una entrada distinta."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-018
  dimension: agentes-harnesses
  subtopic: thinking-effort
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En los modelos actuales, ¿dónde se configura el parámetro de esfuerzo (effort) y qué
    controla?
  options:
    - id: b
      text: "Como parámetro de primer nivel de la petición; controla la temperatura efectiva del muestreo"
      rationale: "Va suelto en la petición, como el resto de mandos de generación, y regula cuánto se arriesga el modelo al elegir tokens."
    - id: d
      text: Dentro de output_config; controla la profundidad de razonamiento y el gasto general de
        tokens
      rationale: "Va junto a lo que configura la salida y gobierna cuánto se piensa y cuánto se gasta en total."
    - id: a
      text: "Dentro del objeto thinking; sustituye al presupuesto de tokens de razonamiento de los modelos anteriores"
      rationale: "Vive donde se configuraba el razonamiento y ocupa el lugar que tenía el presupuesto de tokens."
    - id: c
      text: "Como cabecera HTTP de la petición; controla la prioridad con la que entra en la cola de servicio"
      rationale: "Viaja como cabecera, igual que otras opciones de servicio, y decide qué prioridad tiene la petición."
  correct: d
  explanation: "effort va dentro de output_config (output_config: {effort: 'high'}), no de
    primer nivel ni dentro de thinking. Controla cuánto piensa y cuánto actúa el modelo: a
    menor esfuerzo, menos llamadas a herramienta y respuestas más escuetas. No es una
    temperatura ni una prioridad de cola."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-019
  dimension: agentes-harnesses
  subtopic: thinking-effort
  difficulty: hard
  type: concepto
  roles: *a1
  stem: "Un compañero propone controlar el razonamiento con thinking: {type: 'enabled',
    budget_tokens: 8000} en un modelo de la generación actual (Opus 5 / Sonnet 5 / Fable 5).
    ¿Qué le respondes?"
  options:
    - id: b
      text: "Que funciona, pero solo si budget_tokens se mantiene por debajo de max_tokens; si lo supera, la API rechaza la petición con un error de validación"
      rationale: "El presupuesto de razonamiento sale del mismo tope de la respuesta, así que tiene que caber dentro de él."
    - id: c
      text: "Que funciona y es la forma recomendada de acotar el gasto en producción, porque fija un techo exacto de tokens de razonamiento por respuesta y hace el coste predecible"
      rationale: "Fijar el presupuesto en tokens es la forma de acotar lo que puede costar cada llamada en producción."
    - id: a
      text: "Que ese parámetro se ha retirado y la petición devolverá un 400: hoy se usa
        razonamiento adaptativo y se regula la profundidad con effort"
      rationale: "El síntoma es inequívoco: no degrada ni se ignora, la llamada ni sale. Si algo se ignorara en silencio, sería otra cosa."
    - id: d
      text: "Que es equivalente a effort: 'medium' y produce exactamente el mismo resultado, solo que expresado en tokens en lugar de en una etiqueta"
      rationale: "Es la forma antigua de decir lo mismo, y el servicio la traduce al nivel intermedio."
  correct: a
  explanation: El presupuesto fijo de tokens de razonamiento está retirado en la generación
    actual y la petición se rechaza con 400. El sustituto es el razonamiento adaptativo (el
    modelo decide cuánto piensa) con effort como palanca de profundidad. La regla
    'budget_tokens < max_tokens' era la de los modelos anteriores.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-020
  dimension: agentes-harnesses
  subtopic: thinking-effort
  difficulty: hard
  type: escenario
  roles: *a1
  stem: "Tu producto muestra el razonamiento del modelo en la interfaz. Tras migrar a la
    generación actual, los usuarios ven una pausa larga y luego la respuesta de golpe: los
    bloques de razonamiento llegan con el texto vacío. ¿Qué falta?"
  options:
    - id: c
      text: "Activar el streaming, porque sin él los bloques de razonamiento no llegan a emitirse y solo aparece el texto final"
      rationale: "Sin consumo incremental no hay nada que enseñar mientras se genera: el razonamiento solo se ve en directo."
    - id: a
      text: "Subir el effort: por debajo de 'high' el razonamiento no se devuelve"
      rationale: "El razonamiento superficial no deja resumen que devolver; solo a partir de cierta profundidad hay algo que mostrar."
    - id: d
      text: "Nada: en la generación actual el razonamiento ya no se puede mostrar al usuario final"
      rationale: "El razonamiento pasó a ser interno, así que la interfaz solo puede enseñar la respuesta final."
    - id: b
      text: "Pedir el razonamiento con display: 'summarized'; por defecto viene omitido"
      rationale: "La pista está en que los bloques llegan pero vacíos: el canal funciona, lo que falta es haber pedido el contenido."
  correct: b
  explanation: "En los modelos actuales el valor por defecto de thinking.display es 'omitted':
    los bloques llegan, pero con el texto vacío. Para recuperar un resumen legible hay que
    pedir explícitamente thinking: {type: 'adaptive', display: 'summarized'}. El display
    solo controla la visibilidad: el modelo piensa y se factura igual con cualquier ajuste,
    y la cadena de razonamiento en bruto no se devuelve nunca."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-021
  dimension: agentes-harnesses
  subtopic: economia-de-tokens
  difficulty: hard
  type: concepto
  roles: *a2
  stem: ¿En qué se diferencia un presupuesto de tarea (task budget) de max_tokens?
  options:
    - id: b
      text: max_tokens es un tope duro por respuesta que el modelo no ve; el presupuesto de tarea
        es un contador que el modelo SÍ ve, para dosificarse a lo largo de un bucle agéntico
        y cerrar con orden
      rationale: "La diferencia se nota en el comportamiento: uno hace que el modelo cierre ordenado antes de gastarlo; el otro lo corta a mitad de frase."
    - id: a
      text: "Son sinónimos: 'presupuesto de tarea' es el nombre nuevo de max_tokens en la documentación de agentes, y el parámetro que viaja por debajo sigue siendo el mismo"
      rationale: "Es el nombre nuevo del mismo tope, ahora expresado a nivel de tarea en vez de por llamada."
    - id: c
      text: "max_tokens acota los tokens de entrada de la petición y el presupuesto de tarea acota los de salida, de modo que entre los dos delimitan el coste total del turno"
      rationale: "Uno acota lo que entra y el otro lo que sale: entre los dos cierran el gasto de la llamada."
    - id: d
      text: "El presupuesto de tarea es un tope duro que corta la generación en seco al alcanzarlo, mientras que max_tokens es orientativo y el modelo puede rebasarlo si le hace falta para cerrar la respuesta"
      rationale: "Uno lo corta el servicio y el otro es una indicación que el modelo puede sobrepasar."
  correct: b
  explanation: "max_tokens corta la respuesta sin que el modelo lo sepa: por eso trunca a
    media frase. El presupuesto de tarea inyecta una cuenta atrás que el modelo lee mientras
    genera, de forma que prioriza y termina con gracia en vez de que lo corten. Es
    orientativo, no un tope: si necesitas un techo duro sigue siendo max_tokens (o, en
    agentes gestionados, un presupuesto de sesión en dinero)."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-022
  dimension: agentes-harnesses
  subtopic: economia-de-tokens
  difficulty: experto
  type: escenario
  roles: *a2
  stem: Un agente encadena tres llamadas dependientes (leer perfil → buscar pedidos →
    comprobar inventario) y cada resultado intermedio son miles de tokens que nadie vuelve a
    necesitar. ¿Qué patrón ataca la raíz del coste?
  options:
    - id: a
      text: "Bajar el effort a 'low' para que el modelo consolide las tres llamadas en una sola y no arrastre los resultados intermedios por el contexto"
      rationale: "Con menos profundidad el modelo agrupa el trabajo en menos llamadas y arrastra menos resultados intermedios."
    - id: c
      text: "Llamada programática a herramientas: el modelo escribe un script que invoca las
        herramientas; los resultados vuelven al código en ejecución y solo la salida final
        entra en el contexto"
      rationale: "Los miles de tokens intermedios nunca llegan a entrar en la conversación, así que no hay que resumirlos ni pagarlos en cada turno siguiente."
    - id: b
      text: "Activar la compactación del contexto para que los resultados intermedios se resuman en cuanto dejan de hacer falta, en lugar de acumularse turno tras turno hasta llenar la ventana del modelo"
      rationale: "Resumir lo que ya no hace falta es exactamente lo que quita peso del historial."
    - id: d
      text: "Subir max_tokens para que los tres resultados quepan sin truncarse, que es lo que provoca las relecturas y el gasto extra del bucle"
      rationale: "Con más tope caben los tres resultados enteros y se evita perder información por truncado."
  correct: c
  explanation: "Con uso de herramientas clásico cada llamada es una ida y vuelta y cada
    resultado aterriza en el contexto. La llamada programática mueve la composición a un
    script en el contenedor de ejecución: las herramientas se invocan desde el código, los
    resultados los procesa el propio script con control de flujo normal y solo el resultado
    final vuelve al modelo. El coste pasa a escalar con la salida final, no con los
    intermedios. Bajar el effort o compactar mitigan; no eliminan las idas y vueltas."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-023
  dimension: agentes-harnesses
  subtopic: escalado-de-herramientas
  difficulty: hard
  type: concepto
  roles: *a1
  stem: Tienes un catálogo de 120 herramientas, pero en cada petición solo son relevantes tres
    o cuatro. ¿Por qué la búsqueda de herramientas (tool search) es preferible a
    intercambiar el array de herramientas según el caso?
  options:
    - id: d
      text: "Porque permite superar el límite de 128 herramientas por petición, que es lo que impide declarar un catálogo de este tamaño de una sola vez"
      rationale: "Descubrir esquemas bajo demanda es lo que permite pasar del máximo de herramientas por petición."
    - id: b
      text: "Porque ejecuta las herramientas en el servidor de Anthropic y ahorra la latencia de red de ida y vuelta a tu infraestructura en cada llamada"
      rationale: "Al resolverse en el servidor se ahorra el viaje de red por cada llamada a herramienta."
    - id: a
      text: Porque los esquemas descubiertos se AÑADEN a la petición en vez de sustituir el
        conjunto, y eso preserva la caché de prompt; cambiar el array de herramientas
        invalidaría todo el prefijo
      rationale: "El coste está en el prefijo: las herramientas se renderizan las primeras, así que tocar el array reprocesa todo lo que viene detrás."
    - id: c
      text: "Porque valida los esquemas de entrada de forma estricta antes de enviarlos, y con un catálogo de 120 herramientas los errores de esquema pasan a ser la causa principal de fallo en producción"
      rationale: "Aporta una validación estricta de los argumentos antes de que la herramienta llegue a ejecutarse."
  correct: a
  explanation: "Las herramientas se renderizan en la posición 0 del prompt: cualquier cambio
    en el conjunto invalida la caché entera. La búsqueda de herramientas resuelve el
    problema de escala sin ese coste porque los esquemas se añaden en vez de intercambiarse,
    dejando el prefijo intacto. No ejecuta nada por ti ni tiene que ver con la validación
    estricta."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-024
  dimension: agentes-harnesses
  subtopic: salidas-estructuradas
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Heredas un pipeline que fuerza JSON prellenando el último turno del asistente con '{'
    y luego extrae la respuesta con una expresión regular y un bucle de reintentos. Al
    migrar a un modelo actual, ¿qué pasa y qué se hace?
  options:
    - id: a
      text: "Sigue funcionando igual que antes; lo único que hay que hacer es subir max_tokens para que el JSON completo quepa en la respuesta sin truncarse"
      rationale: "El patrón sigue siendo válido; lo único que cambia es que ahora hace falta más margen de salida."
    - id: c
      text: "Hay que cambiar el prellenado del turno del asistente por una secuencia de parada equivalente, que consigue el mismo efecto de forzar el formato de salida sin llegar a escribir en el turno del modelo"
      rationale: "El truco equivalente es cortar la generación donde toca en vez de empezarla escrita."
    - id: d
      text: "Hay que envolver el prellenado en un bloque de razonamiento para que el modelo lo acepte como parte de su propio turno y siga generando desde ahí"
      rationale: "El texto prellenado se conserva si viaja dentro del bloque de razonamiento del turno."
    - id: b
      text: El prellenado del último turno del asistente devuelve 400; se sustituye por salidas
        estructuradas (output_config.format con un esquema), y con ello sobran la regex y el
        bucle de reintentos
      rationale: "El patrón viejo no degrada, falla en seco. Y lo que lo sustituye elimina de paso el bucle de reintentos, que era la mitad del código."
  correct: b
  explanation: "El prellenado del turno final del asistente está retirado en los modelos
    actuales y devuelve 400. Su sustituto es la salida estructurada: se declara el esquema
    en output_config.format y la respuesta viene validada. Lo importante en la migración es
    que también se borra el andamiaje que existía solo para sostener el truco: secuencias de
    parada, extracción con regex y reintentos por fallo de parseo."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-025
  dimension: agentes-harnesses
  subtopic: salidas-estructuradas
  difficulty: medium
  type: codigo
  roles: *a1
  stem: >-
    Quieres garantizar que los argumentos de una herramienta validen exactamente contra su
    esquema. ¿Cuál de estas declaraciones es la correcta?

        A) tool_choice = {"type": "tool", "name": "reservar", "strict": True}
        B) tools = [{"name": "reservar", "strict": True, "input_schema": {...}}]
  options:
    - id: a
      text: "B: strict es un campo de primer nivel de la DEFINICIÓN de la herramienta, junto a
        name/description/input_schema, y el esquema necesita additionalProperties en falso y
        su lista de required"
      rationale: "Se comprueba mirando dónde vive: lo que describe cómo se valida acompaña a la declaración, no a la decisión de invocarla."
    - id: b
      text: "A: strict es una propiedad de tool_choice que endurece el comportamiento al forzar una herramienta concreta, y por eso viaja junto al nombre de la herramienta elegida y no en su definición"
      rationale: "Se declara donde se fuerza la herramienta, que es el punto donde se decide cómo se la invoca."
    - id: c
      text: "Las dos son válidas y equivalentes: la API acepta el campo en cualquiera de los dos sitios y aplica la validación estricta igual, así que se elige por gusto de estilo"
      rationale: "Las dos vías activan lo mismo: una en la definición y otra en la elección."
    - id: d
      text: "Ninguna de las dos: el modo estricto no se declara en la petición sino que se activa con una cabecera beta, y sin ella el campo se ignora en silencio"
      rationale: "El modo estricto todavía va detrás de una cabecera de función en pruebas."
  correct: a
  explanation: strict va en la definición de la herramienta, no en tool_choice, y exige que el
    esquema declare additionalProperties en falso y sus campos required. Es una confusión
    muy habitual porque ambos parámetros hablan de herramientas, pero tool_choice decide
    CUÁL se llama y strict decide CÓMO se validan sus argumentos.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-026
  dimension: agentes-harnesses
  subtopic: subagentes
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Quieres usar un modelo más barato para una subtarea pesada de lectura sin destrozar la
    caché del bucle principal. ¿Cuál es la vía correcta?
  options:
    - id: c
      text: "Cambiar el modelo a mitad de conversación para esos turnos y volver al original después, aprovechando que el historial ya está cacheado"
      rationale: "Cambiar de modelo solo durante esos turnos aprovecha el precio bajo sin tocar el resto del bucle."
    - id: a
      text: Lanzar un subagente con el modelo barato y mantener el bucle principal en un solo
        modelo
      rationale: "Un subagente se lleva la lectura pesada a su propio contexto y el bucle principal sigue con un único modelo."
    - id: b
      text: "Bajar el effort del bucle principal durante esos turnos, que es lo que abarata la lectura pesada sin tocar el modelo"
      rationale: "Bajar la profundidad en esos turnos recorta el gasto sin cambiar de modelo ni de conversación."
    - id: d
      text: "Duplicar la conversación en dos hilos con modelos distintos y fusionar los dos historiales al terminar la subtarea"
      rationale: "Con dos hilos en paralelo cada uno avanza por su lado y al final se juntan los historiales."
  correct: a
  explanation: "Las cachés están asociadas al modelo: cambiar de modelo a mitad de sesión
    invalida el prefijo entero, y volver no lo recupera. La vía limpia es delegar la
    subtarea a un subagente con su propio modelo y su propia ventana, y que el bucle
    principal siga en un solo modelo. Además la subtarea de lectura devuelve solo su
    informe, con lo que el contexto principal no se llena."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-027
  dimension: agentes-harnesses
  subtopic: subagentes
  difficulty: hard
  type: escenario
  roles: *a2
  stem: ¿Cuál de estas tareas es el MEJOR candidato para repartir entre subagentes en paralelo?
  options:
    - id: b
      text: "Editar tres funciones dentro de un mismo fichero que ya está leído en el contexto del coordinador, una por subagente"
      rationale: "Tres ediciones sobre el mismo fichero se pueden repartir, y cada subagente se ocupa de una función."
    - id: a
      text: "Renombrar una variable en todo el proyecto repartiendo la búsqueda y el reemplazo por carpetas entre varios subagentes"
      rationale: "Un renombrado toca muchos ficheros a la vez: repartirlos entre subagentes acorta el reloj."
    - id: d
      text: Investigar ocho fuentes independientes cuya lectura llenaría por sí sola la ventana
        del coordinador
      rationale: "Lo que decide es si el trabajo cabe: ocho lecturas independientes que no se pisan y que juntas no entrarían en una sola ventana."
    - id: c
      text: "Verificar el resultado que acaba de producir el propio agente, lanzando varios revisores en paralelo sobre la misma salida"
      rationale: "Revisar el propio trabajo desde fuera es justo lo que un segundo agente hace mejor que quien lo escribió."
  correct: d
  explanation: "Delegar cuesta: cada subagente reestablece contexto, explora e informa, y el
    coordinador vuelve a leer su informe. Compensa cuando el trabajo es genuinamente
    independiente y voluminoso —ocho fuentes que se leen en paralelo y devuelven solo su
    hallazgo—. No compensa en trabajo que el coordinador remata en unas pocas llamadas, ni
    para verificar: la verificación pertenece al bucle principal."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-028
  dimension: agentes-harnesses
  subtopic: diagramas
  difficulty: medium
  type: diagrama
  roles: *a1
  stem: |-
    Mira este flujo de un bucle agéntico:

        usuario ──► [modelo] ──► stop_reason?
                       ▲            │
                       │            ├── end_turn ──► fin
                       │            └── tool_use ──► ejecutar herramientas
                       │                                  │
                       └────────── (?) ◄──────────────────┘

    ¿Qué va exactamente en (?)?
  options:
    - id: a
      text: "Añadir a los mensajes solo el texto del asistente y a continuación los tool_result, que es lo que el modelo necesita para seguir"
      rationale: "Lo que el modelo dijo importa para el hilo, y los resultados van detrás como respuesta a lo que pidió."
    - id: b
      text: "Añadir solo los tool_result: el turno del asistente con sus bloques tool_use lo reconstruye la API a partir de la respuesta anterior"
      rationale: "El servicio conserva el turno que acaba de emitir, así que basta con devolverle lo que faltaba."
    - id: d
      text: "Reiniciar la conversación con el prompt original más un resumen de lo que se ha ejecutado hasta ahora, para que el historial no crezca sin control"
      rationale: "Rearrancar con el prompt original y un resumen deja la conversación corta y sin arrastrar bloques."
    - id: c
      text: Añadir a los mensajes el turno del asistente COMPLETO (con sus bloques tool_use) y
        después un mensaje de usuario con todos los tool_result
      rationale: "El error típico es quedarse con el texto y tirar los bloques: el modelo pierde de vista qué pidió y vuelve a pedirlo."
  correct: c
  explanation: "El historial tiene que quedar coherente: primero el turno del asistente tal
    como llegó, con sus bloques tool_use intactos (si te quedas solo con el texto, los
    tool_result quedan huérfanos y la petición falla), y luego un único mensaje de usuario
    con los tool_result emparejados por tool_use_id. La API no reconstruye nada: es estado
    que llevas tú."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-029
  dimension: agentes-harnesses
  subtopic: streaming
  difficulty: easy
  type: concepto
  roles: *a1
  stem: ¿Por qué se recomienda hacer streaming cuando max_tokens es alto (decenas de miles)?
  options:
    - id: a
      text: Porque sin streaming la petición puede agotar el tiempo de espera HTTP del cliente
      rationale: "El fallo aparece como error de red y despista: no es el modelo el que se rinde, es la conexión que nadie mantiene viva."
    - id: b
      text: "Porque sin streaming el modelo trunca la respuesta a 4096 tokens, sea cual sea el max_tokens que hayas pedido"
      rationale: "Sin consumo incremental el servicio aplica el tope conservador por defecto y recorta la respuesta."
    - id: c
      text: "Porque el streaming reduce el coste por token de salida al repartir la generación en trozos más pequeños"
      rationale: "El precio por token de salida baja al entregarse la respuesta a trozos en vez de en bloque."
    - id: d
      text: "Porque sin streaming no se pueden usar herramientas en respuestas largas"
      rationale: "Las peticiones de herramienta se emiten como eventos, así que hacen falta para poder atenderlas."
  correct: a
  explanation: "Una generación larga sin streaming mantiene la conexión abierta sin enviar
    nada hasta el final y choca con los tiempos de espera del cliente HTTP. El streaming
    evita ese corte. No cambia el precio ni habilita capacidades: solo la forma de entrega."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-030
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Un agente autónomo nocturno termina algunos turnos con un párrafo de intención ('ahora
    voy a ejecutar las pruebas') sin la llamada a herramienta correspondiente, y el pipeline
    lo da por completado. ¿Cuál es la corrección más directa a nivel de harness/prompt?
  options:
    - id: b
      text: "Subir el effort a 'max' en todas las peticiones del turno nocturno, para que el modelo tenga margen de razonamiento suficiente y no se quede a medias del plan que acaba de enunciar"
      rationale: "Con la máxima profundidad el modelo planifica mejor y no se deja el trabajo a medias."
    - id: a
      text: "Instruirlo para que antes de cerrar el turno revise su último párrafo: si es un plan,
        una pregunta o una promesa de trabajo no hecho, lo ejecute ya; y que solo termine
        cuando la tarea esté completa o esté bloqueado por algo que solo el usuario puede
        resolver"
      rationale: "Ataca la causa: el turno se cierra porque el modelo cree haber terminado, no porque le falte capacidad ni empeño."
    - id: c
      text: "Reintentar automáticamente cada turno dos veces y quedarse con la respuesta más larga de las dos, porque la que trae el trabajo hecho además del plan enunciado siempre ocupa más que la que se queda en la mera intención de hacerlo"
      rationale: "Repitiendo el turno y quedándose con la respuesta más completa se compensa el turno que salió corto."
    - id: d
      text: "Desactivar el razonamiento para que el modelo no elabore planes por su cuenta y pase directamente a llamar a las herramientas que tenga declaradas en la petición"
      rationale: "Sin razonamiento previo el modelo deja de anunciar planes y va directo a ejecutar."
  correct: a
  explanation: "Es un fallo de cierre de turno, y se corrige con una instrucción de cierre
    explícita: revisar el último párrafo y convertir plan o promesa en acción antes de
    terminar. En operación autónoma conviene añadir que el usuario no está mirando y no
    puede responder preguntas. Subir el esfuerzo no ataca el patrón, reintentar y quedarse
    con la respuesta más larga es una heurística sin relación con la corrección, y
    desactivar el razonamiento degrada la tarea."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-031
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Antes de construir un agente conviene comprobar cuatro cosas. ¿Cuál de estas NO es una
    de ellas?
  options:
    - id: d
      text: Que la tarea sea multi-paso y difícil de especificar por completo de antemano
      rationale: "Si la tarea se puede especificar entera de antemano, no hace falta que nadie decida sobre la marcha."
    - id: a
      text: Que el resultado justifique el coste y la latencia extra
      rationale: "Un agente cuesta más y tarda más que una llamada directa, y eso tiene que compensar."
    - id: b
      text: Que exista ya un conjunto de datos etiquetado para afinar el modelo
      rationale: "Sin datos etiquetados no hay forma de ajustar el modelo a la tarea antes de ponerlo a trabajar."
    - id: c
      text: Que el modelo sea capaz en ese tipo de tarea
      rationale: "Si el modelo no es bueno en ese tipo de trabajo, el bucle solo multiplica los errores."
  correct: b
  explanation: "Los cuatro criterios son complejidad (multi-paso, mal especificable), valor
    (compensa el coste y la latencia), viabilidad (el modelo sabe hacerlo) y coste del error
    (se puede detectar y revertir). El afinado con datos etiquetados no entra: la mayoría de
    agentes útiles se construyen sin tocar los pesos del modelo. Si falla cualquiera de los
    cuatro, quédate en un escalón más simple: una llamada o un flujo con lógica en código."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-032
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: medium
  type: escenario
  roles: *a2
  stem: "Revisas un 'agente' interno: su traza es siempre el mismo cuerpo de bucle N veces, y
    cada llamada al modelo tiene una salida completamente determinada por su entrada
    (normalizar un campo, decidir a qué cola va un ticket según reglas fijas, formatear un
    informe). ¿Cuál es el diagnóstico?"
  options:
    - id: b
      text: "Está bien resuelto: usar el modelo de forma uniforme en todos los pasos hace el sistema más mantenible que mezclar código y llamadas"
      rationale: "Resolverlo todo con el mismo mecanismo deja un sistema uniforme y más fácil de mantener."
    - id: a
      text: "Hay que subir el effort para que cada iteración avance más y el número total de vueltas del bucle baje"
      rationale: "Con más profundidad por llamada, el bucle converge en menos vueltas y sale más barato."
    - id: d
      text: "Hay que sustituir todas las llamadas al modelo por código normal, porque un agente bien construido no debería llamar al modelo dentro de un bucle en ningún caso, ni siquiera una vez"
      rationale: "Si el bucle se repite igual cada vez, lo que sobra es el modelo: eso es código y punto."
    - id: c
      text: "Es un plan determinista ejecutado por un LLM: esos pasos vuelven a código normal y se
        deja una única llamada al modelo donde el trabajo sea realmente de criterio"
      rationale: "El olor está en la traza: si todas las vueltas son idénticas, no hay ninguna decisión que justifique pagar una llamada."
  correct: c
  explanation: "Si la salida está determinada por la entrada, no hace falta un modelo:
    enrutar, contar, normalizar, filtrar y formatear son código. La corrección es devolver
    esos pasos al código y conservar la llamada donde hay juicio real (clasificar lo
    ambiguo, redactar el resumen). Llevarlo al extremo de cero llamadas es pasarse cuando sí
    existe un paso de criterio."
  source: externa:practica-industria
  date: 2026-08-10
- id: agentes-033
  dimension: agentes-harnesses
  subtopic: triggers
  difficulty: medium
  type: concepto
  roles: *a2
  stem: La oferta menciona 'triggers' entre las cosas que hay que entender de los agentes en
    producción. ¿Qué es un trigger en este contexto?
  options:
    - id: d
      text: "El evento que arranca una ejecución del agente sin que haya un humano escribiendo: un
        cron, un webhook, un cambio en un sistema interno"
      rationale: "Lo que cambia con ellos es la seguridad: no hay nadie mirando la pantalla cuando el agente decide actuar."
    - id: a
      text: "El token especial que se inserta en el prompt para que el modelo empiece a razonar antes de responder, y que marca el arranque del bloque de pensamiento"
      rationale: "Es la marca a partir de la cual el modelo entra en modo razonamiento antes de responder."
    - id: b
      text: "La instrucción del prompt que fuerza el uso de una herramienta concreta en el turno siguiente, sin dejarle la elección al modelo"
      rationale: "Es la parte del prompt que empuja al modelo hacia una herramienta concreta en lugar de dejarle elegir."
    - id: c
      text: "El umbral de confianza a partir del cual el agente deja de decidir por su cuenta y pide aprobación a un humano antes de seguir"
      rationale: "Confunde el disparador con la parada: eso decide cuándo se detiene, no cuándo empieza."
  correct: d
  explanation: "Un trigger es lo que inicia el agente cuando nadie lo está pilotando: una
    programación horaria, un webhook de otro sistema, un evento de datos. Importa porque
    cambia el diseño entero —no hay quien conteste preguntas a mitad de ejecución, el radio
    de acción hay que acotarlo por adelantado y los fallos se descubren por registros, no en
    pantalla—."
  source: jd-codeway
  date: 2026-08-10
- id: agentes-034
  dimension: agentes-harnesses
  subtopic: triggers
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Un agente programado se dispara cada hora. Una ejecución falla porque estaba limitada
    por cuota. ¿Cuál es la política de reintento más sensata para una tarea periódica de
    este tipo?
  options:
    - id: b
      text: "Reintentar de inmediato y en bucle hasta que la cuota se libere y la ejecución consiga entrar, que es lo que evita perder la ventana de esa hora"
      rationale: "Si el bloqueo es temporal, insistir hasta entrar es lo que garantiza que la tarea no se quede sin hacer."
    - id: a
      text: Registrar el fallo y dejar que lo recoja la siguiente ocurrencia programada, sin
        recuperar las ejecuciones perdidas
      rationale: "Recuperar lo perdido en algo horario acumula ejecuciones que compiten por la misma cuota que ya estaba agotada."
    - id: c
      text: "Duplicar la frecuencia del cron para compensar los fallos y asegurar que en cada hora entre al menos una ejecución completa"
      rationale: "Doblando la frecuencia hay margen de sobra para absorber las ejecuciones que no entren."
    - id: d
      text: "Archivar la programación para que un humano la revise antes de volver a ejecutarla, porque un fallo por cuota indica un problema de dimensionado"
      rationale: "Un fallo de cuota apunta a un problema de dimensionamiento, y eso lo tiene que mirar una persona."
  correct: a
  explanation: "En una tarea periódica, la siguiente ocurrencia ya es el reintento natural:
    registrar el fallo y seguir evita amplificar la presión sobre una cuota que ya está
    saturada. Reintentar en bucle o doblar la frecuencia empeoran justo la condición que
    causó el fallo. Archivar es la respuesta a fallos NO recuperables (un recurso borrado),
    no a un límite de cuota transitorio."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-035
  dimension: agentes-harnesses
  subtopic: errores-y-reintentos
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En el manejo de errores de la API, ¿qué familia de códigos conviene reintentar con
    retroceso exponencial?
  options:
    - id: c
      text: 400, 401 y 404
      rationale: "Son los que indican que algo temporal ha ido mal en la petición y suele arreglarse al repetirla."
    - id: a
      text: Todos los códigos distintos de 200
      rationale: "Cualquier respuesta que no sea correcta puede deberse a un incidente pasajero, así que conviene repetirla."
    - id: b
      text: 429, 5xx y errores de conexión
      rationale: "Límite de ritmo, fallos del servidor y cortes de red: los tres se resuelven solos esperando un poco más cada vez."
    - id: d
      text: Solo 429
      rationale: "Solo el límite de ritmo se arregla esperando; el resto no cambia por repetir la llamada."
  correct: b
  explanation: "Los reintentables son los transitorios: 429 (límite de tasa, con la cabecera
    retry-after), los 5xx del servidor y los fallos de red antes de recibir respuesta. Un
    400 (petición mal formada), un 401 (credencial) o un 404 (modelo o recurso inexistente)
    no mejoran reintentando: son bugs. Por eso conviene capturar las excepciones tipadas del
    SDK en cadena y no una sola clase amplia, que borra justo esta distinción."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-036
  dimension: agentes-harnesses
  subtopic: contexto
  difficulty: easy
  type: concepto
  roles: *a1
  stem: ¿Qué significa que la API de mensajes es 'sin estado' (stateless)?
  options:
    - id: a
      text: "Que el modelo no puede recordar nada de lo dicho dentro de una misma respuesta"
      rationale: "Dentro de una misma generación el modelo no guarda nada: cada token se produce a partir de lo que tiene delante."
    - id: b
      text: "Que no se pueden usar herramientas entre un turno y el siguiente"
      rationale: "Sin estado entre llamadas no hay dónde apoyar una herramienta que abarque varios turnos."
    - id: c
      text: "Que las respuestas no son reproducibles entre peticiones"
      rationale: "Sin estado guardado, dos llamadas iguales pueden dar resultados distintos."
    - id: d
      text: Que en cada petición envías el historial completo de la conversación
      rationale: "De ahí sale casi todo lo demás: por qué la conversación crece, por qué se paga por lo mismo cada turno y por qué existe la caché."
  correct: d
  explanation: "El servidor no guarda tu conversación: cada petición lleva el historial entero
    de mensajes. De ahí que la gestión del contexto sea trabajo del harness (qué se
    conserva, qué se poda, qué se resume) y que la caché de prompts sea tan importante para
    el coste: reenviarías el mismo prefijo una y otra vez a precio completo."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-037
  dimension: agentes-harnesses
  subtopic: cache-en-agentes
  difficulty: medium
  type: codigo
  roles: *a1
  stem: >-
    Este prompt de sistema no consigue ni un acierto de caché entre peticiones idénticas.
    ¿Por qué?

        system = f"""Eres un asistente de soporte.
        Fecha y hora actual: {datetime.now().isoformat()}
        {MANUAL_DE_PRODUCTO}"""
  options:
    - id: d
      text: "Porque la marca de tiempo cambia en cada petición y está ANTES del contenido estable:
        al ser una coincidencia de prefijo, invalida todo lo que va detrás"
      rationale: "La prueba es mover esa línea al final y ver cómo aparecen los aciertos: el orden es lo único que cambia."
    - id: b
      text: "Porque el prompt de sistema no es cacheable: la caché de prefijo solo cubre los mensajes de la conversación, nunca las instrucciones de sistema"
      rationale: "Lo cacheable son los mensajes; el prompt de sistema se procesa aparte en cada llamada."
    - id: a
      text: "Porque falta declarar el punto de corte de caché en el último bloque de mensajes, y sin esa marca explícita la API no llega a escribir la entrada"
      rationale: "Sin declarar el punto de corte no hay nada que guardar: la caché no se activa sola."
    - id: c
      text: "Porque las f-strings no se serializan de forma determinista y el mismo texto acaba produciendo bytes distintos en cada llamada"
      rationale: "El formateo de cadenas no garantiza el mismo resultado byte a byte entre ejecuciones."
  correct: d
  explanation: "La caché es coincidencia de prefijo byte a byte: un valor que cambia en cada
    petición envenena todo lo que viene después, y aquí el manual entero va detrás de la
    marca de tiempo. La solución es dejar el prompt de sistema congelado y meter lo volátil
    más adelante, en los mensajes. Es el invalidador silencioso más común, junto con
    identificadores aleatorios y JSON serializado sin ordenar las claves."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-038
  dimension: agentes-harnesses
  subtopic: diseno-tool-surface
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Un agente de investigación usa poco la herramienta de búsqueda y contesta de memoria.
    Antes de tocar nada, ¿qué dos palancas atacas primero?
  options:
    - id: b
      text: "Añadir 'CRÍTICO: DEBES usar siempre esta herramienta' al prompt de sistema"
      rationale: "Una instrucción tajante en el prompt es la vía directa para que el modelo deje de saltarse la herramienta."
    - id: a
      text: Subir el nivel de effort, y hacer la descripción de la herramienta prescriptiva sobre
        CUÁNDO llamarla ('llámala cuando la respuesta dependa de información actual...')
      rationale: "Las dos atacan lo mismo desde sitios distintos: cuánto se piensa antes de decidir, y con qué criterio decide."
    - id: c
      text: Forzar tool_choice a la herramienta de búsqueda en todas las peticiones
      rationale: "Forzando la herramienta en cada petición se garantiza que el agente nunca conteste de memoria."
    - id: d
      text: Bajar max_tokens para que no le dé tiempo a contestar de memoria
      rationale: "Con menos margen de salida el modelo no puede extenderse de memoria y tiene que buscar."
  correct: a
  explanation: Un esfuerzo más alto aumenta de forma medible el uso de herramientas en tareas
    de búsqueda, y las descripciones que declaran la condición de disparo (no solo lo que
    hace la herramienta) dan un salto claro frente a las que solo describen la función. El
    lenguaje a gritos es contraproducente en los modelos actuales, que siguen el prompt muy
    de cerca y acaban sobredisparando. Forzar tool_choice mata el criterio del modelo y
    bajar max_tokens no tiene relación con el problema.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-039
  dimension: agentes-harnesses
  subtopic: prompting-de-harness
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Estás migrando un prompt de sistema escrito hace dos generaciones de modelos. Está
    lleno de 'CRÍTICO:', 'NUNCA', 'DEBES' y 'ante la duda, usa la herramienta X'. ¿Qué le
    pasa a ese texto hoy?
  options:
    - id: c
      text: "Nada: el énfasis es neutro y en el peor caso se ignora"
      rationale: "El énfasis solo añade ruido: si no aplica, el modelo lo ignora y sigue con su criterio."
    - id: a
      text: "Deja de funcionar por completo: el énfasis en mayúsculas se filtra y se ignora"
      rationale: "Las mayúsculas se procesan como tokens raros y el modelo deja de reconocer la instrucción."
    - id: b
      text: "Sobredispara: los modelos actuales siguen el prompt mucho más de cerca, así que
        instrucciones escritas para vencer la reticencia de modelos antiguos ahora se
        aplican de más"
      rationale: "El síntoma delata: el agente empieza a llamar a herramientas donde no hacía falta y a tratar cada regla como innegociable."
    - id: d
      text: Aumenta la latencia porque las mayúsculas gastan más tokens
      rationale: "Escribir en mayúsculas rompe las palabras en más tokens y encarece cada llamada."
  correct: b
  explanation: Aquel lenguaje era una compensación por modelos poco dirigibles. Con modelos
    que siguen el sistema al pie de la letra, el mismo texto produce sobredisparo y rigidez,
    y cuando todo va marcado como crítico el énfasis deja de portar información. La
    corrección es bajar el volumen y decir la condición real ('usa X cuando...'), no añadir
    más barandillas.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-040
  dimension: agentes-harnesses
  subtopic: superficies-de-agente
  difficulty: medium
  type: concepto
  roles: *a2
  stem: En un agente gestionado, ¿dónde viven el modelo, el prompt de sistema y las herramientas?
  options:
    - id: a
      text: "En la sesión: se pasan en cada arranque"
      rationale: "Se pasan al arrancar cada sesión, que es donde se decide con qué configuración va a trabajar."
    - id: b
      text: En el entorno, junto a la configuración de red del contenedor
      rationale: "Van con el entorno de ejecución, junto a lo que define red y recursos del contenedor."
    - id: d
      text: En una plantilla de despliegue independiente de agente y sesión
      rationale: "Viven en una plantilla aparte, para poder reutilizar la misma configuración en agentes y sesiones distintos."
    - id: c
      text: En el agente, que es un objeto persistente y versionado; la sesión solo lo referencia
        por id
      rationale: "Por eso dos sesiones del mismo agente son comparables entre sí, y cambiar de modelo es publicar una versión, no editar una sesión."
  correct: c
  explanation: "El agente es un objeto persistente y versionado que lleva modelo, prompt de
    sistema, herramientas, servidores MCP y skills; la sesión referencia ese agente por id
    (opcionalmente fijando una versión) y añade lo que sí es por ejecución: entorno,
    recursos, credenciales. El anti-patrón clásico es crear un agente nuevo en cada
    ejecución: acumula objetos huérfanos y anula el versionado."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-041
  dimension: agentes-harnesses
  subtopic: streaming
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Tu cliente lee un flujo de eventos de una sesión de agente y la conexión se corta a
    mitad. Reconectas y sigues leyendo desde ese momento. ¿Qué problema tiene ese diseño?
  options:
    - id: d
      text: "El flujo no se rebobina: los eventos emitidos durante el corte se pierden. Al
        reconectar hay que consolidar con la lista de eventos del histórico y deduplicar por
        id"
      rationale: "El fallo es silencioso: reconectas, sigues recibiendo eventos, y lo que falta son justo los del hueco que nadie mira."
    - id: b
      text: "Ninguno: al reconectar el servidor reenvía los eventos perdidos"
      rationale: "Al reconectar el servidor repone lo que no llegó a entregarse durante la caída."
    - id: a
      text: Que hay que reconectar con un id de sesión distinto para no duplicar eventos
      rationale: "Reconectando con otro identificador se evita que los eventos ya recibidos vuelvan a contarse."
    - id: c
      text: Que reconectar reinicia la sesión y hay que reenviar el mensaje inicial
      rationale: "La reconexión abre una sesión limpia, así que hay que reenviar el mensaje inicial para retomarla."
  correct: d
  explanation: "Un flujo de eventos entrega lo que ocurre desde que se abre; no reproduce el
    pasado. El patrón correcto en cada (re)conexión es abrir el flujo primero, leer el
    histórico paginado para cubrir el hueco y deduplicar por id de evento. Es especialmente
    grave si durante el corte quedó pendiente una confirmación de herramienta: el cliente se
    desconecta, la sesión queda esperando y nadie resuelve."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-042
  dimension: agentes-harnesses
  subtopic: diseno-tool-surface
  difficulty: experto
  type: escenario
  roles: *a2
  stem: Tu harness ejecuta herramientas en paralelo cuando puede. ¿Qué propiedad determina si
    una acción se puede marcar como paralelizable, y por qué bash no la tiene?
  options:
    - id: a
      text: Que su esquema de entrada sea estricto; bash no declara esquema
      rationale: "Sin esquema declarado el harness no puede validar la entrada, y sin eso no se puede lanzar a la vez que otras."
    - id: b
      text: Que sea de solo lectura y sin efectos observables por otras llamadas del mismo turno;
        con bash el harness recibe una cadena opaca y no puede distinguir un grep inocuo de
        un git push, así que debe serializar
      rationale: "El criterio se ve preguntando qué pasa si dos se ejecutan a la vez: si una puede pisar lo que la otra lee, van en serie."
    - id: c
      text: Que devuelva contenido estructurado; bash devuelve texto plano
      rationale: "Sin salida estructurada no se pueden fusionar los resultados de varias llamadas simultáneas."
    - id: d
      text: Que su tiempo de ejecución esté acotado; los comandos de shell no lo están
      rationale: "Sin un tiempo máximo acotado, una llamada lenta bloquearía a las demás del lote."
  correct: b
  explanation: "Paralelizar es seguro cuando las llamadas no se pisan: lecturas sin efectos
    secundarios. El problema de bash no es el esquema ni el formato de salida, es que TODAS
    las acciones llegan con la misma forma —una cadena de comando— y el harness no tiene
    forma fiable de clasificarla, así que por prudencia serializa. Promover las lecturas a
    herramientas dedicadas (buscar, leer, listar) es justo lo que devuelve la capacidad de
    paralelizar."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-043
  dimension: agentes-harnesses
  subtopic: contexto
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Un agente de larga duración escribe notas en ficheros para recordar entre sesiones.
    ¿Qué guía hace que esa memoria sea útil y no un vertedero?
  options:
    - id: c
      text: Volcar la transcripción completa de cada sesión en un fichero por fecha
      rationale: "La transcripción entera conserva todo el contexto, y siempre se puede buscar dentro cuando haga falta."
    - id: b
      text: Guardar solo los errores, porque los aciertos ya están implícitos en el código
      rationale: "Lo que hay que recordar son los tropiezos; lo que salió bien ya está escrito en el propio código."
    - id: a
      text: Una lección por fichero con un resumen en la primera línea; registrar tanto
        correcciones como enfoques confirmados y por qué importaron; no guardar lo que el
        repositorio ya recoge; actualizar la nota existente antes que duplicar; borrar lo
        que resulte falso
      rationale: "El vertedero aparece cuando la memoria es solo aditiva: notas duplicadas, ninguna borrada, y ninguna que se pueda descartar sin abrirla."
    - id: d
      text: Dejar que el modelo decida el formato en cada sesión sin darle indicaciones
      rationale: "Dejar el formato abierto permite que cada sesión guarde lo que de verdad le hizo falta."
  correct: a
  explanation: "La memoria rinde cuando es recuperable y no redundante: una idea por fichero,
    resumen arriba para poder decidir relevancia sin leerlo entero, con el porqué (una regla
    sin motivo no se sabe cuándo deja de aplicar), sin duplicar lo que el repositorio o el
    historial ya registran, y con borrado de lo que se demuestre falso. Volcar
    transcripciones o dejar el formato al azar hace la memoria imposible de consultar."
  source: externa:practica-industria
  date: 2026-08-10
- id: agentes-044
  dimension: agentes-harnesses
  subtopic: economia-de-tokens
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En la respuesta de la API, ¿qué mide exactamente el campo input_tokens cuando hay
    caché de prompt activa?
  options:
    - id: a
      text: El total de tokens del prompt, incluyendo lo servido desde caché
      rationale: "Es el tamaño del prompt: todo lo que el modelo ha leído, venga de caché o no."
    - id: b
      text: Los tokens escritos a caché en esta petición
      rationale: "Cuenta lo que esta petición ha dejado escrito en caché para las siguientes."
    - id: c
      text: Los tokens del prompt de sistema únicamente
      rationale: "Cuenta las instrucciones fijas, que son las que se facturan aparte del historial."
    - id: d
      text: "Solo el resto no cacheado: el total es input_tokens más los de escritura y los de
        lectura de caché"
      rationale: "Por eso el gasto calculado a mano sale más bajo que la factura: falta lo que se leyó de caché, que también se paga aunque más barato."
  correct: d
  explanation: input_tokens es el remanente procesado a precio completo. El tamaño real del
    prompt es la suma de input_tokens, cache_creation_input_tokens y
    cache_read_input_tokens. Si no lo sabes, un agente que lleva horas corriendo parece
    consumir 4.000 tokens de entrada y sacas conclusiones equivocadas sobre el coste. Y si
    cache_read se queda a cero entre peticiones con el mismo prefijo, hay un invalidador
    silencioso.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-045
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: experto
  type: escenario
  roles: *a2
  stem: Migras un agente a un modelo nuevo que verifica su propio trabajo sin que se lo pidan.
    Tu prompt lleva desde hace dos generaciones instrucciones de 'incluye un paso final de
    verificación' y 'usa un subagente para verificar', y tu harness tiene además una etapa
    de verificación aparte. ¿Qué haces?
  options:
    - id: d
      text: "Borrar las instrucciones de verificación del prompt y revisar la etapa del harness:
        mantenerlas produce sobre-verificación (más coste y latencia) sin ganancia de
        calidad"
      rationale: "El modelo nuevo ya hace por su cuenta lo que el prompt viejo le pedía: lo que se hereda no es ayuda, es trabajo duplicado."
    - id: c
      text: "Dejarlo: la verificación redundante nunca hace daño"
      rationale: "Comprobar de más nunca ha estropeado un resultado: en el peor caso se repite trabajo."
    - id: b
      text: Reescribirlas con más énfasis para que la verificación sea aún más exhaustiva
      rationale: "Si el modelo ya verifica, insistir en el prompt hace que lo haga de forma más rigurosa."
    - id: a
      text: Sustituirlas por 'comprueba tu respuesta dos veces antes de contestar'
      rationale: "Una sola instrucción corta y clara sustituye a las tres viejas sin perder la comprobación."
  correct: d
  explanation: "Es un borrado, no una reescritura: cuando el modelo ya verifica por su cuenta,
    pedírselo produce sobre-verificación sin mejora medible. El andamiaje del harness
    heredado de modelos anteriores hay que revisarlo igual. Y ojo con la opción de
    'comprueba tu respuesta dos veces': invierte una buena práctica de prompting clásica que
    en estos modelos dispara exactamente el mismo trabajo de más."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-046
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Para trabajo agéntico de largo recorrido (una refactorización grande, una tanda
    nocturna), ¿qué forma de dar la tarea rinde mejor?
  options:
    - id: b
      text: Ir revelándola poco a poco en varios turnos para poder corregir el rumbo pronto
      rationale: "Ir dosificando permite corregir el rumbo antes de que el agente se meta por un camino equivocado."
    - id: a
      text: Especificarla entera y bien en un primer turno, con la meta y las restricciones, y
        dejar correr al agente con un esfuerzo alto
      rationale: "Con contexto completo desde el principio, el agente puede replanificar solo; a trozos, cada turno decide sin saber a dónde va."
    - id: c
      text: Empezar con un enunciado vago a propósito para no sesgar el enfoque del modelo
      rationale: "Un enunciado abierto deja que el modelo proponga un enfoque que quizá no se te había ocurrido."
    - id: d
      text: Dividirla en microtareas y lanzar una sesión nueva por cada una
      rationale: "Troceada en microtareas, cada sesión arranca limpia y ninguna se queda sin contexto."
  correct: a
  explanation: "En trabajo autónomo largo, una especificación completa por adelantado con
    esfuerzo alto es lo que mejor rinde: el modelo planifica sobre la meta real en vez de
    reconstruirla a trozos. Los enunciados ambiguos revelados progresivamente reducen la
    eficiencia de tokens y a menudo el resultado. Trocear en sesiones independientes tira el
    contexto acumulado en cada corte."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-047
  dimension: agentes-harnesses
  subtopic: escalado-de-herramientas
  difficulty: experto
  type: concepto
  roles: *a2
  stem: Las 'skills' (instrucciones empaquetadas que el agente carga cuando vienen al caso) y
    las descripciones de herramienta cumplen papeles distintos. ¿Cuál es la división
    correcta?
  options:
    - id: a
      text: "La skill sustituye a la descripción: si hay skill, la herramienta puede ir sin
        describir"
      rationale: "Ahorra tokens, pero el modelo tendría que adivinar los parámetros de una herramienta cuya guía quizá no ha cargado."
    - id: c
      text: La descripción es para el humano que lee el código y la skill es para el modelo
      rationale: "El esquema entra en cada petición y lo lee el modelo; nadie escribe límites y errores para un humano."
    - id: b
      text: La descripción de la herramienta lleva el contrato (qué hace, parámetros, límites,
        cuándo llamarla) y viaja en cada petición; la skill lleva el material de enseñanza
        (procedimientos, ejemplos largos, mejores prácticas) y se carga bajo demanda
      rationale: "Lo que se paga en cada llamada frente a lo que se paga solo cuando hace falta: por eso una cabe en dos líneas y la otra en diez páginas."
    - id: d
      text: Son intercambiables; la elección es cuestión de estilo del equipo
      rationale: "El coste decide: una viaja siempre y la otra no, así que confundirlas se nota en la factura y en el prefijo cacheado."
  correct: b
  explanation: "La descripción está en el contexto en TODAS las peticiones, así que su coste
    es recurrente: ahí va el contrato y la condición de disparo, no diálogos de ejemplo ni
    protocolos numerados. La skill se paga solo cuando se dispara, y es donde cabe el
    material extenso. Confundirlos tiene dos formas típicas: incrustar ejemplos largos en la
    descripción (impuesto en cada petición) o dejar la herramienta con una línea escueta
    confiando en que la skill lo explique (la herramienta se usa mal o no se usa)."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-048
  dimension: agentes-harnesses
  subtopic: prompting-de-harness
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Un agente de codificación con la generación actual del modelo se ha vuelto muy
    hablador entre llamadas a herramienta y narra cada acción rutinaria. ¿Cuál es la
    corrección que funciona sin perder calidad?
  options:
    - id: d
      text: Bajar el effort hasta que las respuestas se acorten
      rationale: "Recorta la elaboración, y con ella también el criterio: se pierde calidad para ganar brevedad."
    - id: a
      text: Recortar max_tokens para que no le quepa la narración
      rationale: "El tope no distingue narración de trabajo: lo que se corta es el final del turno, no el relato."
    - id: b
      text: Añadir 'sé conciso' repetido en varios puntos del prompt de sistema
      rationale: "Repetir la instrucción se diluye entre cien llamadas a herramienta; el modelo la aplica al principio del turno y la suelta."
    - id: c
      text: "Poner un silencio por defecto entre llamadas: escribir solo al encontrar algo,
        cambiar de rumbo o bloquearse, y cerrar con una o dos frases de resultado"
      rationale: "Convierte lo escrito en excepción y no en costumbre: el turno solo se rompe cuando hay algo que decir."
  correct: c
  explanation: "La palanca es una instrucción explícita de estilo de comunicación con un
    silencio por defecto y criterios de cuándo sí hablar. Bajar el esfuerzo cambia cuánto
    piensa y actúa, no de forma fiable cuánto texto visible produce: pagas calidad sin
    resolver el síntoma. Recortar max_tokens trunca respuestas legítimas. Y repetir 'sé
    conciso' en varios sitios es duplicación que el modelo tiene que reconciliar."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-049
  dimension: agentes-harnesses
  subtopic: superficies-de-agente
  difficulty: experto
  type: escenario
  roles: *a2
  stem: Un agente gestionado debe llamar a una API interna con una clave. ¿Cuál es la forma
    correcta de que la clave llegue a la petición saliente sin quedar expuesta al código que
    corre en el contenedor?
  options:
    - id: d
      text: "Guardarla como credencial de variable de entorno en un almacén de credenciales: el
        contenedor solo ve un marcador opaco y el secreto se sustituye en la salida a la
        red"
      rationale: "La clave nunca llega a existir dentro del contenedor, así que ni el código que escriba el agente ni lo que lea puede sacarla."
    - id: a
      text: Incluirla en el prompt de sistema del agente para que la use al construir la llamada
      rationale: "En el prompt de sistema viaja con el agente y está disponible justo donde se construye la llamada."
    - id: b
      text: Pasarla como argumento de la herramienta en la primera llamada de la sesión
      rationale: "Pasada como argumento de la herramienta, viaja por el canal que ya lleva el resto de parámetros."
    - id: c
      text: Escribirla en un fichero del espacio de trabajo con permisos restringidos
      rationale: "Los permisos protegen de otros procesos, no del propio agente: él lee ese fichero con la misma herramienta con la que lee el resto."
  correct: d
  explanation: "La frontera de seguridad es que el secreto no entre en el sandbox: con una
    credencial de tipo variable de entorno el contenedor ve un marcador y la sustitución
    ocurre a la salida, así que ni el código que escriba el agente ni una inyección de
    prompt pueden leerlo. Meterla en el prompt o en un mensaje la persiste en el historial
    de eventos de la sesión, recuperable después; escribirla en un fichero del espacio de
    trabajo la deja legible por cualquier cosa que se ejecute dentro."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: agentes-050
  dimension: agentes-harnesses
  subtopic: loop-engineering
  difficulty: easy
  type: concepto
  roles: *a2
  stem: La oferta dice que construyen 'cerca de los modelos' en vez de apoyarse en frameworks
    todo-en-uno. ¿Qué implica eso en la práctica?
  options:
    - id: b
      text: Que entrenan sus propios modelos base en lugar de usar modelos de terceros
      rationale: "Eso sería una empresa de modelos, no de producto: cambia el negocio entero, no la forma de construir."
    - id: a
      text: Que el bucle, las herramientas y el manejo del contexto se escriben contra las APIs de
        los modelos, para poder razonar sobre cada pieza y depurarla, en vez de heredar las
        abstracciones de un framework
      rationale: "Se nota al depurar: cuando algo falla se abre el bucle propio, en vez de leer el código de una librería para adivinar qué hizo con tu prompt."
    - id: c
      text: Que no usan ninguna librería, ni siquiera los SDK oficiales
      rationale: "El SDK es un cliente HTTP con tipos, no una abstracción que decida por ti: quitarlo no cambia quién controla el bucle."
    - id: d
      text: Que evitan por completo el uso de herramientas y trabajan con una sola llamada
      rationale: "Sin herramientas no hay agente que valga: eso es una llamada, y el debate del framework ni se plantea."
  correct: a
  explanation: "Construir cerca del modelo es controlar el bucle, el contexto y la superficie
    de herramientas a mano, sobre las APIs, para poder ver y ajustar cada decisión. No es
    renunciar a los SDK oficiales ni entrenar modelos propios, y desde luego no es evitar el
    uso de herramientas: es evitar que una capa de abstracción decida por ti cosas —qué
    entra en contexto, cuándo se reintenta, cómo se recorta— que luego tendrás que depurar a
    ciegas."
  source: jd-codeway
  date: 2026-08-10
