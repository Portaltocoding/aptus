# Dimensión: memoria-retrieval — qué entra en la ventana y de dónde sale: ingeniería de
# contexto, memoria persistente, bases vectoriales y recuperación.
#
# La oferta lo lista como "memory and retrieval: vector and memory layers such as Mem0,
# Zep, or similar WHEN THE USE CASE REQUIRES IT". Ese matiz está evaluado: varias
# preguntas van sobre cuándo NO hace falta.
#
# source: jd-codeway | externa:anthropic-docs | externa:mcp-spec-2026-07-28 |
# externa:practica-industria.

- id: mem-001
  dimension: memoria-retrieval
  subtopic: ingenieria-de-contexto
  difficulty: easy
  type: concepto
  roles: &a3
    - Applied AI Engineer
    - AI Engineer
  stem: ¿Qué es la ingeniería de contexto?
  options:
    - id: c
      text: Decidir qué información entra en la ventana del modelo, en qué orden y en qué formato,
        tratando el contexto como un presupuesto que hay que asignar
      rationale: "Trata la ventana como un presupuesto: todo lo que entra desplaza a otra cosa que podría haber entrado."
    - id: a
      text: Escribir prompts de sistema más largos y detallados
      rationale: "Un prompt de sistema más largo y detallado deja menos margen a la interpretación del modelo."
    - id: b
      text: Ampliar la ventana de contexto del modelo mediante afinado
      rationale: "Ampliar la ventana con un ajuste del modelo es lo que permite meter más material."
    - id: d
      text: Comprimir el historial de conversación para que quepa más
      rationale: "Comprimir el historial es lo que hace que quepa más conversación en el mismo espacio."
  correct: c
  explanation: "El contexto es un recurso finito y competido: cada bloque que metes ocupa
    sitio, cuesta dinero y compite por la atención del modelo. La ingeniería de contexto es
    la disciplina de asignarlo —qué instrucciones, qué documentos, qué historial, qué
    esquemas de herramienta, en qué orden—. Comprimir el historial es una técnica dentro de
    ella, no su definición."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-002
  dimension: memoria-retrieval
  subtopic: ingenieria-de-contexto
  difficulty: medium
  type: concepto
  roles: &a1
    - Applied AI Engineer
    - AI Engineer
    - Agent Engineer
  stem: ¿Por qué meter más contexto no siempre mejora el resultado, aunque quepa de sobra?
  options:
    - id: b
      text: Porque los modelos tienen un límite duro de documentos que pueden procesar
      rationale: "Hay un tope de documentos por llamada, y a partir de ahí el material sobrante no se procesa."
    - id: a
      text: "Porque el material irrelevante compite por la atención: los modelos atienden peor a
        lo que queda en el medio de un contexto largo, y el ruido puede desviar la respuesta
        además de costar dinero y latencia"
      rationale: "Se comprueba fácil: quita la mitad de los documentos y mira si la respuesta empeora. Muchas veces mejora."
    - id: c
      text: Porque el modelo procesa el contexto en orden y se queda con lo último que lee
      rationale: "El contexto se lee en orden y pesa más lo último, así que añadir por delante no cambia nada."
    - id: d
      text: Porque el contexto extra se descarta si supera cierto umbral
      rationale: "Pasado cierto umbral, el material extra se descarta antes de llegar al modelo."
  correct: a
  explanation: "Meter todo lo que quepa tiene coste en tokens, en latencia y sobre todo en
    precisión: la atención sobre contextos largos no es uniforme —el material del medio se
    recupera peor que el del principio y el final— y el contenido irrelevante puede llevarse
    la respuesta a otro sitio. De ahí que recuperar menos y mejor gane a recuperar mucho, y
    que el orden sea una decisión de diseño."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-003
  dimension: memoria-retrieval
  subtopic: cuando-no
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Te piden 'un RAG' para que un asistente conteste sobre las políticas internas. El
    corpus son doce documentos que suman unas 30.000 palabras y cambian dos veces al año.
    ¿Cuál es la propuesta sensata?
  options:
    - id: a
      text: Montar el pipeline completo con base vectorial, troceado y reordenador desde el
        principio
      rationale: "Montar el pipeline completo desde el principio evita rehacerlo cuando el corpus crezca."
    - id: b
      text: Afinar un modelo con los documentos para que los memorice
      rationale: "Ajustando el modelo con los documentos, las políticas quedan dentro y no hay que recuperarlas."
    - id: d
      text: "Meter el corpus entero en el contexto, cacheado como prefijo estable: cabe de sobra,
        elimina el fallo de recuperación y sale barato al leerse de caché. La recuperación
        se añade cuando el corpus crezca"
      rationale: "La cuenta decide: doce documentos caben de sobra, cambian dos veces al año y leídos de caché salen casi gratis."
    - id: c
      text: Trocear a 512 tokens y recuperar los 5 fragmentos más similares
      rationale: "Trocear y traer los más parecidos es el patrón estándar, y funciona con cualquier tamaño de corpus."
  correct: d
  explanation: "Con un corpus pequeño y estable, la recuperación añade un modo de fallo (no
    encontrar el fragmento correcto) sin resolver ningún problema real, y encima trocear
    rompe el contexto de las políticas. Metido entero y cacheado como prefijo estable, el
    coste por consulta es una fracción y la calidad es la máxima posible. El afinado es lo
    peor de todo para conocimiento factual que cambia: no se actualiza, no se cita y no se
    audita."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-004
  dimension: memoria-retrieval
  subtopic: cuando-no
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Un asistente interno tiene que responder '¿cuántos pedidos hizo el cliente X el mes
    pasado?'. ¿Cuál es el diseño correcto?
  options:
    - id: b
      text: Indexar los pedidos en una base vectorial y recuperar los más similares a la pregunta
      rationale: "Indexados como cualquier otro documento, los pedidos del cliente salen al preguntar por él."
    - id: a
      text: Volcar los pedidos del mes en el contexto y dejar que el modelo cuente
      rationale: "Con los pedidos del mes delante, contar es trivial para el modelo."
    - id: d
      text: Generar embeddings de cada pedido y calcular la respuesta por agregación de
        similitudes
      rationale: "Agregando las similitudes de los pedidos se obtiene la cifra sin salir del índice."
    - id: c
      text: "Una herramienta que consulte la base de datos con parámetros tipados: es una pregunta
        estructurada con respuesta exacta, y la búsqueda por similitud no cuenta ni agrega"
      rationale: "La pregunta pide una cifra exacta sobre registros: eso no se aproxima por parecido, se calcula."
  correct: c
  explanation: La búsqueda semántica encuentra cosas parecidas; no cuenta, no suma y no filtra
    por rangos con exactitud. Una pregunta agregada sobre datos estructurados se responde
    con una consulta, y el trabajo del modelo es traducir la pregunta a los parámetros de
    esa herramienta. Volcar los pedidos y dejar que cuente funciona a veces y falla en
    silencio cuando hay muchos, que es la peor propiedad posible.
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-005
  dimension: memoria-retrieval
  subtopic: embeddings
  difficulty: easy
  type: concepto
  roles: &a2
    - Applied AI Engineer
    - AI Engineer
    - ML Engineer
  stem: ¿Qué es un embedding de texto?
  options:
    - id: b
      text: Un vector numérico de dimensión fija que codifica el significado, colocando textos
        semánticamente parecidos cerca en el espacio
      rationale: "De ahí sale que dos frases sin palabras en común puedan salir juntas, y que una negación apenas mueva nada."
    - id: a
      text: Un resumen comprimido del texto en lenguaje natural
      rationale: "Un resumen en lenguaje natural conserva el contenido ocupando bastante menos."
    - id: c
      text: El identificador único del texto en el índice
      rationale: "Serviría para localizarlo, no para encontrarlo sin saber cómo se llama."
    - id: d
      text: La lista de tokens en que se descompone el texto
      rationale: "La descomposición en tokens es la representación con la que el modelo trabaja."
  correct: b
  explanation: "Un embedding es una representación vectorial de dimensión fija: el modelo se
    entrena para que textos con significado parecido queden próximos, y por eso se puede
    buscar por similitud en vez de por coincidencia de palabras. No es un resumen legible,
    ni un identificador, ni la tokenización."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-006
  dimension: memoria-retrieval
  subtopic: embeddings
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Con vectores normalizados a norma 1, ¿qué relación hay entre ordenar por similitud
    coseno y ordenar por distancia euclídea?
  options:
    - id: a
      text: Dan órdenes inversos entre sí
      rationale: "Una mide parecido y la otra distancia, así que ordenan al revés la una de la otra."
    - id: d
      text: "Dan el mismo orden: con norma 1, la distancia euclídea al cuadrado es una función
        decreciente del coseno"
      rationale: "Por eso la elección entre una y otra es cosa de la implementación, no del resultado que verá el usuario."
    - id: b
      text: "No hay relación: dependen de la distribución de los datos"
      rationale: "Depende de cómo estén repartidos los datos: no hay una relación que valga siempre."
    - id: c
      text: El coseno solo se puede usar con vectores de enteros
      rationale: "El coseno exige componentes enteras para que el producto escalar sea exacto."
  correct: d
  explanation: "Para vectores unitarios, ||a−b||² = 2 − 2·cos(a,b): la distancia crece
    exactamente cuando el coseno baja, así que el RANKING es idéntico y elegir una u otra
    métrica no cambia qué documentos salen. Importa a efectos prácticos —qué métrica soporta
    el índice, cómo se interpretan las puntuaciones— y deja de ser equivalente si los
    vectores NO están normalizados, porque entonces la euclídea sí se ve afectada por la
    magnitud."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-007
  dimension: memoria-retrieval
  subtopic: indices
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Un índice vectorial aproximado (por ejemplo, basado en grafos como HNSW) expone un
    parámetro de búsqueda que se puede subir o bajar. ¿Qué compromiso controla?
  options:
    - id: a
      text: Precisión frente a memoria consumida por el índice
      rationale: "Cuánta precisión se consigue por cada unidad de memoria que ocupa el índice."
    - id: c
      text: Dimensionalidad frente a calidad del embedding
      rationale: "Cuántas dimensiones se conservan y, con ellas, cuánta calidad tiene la representación."
    - id: b
      text: "Exhaustividad frente a latencia: explorar más candidatos acerca el resultado al de la
        búsqueda exhaustiva a costa de tardar más; explorar menos es más rápido y se deja
        vecinos por el camino"
      rationale: "Es la perilla que se toca en producción: se sube hasta que el coste duele, o se baja hasta que fallan los vecinos."
    - id: d
      text: Frescura del índice frente a coste de indexación
      rationale: "Cada cuánto se refresca el índice frente a lo que cuesta reconstruirlo."
  correct: b
  explanation: "Los índices aproximados cambian exactitud por velocidad: el parámetro de
    búsqueda decide cuántos candidatos se exploran, y con ello cuánto se parece el resultado
    al del cálculo exhaustivo. Es una palanca de tiempo de consulta. El consumo de memoria
    lo gobiernan otras decisiones (la cuantización, los parámetros de construcción del
    índice), y la dimensionalidad y la frescura son elecciones distintas."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-008
  dimension: memoria-retrieval
  subtopic: busqueda-hibrida
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Los usuarios buscan por códigos de producto exactos ('REF-4417-B') y la búsqueda
    semántica devuelve productos parecidos pero no ese. ¿Qué falta?
  options:
    - id: c
      text: Aumentar la dimensión de los embeddings para que capten mejor los identificadores
      rationale: "Con más dimensiones el vector capta detalles finos como los identificadores exactos."
    - id: b
      text: Trocear más fino para que el código quede aislado en su propio fragmento
      rationale: "Aislando el código en su propio fragmento, el vector deja de mezclarlo con el resto del texto."
    - id: d
      text: Reordenar los resultados con un modelo cruzado
      rationale: "Un modelo cruzado lee consulta y documento juntos y detecta la coincidencia literal que el vector perdió."
    - id: a
      text: "Búsqueda híbrida: combinar la semántica con una léxica (tipo BM25), que es la que
        acierta con términos raros y exactos —códigos, referencias, nombres propios— donde
        el embedding solo capta 'parece un código'"
      rationale: "Un código no tiene significado que capturar: lo que hay que buscar es la cadena, no algo parecido a ella."
  correct: a
  explanation: "Es la debilidad clásica de la recuperación densa: un identificador raro tiene
    poca señal semántica y su vector se parece al de otros identificadores. La recuperación
    léxica es justo lo contrario, brilla con términos exactos e infrecuentes. Por eso se
    combinan, típicamente fusionando los dos rankings. Reordenar ayuda si el documento
    correcto está entre los candidatos; aquí ni siquiera se recupera."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-009
  dimension: memoria-retrieval
  subtopic: busqueda-hibrida
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Al fusionar los resultados de una búsqueda léxica y una densa, ¿por qué se suele usar
    una fusión basada en el rango (posición) en vez de sumar las puntuaciones?
  options:
    - id: d
      text: Porque las puntuaciones de los dos sistemas están en escalas distintas y no
        comparables, mientras que las posiciones sí lo son
      rationale: "Sumar dos números que no significan lo mismo da un tercero que no significa nada."
    - id: a
      text: Porque calcular con posiciones es computacionalmente más barato
      rationale: "Trabajar con posiciones evita normalizar y sale más barato de calcular."
    - id: b
      text: Porque la fusión por posición garantiza mejor exhaustividad
      rationale: "Fusionar por posición recupera más documentos relevantes que sumar puntuaciones."
    - id: c
      text: Porque las puntuaciones densas no son deterministas
      rationale: "Las puntuaciones densas varían entre ejecuciones y no se pueden usar como valor fijo."
  correct: d
  explanation: "Una puntuación BM25 y una similitud coseno no viven en la misma escala ni
    tienen la misma distribución, así que sumarlas exige normalizar, y la normalización
    depende de la consulta y del corpus. Fusionar por posición esquiva el problema: usa solo
    el orden, que sí es comparable. Es más robusto, aunque a cambio se pierde la información
    de cuánta ventaja tenía el primero sobre el segundo."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-010
  dimension: memoria-retrieval
  subtopic: reordenacion
  difficulty: hard
  type: concepto
  roles: *a2
  stem: ¿Por qué un reordenador de tipo codificador cruzado no se usa directamente como
    buscador sobre todo el corpus?
  options:
    - id: b
      text: Porque su calidad es peor que la de la búsqueda vectorial
      rationale: "Ordena peor que la búsqueda vectorial, y por eso se deja para el final del pipeline."
    - id: c
      text: "Porque codifica consulta y documento JUNTOS, así que no se puede precalcular nada:
        habría que evaluar la consulta contra cada documento del corpus. Por eso se usa
        sobre los k candidatos que ya trajo un buscador rápido"
      rationale: "Es cuestión de cuántas veces se ejecuta: una vez por documento del corpus frente a una vez por candidato."
    - id: a
      text: Porque no admite documentos largos
      rationale: "No admite documentos largos, y sobre un corpus real se quedaría corto enseguida."
    - id: d
      text: Porque necesita etiquetas de relevancia para funcionar en inferencia
      rationale: "Las necesita para entrenarse, no para puntuar: en inferencia solo ve consulta y documento."
  correct: c
  explanation: "Ahí está la asimetría: un codificador bi-direccional separado (bi-encoder)
    permite indexar los documentos por adelantado y comparar vectores, que es baratísimo; un
    codificador cruzado mira consulta y documento a la vez, lo que le da mucha más precisión
    y le impide precalcular. La arquitectura resultante es de dos etapas: recuperar barato y
    amplio, reordenar caro y estrecho."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-011
  dimension: memoria-retrieval
  subtopic: troceado
  difficulty: medium
  type: concepto
  roles: *a3
  stem: ¿Para qué sirve el solape entre fragmentos al trocear documentos?
  options:
    - id: b
      text: Para reducir el tamaño total del índice
      rationale: "Al compartir texto entre fragmentos vecinos hacen falta menos fragmentos para cubrir el documento."
    - id: c
      text: Para acelerar el cálculo de embeddings
      rationale: "Con menos texto nuevo por fragmento, calcular los vectores va más rápido."
    - id: a
      text: "Para que una idea o frase relevante no quede partida justo en el corte: con solape,
        al menos uno de los fragmentos la contiene entera"
      rationale: "Es la respuesta a una pregunta incómoda: el corte cae en un sitio arbitrario que nadie eligió."
    - id: d
      text: Para evitar duplicados en los resultados
      rationale: "Al solaparse, los fragmentos repetidos se detectan y se descartan del resultado."
  correct: a
  explanation: "Sin solape, una definición o una condición que caiga a caballo entre dos
    fragmentos queda mutilada en los dos y no se recupera bien en ninguno. El solape lo
    evita a costa de agrandar el índice y de introducir resultados casi duplicados, que
    suele haber que deduplicar después: es un compromiso, no una mejora gratis."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-012
  dimension: memoria-retrieval
  subtopic: troceado
  difficulty: hard
  type: escenario
  roles: *a2
  stem: "Tus fragmentos de 300 tokens recuperan bien, pero las respuestas salen incompletas:
    al modelo le falta el contexto que rodea al fragmento. ¿Qué patrón lo resuelve sin
    empeorar la recuperación?"
  options:
    - id: c
      text: Subir el tamaño de fragmento a 2.000 tokens
      rationale: "Con fragmentos grandes el contexto viaja dentro del propio fragmento y no falta nada."
    - id: a
      text: Recuperar más fragmentos, de 5 a 20
      rationale: "Trayendo más fragmentos, el que rodea al bueno acaba entrando también."
    - id: d
      text: Añadir un reordenador sobre los fragmentos recuperados
      rationale: "Un reordenador sube arriba los fragmentos que de verdad responden y el hueco desaparece."
    - id: b
      text: "Indexar fragmentos pequeños para buscar, pero devolver al modelo la unidad mayor que
        los contiene (la sección o el documento padre): se busca con precisión y se responde
        con contexto"
      rationale: "Separa dos cosas que se confundían: con qué se busca y qué se entrega. No tienen por qué ser lo mismo."
  correct: b
  explanation: "Hay dos tamaños óptimos distintos y no tienen por qué coincidir: el bueno para
    BUSCAR es pequeño y específico (un fragmento grande diluye su vector entre varios
    temas), y el bueno para RESPONDER es grande y con contexto. Indexar fino y devolver la
    unidad padre satisface a los dos. Agrandar el fragmento estropea la búsqueda, traer
    veinte mete ruido y reordenar no añade el contexto que falta."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-013
  dimension: memoria-retrieval
  subtopic: mantenimiento
  difficulty: medium
  type: concepto
  roles: *a2
  stem: Cambias el modelo de embeddings por uno mejor. ¿Qué hay que hacer con el índice
    existente?
  options:
    - id: d
      text: "Reindexar el corpus entero con el modelo nuevo: los vectores de modelos distintos no
        son comparables entre sí"
      rationale: "Los números de los dos modelos conviven en el índice sin dar error: el fallo es silencioso y sale como resultados malos."
    - id: a
      text: "Nada: los embeddings son compatibles si la dimensión coincide"
      rationale: "Si la dimensión coincide, los vectores conviven en el mismo espacio sin problema."
    - id: b
      text: Reindexar solo los documentos añadidos desde el cambio
      rationale: "Basta con reindexar lo nuevo; lo viejo ya estaba bien representado con el modelo anterior."
    - id: c
      text: Aplicar una matriz de proyección para convertir los vectores antiguos
      rationale: "Una matriz de proyección convierte los vectores antiguos y evita recalcularlo todo."
  correct: d
  explanation: "Cada modelo define su propio espacio: dos vectores de modelos distintos no
    tienen relación aunque compartan dimensión, y mezclarlos produce resultados sin sentido
    que además no fallan ruidosamente. Hay que reembeber todo el corpus, lo que en corpus
    grandes es una operación cara y planificable —normalmente construyendo el índice nuevo
    en paralelo y conmutando—, no un cambio de configuración."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-014
  dimension: memoria-retrieval
  subtopic: filtrado
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En un sistema multiinquilino con base vectorial, ¿cómo se garantiza que un cliente no
    reciba fragmentos de otro?
  options:
    - id: a
      text: Instruyendo al modelo en el prompt para que solo use fragmentos del cliente correcto
      rationale: "Deja la separación entre clientes en manos de algo que no se puede garantizar ni auditar."
    - id: b
      text: Con aislamiento impuesto por debajo (espacios de nombres o índices separados, o un
        filtro obligatorio derivado del contexto autenticado), nunca confiando en que el
        modelo pase bien un identificador
      rationale: "La regla es no dejar que el aislamiento dependa de un parámetro que produce el modelo."
    - id: c
      text: Incluyendo el nombre del cliente en el texto de cada fragmento para que el modelo lo
        distinga
      rationale: "Con el nombre del cliente dentro de cada fragmento, el modelo distingue a quién pertenece."
    - id: d
      text: Recuperando más fragmentos y descartando los que no encajen
      rationale: "Trayendo de más y descartando lo que no encaje se filtra sin tocar el índice."
  correct: b
  explanation: "Si el aislamiento depende de que el modelo rellene bien un parámetro, una
    inyección de prompt o un simple despiste cruzan la frontera. Tiene que estar por debajo:
    espacios de nombres o índices distintos, o un filtro que aplique la capa de datos a
    partir de la identidad autenticada y no de un argumento generado. Poner el nombre en el
    texto ni siquiera impide que el fragmento se recupere."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-015
  dimension: memoria-retrieval
  subtopic: consultas
  difficulty: hard
  type: escenario
  roles: *a2
  stem: En una conversación, el usuario pregunta '¿y cuánto cuesta eso?'. La recuperación no
    encuentra nada útil. ¿Por qué y qué se hace?
  options:
    - id: a
      text: Porque la pregunta es demasiado corta; hay que exigir un mínimo de palabras
      rationale: "Una consulta de tres palabras no da señal suficiente: conviene exigir un mínimo antes de buscar."
    - id: b
      text: Porque falta un reordenador que entienda el contexto conversacional
      rationale: "Falta un reordenador que tenga en cuenta la conversación al puntuar los candidatos."
    - id: d
      text: "Porque la consulta es dependiente del contexto y sin resolver 'eso' no tiene
        contenido semántico: hay que reescribirla como consulta autónoma usando el historial
        antes de buscar"
      rationale: "El fallo está antes de buscar: el vector de esa frase no apunta a ningún sitio porque no dice nada."
    - id: c
      text: Porque el índice no contiene información de precios
      rationale: "Si el índice no tiene precios, ninguna reformulación va a encontrarlos."
  correct: d
  explanation: "El embedding de '¿y cuánto cuesta eso?' no apunta a ningún sitio: la
    información está en los turnos anteriores. La solución estándar es la reescritura de
    consulta —producir una consulta autónoma, 'precio del plan Enterprise', a partir del
    historial— antes de tocar el índice. Es un paso barato que arregla una fracción grande
    de los fallos de recuperación en sistemas conversacionales."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-016
  dimension: memoria-retrieval
  subtopic: agentes
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Qué diferencia hay entre una recuperación previa fija (buscar una vez y meter el
    resultado en el prompt) y darle al agente la búsqueda como herramienta?
  options:
    - id: a
      text: "Ninguna sustancial: cambia solo dónde se coloca la llamada"
      rationale: "Cambia dónde se coloca la llamada, pero el material que acaba en el prompt es el mismo."
    - id: b
      text: La recuperación previa es más precisa porque no depende del criterio del modelo
      rationale: "Buscar antes con una consulta preparada es más fiable que dejarlo al criterio del modelo."
    - id: d
      text: La búsqueda como herramienta no permite citar las fuentes
      rationale: "Como herramienta, el resultado llega sin metadatos y no se puede citar la fuente."
    - id: c
      text: Con la búsqueda como herramienta el agente decide si busca, con qué consulta y si
        vuelve a buscar según lo que encuentre; con la recuperación previa, una consulta
        mala arruina el turno sin remedio
      rationale: "La diferencia se nota en la segunda vuelta: quien puede volver a buscar corrige, quien no, contesta con lo que le tocó."
  correct: c
  explanation: "La diferencia es quién controla el bucle. La recuperación previa es un disparo
    único con la consulta que hayas construido: si falla, el modelo responde con lo que le
    llegó. Como herramienta, el agente puede reformular, buscar de nuevo, cruzar fuentes y
    parar cuando tiene bastante. A cambio cuesta más ida y vuelta, y hay que empujarlo a que
    la use (una descripción que diga CUÁNDO llamarla y un nivel de esfuerzo suficiente)."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-017
  dimension: memoria-retrieval
  subtopic: citas
  difficulty: medium
  type: concepto
  roles: *a3
  stem: ¿Por qué es importante que un sistema con recuperación cite las fuentes de sus
    afirmaciones?
  options:
    - id: a
      text: "Porque hace verificable la respuesta: sin cita, el usuario no puede distinguir lo que
        el sistema encontró de lo que se inventó, y tú no puedes medir la fidelidad a la
        fuente"
      rationale: "Sin cita, comprobar una respuesta cuesta lo mismo que haberla escrito: se pierde el ahorro entero."
    - id: b
      text: Porque mejora la calidad de la recuperación al forzar al modelo a leer los documentos
      rationale: "Obligar a citar hace que el modelo lea de verdad los documentos y recupere mejor."
    - id: c
      text: Porque reduce el consumo de tokens de salida
      rationale: "Citando en corto se evita reproducir el fragmento entero y la salida sale más barata."
    - id: d
      text: Porque es un requisito del protocolo de recuperación
      rationale: "El protocolo de recuperación exige devolver la referencia junto al contenido."
  correct: a
  explanation: "La cita es lo que convierte una afirmación en algo comprobable, para el
    usuario en el momento y para ti al evaluar: con citas se puede automatizar la
    comprobación de que lo afirmado está respaldado por el texto citado, y sin ellas la
    fidelidad solo se mide leyendo a mano. No es un truco para mejorar la recuperación ni un
    requisito de ningún protocolo."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-018
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué distingue la MEMORIA de la gestión de contexto dentro de una sesión
    (compactación, poda)?
  options:
    - id: c
      text: Que la memoria la escribe el modelo y la gestión de contexto el harness
      rationale: "Una la escribe el modelo por su cuenta y la otra la aplica el harness sin preguntarle."
    - id: d
      text: Que la memoria persiste FUERA de la conversación y sobrevive al reinicio del proceso;
        la gestión de contexto opera dentro de una sesión
      rationale: "Se distingue con una pregunta: si mañana arranca otra sesión, ¿sigue estando? Eso decide de qué se está hablando."
    - id: a
      text: Que la memoria es semántica y la gestión de contexto literal
      rationale: "Una guarda significado y la otra recorta texto tal cual, sin entender lo que quita."
    - id: b
      text: Que la memoria no consume tokens al recuperarse
      rationale: "Lo recuperado de memoria no cuenta como entrada, así que no gasta presupuesto."
  correct: d
  explanation: "El eje es la persistencia: compactar y podar administran una ventana viva y se
    pierden con la sesión; la memoria vive fuera y está disponible en sesiones futuras. De
    ahí que muchos agentes de larga duración usen las tres cosas a la vez. Y sí consume
    tokens al recuperarse: leer una memoria es meter texto en la ventana."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-019
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En un agente gestionado con un almacén de memoria adjunto, ¿cómo interactúa el agente
    con él?
  options:
    - id: b
      text: Con herramientas dedicadas de recordar y olvidar
      rationale: "Con herramientas propias de recordar y olvidar, que es la interfaz natural para una memoria."
    - id: c
      text: Mediante una consulta semántica que devuelve los recuerdos más parecidos
      rationale: "Sería otra API que aprender; aquí la gracia es que no hace falta ninguna."
    - id: a
      text: Como un directorio montado en el sistema de ficheros del contenedor, usando las
        herramientas de fichero de siempre; no hay herramientas específicas de memoria
      rationale: "Encaja con un agente que ya sabe leer y escribir ficheros: no hay que enseñarle ninguna interfaz nueva."
    - id: d
      text: El sistema inyecta automáticamente los recuerdos relevantes en el contexto
      rationale: "El sistema inyecta solo lo relevante en el contexto, sin que el agente tenga que pedirlo."
  correct: a
  explanation: "El almacén se monta como un directorio y el agente lo lee y escribe con las
    herramientas de fichero normales (leer, escribir, editar, buscar): no hay API de memoria
    aparte. Lo que sí hace la plataforma es inyectar en el prompt de sistema una nota
    describiendo el montaje —nombre, ruta, instrucciones, permiso—, para que el agente sepa
    que existe sin que tengas que mencionarlo."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-020
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: Un almacén de memoria se puede adjuntar con permiso de solo lectura o de lectura y
    escritura. ¿Dónde se impone ese permiso?
  options:
    - id: b
      text: En el prompt de sistema, instruyendo al agente sobre lo que puede hacer
      rationale: "Deja la restricción en manos de que el modelo la respete, que es justo lo que un permiso no debe hacer."
    - id: a
      text: "En la API: las escrituras se rechazan al sincronizar de vuelta"
      rationale: "Llegaría tarde: el trabajo ya se habría hecho y solo se descartaría al final."
    - id: c
      text: En el modelo, que aprende del descriptor del almacén que no debe escribir
      rationale: "En el propio modelo, que lee el descriptor del almacén y respeta lo que dice."
    - id: d
      text: "En el sistema de ficheros: el montaje es de solo lectura, así que el agente no puede
        escribir aunque lo intente"
      rationale: "El permiso se aplica donde no depende de que nadie coopere: aunque el agente lo intente, la escritura no ocurre."
  correct: d
  explanation: "El permiso se impone en el montaje, a nivel de sistema de ficheros, que es lo
    que lo convierte en un control real y no en una petición: el agente puede intentar
    escribir y el sistema operativo se lo impide. Un permiso implementado en el prompt sería
    justamente el tipo de defensa blanda que una inyección puede rodear. Este patrón
    habilita el caso mixto: un almacén compartido de referencia en solo lectura más uno
    propio del usuario en lectura y escritura."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-021
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Dos procesos actualizan la misma nota de memoria a la vez y uno pisa al otro. ¿Qué
    mecanismo lo evita?
  options:
    - id: c
      text: "Una precondición sobre el hash del contenido en la actualización: si el contenido
        cambió desde que lo leíste, la llamada falla con conflicto y hay que releer y
        reintentar"
      rationale: "Es el patrón de siempre para actualizar sin bloqueos: se detecta el choque en vez de prevenirlo."
    - id: a
      text: Un bloqueo explícito sobre la nota antes de escribir
      rationale: "Un bloqueo tomado antes de escribir deja fuera al segundo hasta que el primero termine."
    - id: b
      text: Una cola de escrituras que serializa las actualizaciones
      rationale: "Una cola de escrituras ordena las actualizaciones y evita que se pisen."
    - id: d
      text: "Nada: la última escritura siempre gana por diseño"
      rationale: "Gana la última escritura: es el comportamiento por defecto y no hay nada que evitar."
  correct: c
  explanation: "Es concurrencia optimista: se lee la nota anotando el hash de su contenido, y
    al actualizar se envía como precondición. Si otro la cambió entre medias, el hash no
    coincide y la llamada devuelve conflicto en vez de pisar el trabajo ajeno; el patrón
    correcto es releer sobre el estado fresco y reintentar. No hace falta bloquear ni
    serializar, que son mecanismos más caros."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-022
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: Cada mutación de una memoria genera una versión inmutable. ¿Qué operación existe para
    un secreto que se escribió por error, y por qué no basta con borrar la memoria?
  options:
    - id: a
      text: "Ninguna: hay que borrar el almacén entero"
      rationale: "No hay operación parcial: el único borrado real es tirar el almacén completo."
    - id: b
      text: Redactar las versiones afectadas, que limpia el contenido conservando el rastro de
        auditoría (quién y cuándo); borrar la memoria actual no toca las instantáneas
        históricas, que siguen siendo legibles
      rationale: "El detalle que lo hace necesario: cada cambio dejó una copia, y borrar el presente no toca el pasado."
    - id: c
      text: Sobrescribir la memoria con contenido vacío, lo que invalida las versiones anteriores
      rationale: "Dejaría la copia vieja intacta y accesible con solo pedir esa versión."
    - id: d
      text: Rotar la clave del almacén, que hace ilegibles las versiones antiguas
      rationale: "Rotando la clave del almacén, lo escrito antes deja de poder leerse."
  correct: b
  explanation: "El versionado es lo que da auditoría y vuelta atrás, y es también lo que hace
    insuficiente el borrado: la instantánea con el secreto sigue ahí y se puede recuperar.
    La redacción existe justo para este caso —fugas, datos personales, peticiones de
    supresión—: vacía el contenido y preserva actor y marcas de tiempo. Sobrescribir crea
    una versión nueva y no anula las anteriores."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-023
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Al crear un almacén de memoria se le pone una descripción. ¿Para quién se escribe?
  options:
    - id: a
      text: Para el equipo, como documentación interna del recurso
      rationale: "Ese texto lo lee el modelo en cada sesión, no el equipo en el repositorio."
    - id: b
      text: Para el sistema de facturación, que agrupa por descripción
      rationale: "Para facturación, que agrupa el consumo por lo que declara cada recurso."
    - id: d
      text: "Para el modelo: es lo que le dice qué contiene el almacén y cuándo consultarlo, así
        que se redacta como una instrucción útil, no como documentación para humanos"
      rationale: "Se nota al escribirla: si suena a documentación de proyecto, el agente no sabrá cuándo mirar ahí."
    - id: c
      text: Para la interfaz de administración, donde se lista junto al nombre
      rationale: "Para la consola de administración, donde aparece junto al nombre del almacén."
  correct: d
  explanation: "La descripción se le pasa al agente, así que su público es el modelo:
    'preferencias del usuario y contexto de proyecto; consúltalo antes de empezar cualquier
    tarea' es útil, mientras que 'almacén creado por el equipo de plataforma en Q2' no le
    sirve de nada. Es el mismo criterio que con las descripciones de herramienta: decir
    cuándo usarlo, no solo qué es."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-024
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Por qué se recomienda una memoria por fichero pequeño en vez de un fichero grande con
    todo?
  options:
    - id: a
      text: Porque hay un límite de tamaño por memoria y un fichero grande no cabría
      rationale: "No es el tope lo que decide: aunque cupiera, seguiría siendo un bloque que hay que traer completo."
    - id: c
      text: Porque los ficheros grandes no se pueden versionar
      rationale: "Los ficheros grandes no se pueden versionar bien, y cada cambio duplicaría el contenido."
    - id: d
      text: Porque las herramientas de fichero no soportan búsqueda dentro de un fichero
      rationale: "Las herramientas de fichero no buscan dentro, así que un fichero grande es opaco."
    - id: b
      text: "Porque la memoria se lee para meterla en contexto: en ficheros pequeños y bien
        nombrados se puede cargar solo lo relevante, mientras que un fichero grande obliga a
        traerlo entero o a leerlo a trozos"
      rationale: "El fichero es la unidad de carga: lo que no se pueda cargar por separado, se acaba cargando entero."
  correct: b
  explanation: "La granularidad decide cuánto contexto cuesta consultar la memoria: con notas
    pequeñas, un nombre o una primera línea de resumen bastan para decidir si hace falta
    leerla. Con un fichero enorme, o lo traes entero (caro y ruidoso) o lo lees a trozos
    (frágil). El límite de tamaño por memoria existe, pero la razón de fondo es de
    recuperabilidad, no de cabida; y los ficheros grandes se versionan y se buscan igual."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-025
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Qué NO debería guardarse en la memoria de un agente?
  options:
    - id: c
      text: Credenciales y secretos —se reinyectan literalmente en cada contexto futuro—, y lo que
        el repositorio, el código o el historial ya registran, que solo añade ruido y se
        queda desactualizado
      rationale: "Dos motivos distintos: uno es un riesgo de seguridad, el otro solo ruido que envejece mal."
    - id: a
      text: Correcciones que el usuario ha hecho a su comportamiento
      rationale: "Las correcciones que ya te han hecho una vez son justo lo que no conviene repetir."
    - id: b
      text: Enfoques que resultaron correctos, porque solo se deben guardar los errores
      rationale: "Solo hay que guardar lo que salió mal; lo que funcionó no hace falta anotarlo."
    - id: d
      text: El motivo por el que una decisión se tomó así
      rationale: "El porqué de una decisión ocupa espacio y ya está implícito en lo que se hizo."
  correct: c
  explanation: "Dos criterios distintos. El de seguridad: un secreto en memoria se reproduce
    en todas las sesiones futuras que monten ese almacén. El de utilidad: duplicar lo que el
    repositorio ya dice crea una segunda fuente de verdad que se desincroniza y contamina el
    contexto. Lo que sí merece guardarse son las correcciones, los enfoques confirmados y el
    porqué: sin el motivo, una regla no se sabe cuándo deja de aplicar."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-026
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Un agente lleva meses escribiendo notas y su memoria contiene afirmaciones que ya no
    son ciertas (una API que cambió, un flag que se retiró). ¿Qué disciplina lo evita?
  options:
    - id: b
      text: Poner fecha a cada nota y descartar automáticamente las que superen cierta antigüedad
      rationale: "Fechar cada nota y jubilar automáticamente las viejas mantiene el conjunto al día sin esfuerzo."
    - id: d
      text: "Actualizar la nota existente en vez de crear una nueva, y borrar activamente lo que
        resulte falso: una memoria solo aditiva acumula contradicciones y deja de ser
        fiable"
      rationale: "Una memoria que solo crece termina contradiciéndose, y a partir de ahí el modelo elige al azar cuál se cree."
    - id: a
      text: Guardar cada observación como nota nueva y dejar que el modelo decida cuál vale
      rationale: "Guardar cada observación como nota nueva conserva el historial y deja que el modelo elija."
    - id: c
      text: Reconstruir la memoria desde cero cada trimestre
      rationale: "Reconstruirla desde cero cada trimestre garantiza que nada se quede rancio."
  correct: d
  explanation: "Una memoria que solo crece acaba conteniendo la afirmación y su contraria, y
    entonces el modelo elige la que recupera primero: es peor que no tener memoria, porque
    parece autoridad. La disciplina es actualizar en lugar de duplicar y borrar lo
    desmentido. Caducar por antigüedad descarta también lo que sigue siendo cierto —la
    mayoría—, y reconstruir desde cero tira el aprendizaje acumulado, que es todo el valor."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-027
  dimension: memoria-retrieval
  subtopic: capas-de-memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: Las capas de memoria tipo Mem0 o Zep suelen extraer hechos de la conversación y
    guardarlos, en vez de guardar la conversación entera. ¿Qué problema resuelve eso y qué
    problema nuevo introduce?
  options:
    - id: b
      text: Resuelve el coste de almacenamiento; no introduce problemas nuevos
      rationale: "Resuelve el coste de guardarlo todo, y no añade ningún problema que no hubiera antes."
    - id: c
      text: Resuelve el sesgo del modelo; introduce latencia en la escritura
      rationale: "Resuelve el sesgo del modelo al recordar, a cambio de tardar más al escribir."
    - id: a
      text: "Resuelve el volumen y la recuperabilidad (los hechos se consultan por separado, no
        hay que releer transcripciones); introduce el de la actualización: un hecho nuevo
        puede contradecir a uno guardado y hay que decidir cuál gana"
      rationale: "El coste se paga después: ya no hay una transcripción que mande, así que alguien tiene que decidir qué versión gana."
    - id: d
      text: Resuelve la privacidad; introduce dependencia de un tercero
      rationale: "Resuelve la privacidad al no guardar conversaciones, a cambio de depender de un tercero."
  correct: a
  explanation: "Guardar la transcripción entera hace la memoria inservible: releerla cuesta
    más contexto del que ahorra. Extraer hechos la hace consultable, pero abre el problema
    de fondo de toda memoria a largo plazo: la resolución de contradicciones. 'El usuario
    prefiere Python' seguido meses después de 'ahora trabaja en Go' obliga a decidir si se
    sustituye, se conserva con vigencia temporal o se marcan las dos. Ahí es donde se
    diferencian las implementaciones, y por eso algunas modelan la memoria como un grafo con
    validez temporal."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-028
  dimension: memoria-retrieval
  subtopic: capas-de-memoria
  difficulty: medium
  type: concepto
  roles: *a1
  stem: La oferta dice usar capas de memoria y vectoriales 'cuando el caso de uso lo
    requiera'. ¿Qué señal indica que SÍ hace falta memoria persistente?
  options:
    - id: b
      text: Que la aplicación tenga muchos usuarios
      rationale: "Con muchos usuarios hace falta guardar el estado de cada uno en algún sitio."
    - id: a
      text: Que el historial de conversación supere la ventana de contexto
      rationale: "Cuando el historial no cabe en la ventana hay que sacar parte fuera de la conversación."
    - id: d
      text: Que se quiera reducir el coste por consulta
      rationale: "Guardar lo recurrente evita reenviarlo en cada llamada y abarata la consulta."
    - id: c
      text: Que el usuario espere legítimamente que el sistema recuerde entre sesiones —sus
        preferencias, el estado de un trabajo largo, correcciones que ya hizo— y repetirlo
        cada vez sea el problema
      rationale: "El criterio es la expectativa del usuario, no el tamaño del historial: si le da igual, sobra la persistencia."
  correct: c
  explanation: "La señal es de producto: hay una expectativa de continuidad y no cumplirla es
    la queja. Un historial que no cabe se resuelve con compactación o poda, que son
    mecanismos dentro de la sesión y mucho más baratos que montar una capa de memoria. Y la
    memoria no abarata: añade lecturas, escrituras e infraestructura. Se pone porque hace
    falta continuidad, no por coste ni por escala."
  source: jd-codeway
  date: 2026-08-10
- id: mem-029
  dimension: memoria-retrieval
  subtopic: recursos-mcp
  difficulty: medium
  type: concepto
  roles: *a1
  stem: En MCP, ¿qué diferencia hay entre un recurso (resource) y una herramienta (tool)?
  options:
    - id: d
      text: El recurso es contexto y datos que aporta el servidor para que los use la aplicación o
        el modelo; la herramienta es una función que el modelo decide invocar. Cambia quién
        controla su uso
      rationale: "La diferencia práctica es quién dispara: uno lo trae tu aplicación cuando quiere, el otro lo pide el modelo cuando decide."
    - id: a
      text: El recurso es de solo lectura y la herramienta de escritura
      rationale: "Uno solo se puede leer y el otro puede además modificar cosas."
    - id: b
      text: El recurso se identifica por nombre y la herramienta por URI
      rationale: "Uno se identifica por un nombre y el otro por una dirección, y de ahí la diferencia."
    - id: c
      text: "Son equivalentes: cambia solo el método JSON-RPC"
      rationale: "Son lo mismo con distinto método de llamada en el protocolo."
  correct: d
  explanation: "La distinción es de control: las herramientas son 'controladas por el modelo'
    (él decide invocarlas según el contexto) y los recursos son contexto que la aplicación o
    el usuario deciden aportar. El recurso se direcciona por URI y la herramienta por nombre
    —justo al revés que en una de las opciones—, y aunque los recursos son de lectura, hay
    herramientas de solo lectura también: la lectura no es lo que los separa."
  source: externa:mcp-spec-2026-07-28
  date: 2026-08-10
- id: mem-030
  dimension: memoria-retrieval
  subtopic: evaluacion
  difficulty: hard
  type: escenario
  roles: *a2
  stem: Quieres saber si el cuello de botella de tu sistema con recuperación está en buscar o
    en generar. ¿Qué mides?
  options:
    - id: a
      text: La similitud media entre la consulta y los documentos recuperados
      rationale: "La similitud media entre consulta y documentos dice cómo de bien está apuntando la búsqueda."
    - id: b
      text: Por un lado, si el documento necesario está entre los k recuperados; por otro, la
        calidad de la respuesta DÁNDOLE a mano los documentos correctos. Si con contexto
        perfecto acierta, el cuello es la recuperación
      rationale: "Con el contexto correcto puesto a mano se aísla la generación: lo que quede fallando ya no es culpa de la búsqueda."
    - id: c
      text: El tiempo que tarda cada etapa
      rationale: "Comparando lo que tarda cada etapa se ve dónde está el cuello de botella."
    - id: d
      text: El número de tokens que aporta cada documento recuperado
      rationale: "Contando cuántos tokens aporta cada documento se ve cuál está pesando en la respuesta."
  correct: b
  explanation: "Una métrica de extremo a extremo no atribuye. Se descompone en dos mediciones
    independientes: la recuperación contra una referencia de qué documento hacía falta, y la
    generación con contexto perfecto (documentos correctos dados a mano). La combinación de
    resultados localiza el problema. La similitud media es una puntuación interna sin
    relación con acertar, y el tiempo y los tokens son otra dimensión."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-031
  dimension: memoria-retrieval
  subtopic: frescura
  difficulty: medium
  type: escenario
  roles: *a1
  stem: Tu índice se reconstruye cada noche y los usuarios preguntan por documentos publicados
    esa misma mañana. ¿Cuál es el arreglo estructural?
  options:
    - id: a
      text: Aumentar el número de fragmentos recuperados para compensar
      rationale: "Trayendo más fragmentos aumenta la probabilidad de que lo reciente aparezca."
    - id: b
      text: Advertir en el prompt de que la información puede tener hasta 24 horas de retraso
      rationale: "Avisar en el prompt del retraso evita que el modelo afirme cosas desactualizadas."
    - id: c
      text: Indexación incremental al publicar (o a intervalos cortos), en vez de una
        reconstrucción nocturna completa
      rationale: "El problema es la frecuencia, no el tamaño: cualquier arreglo que siga siendo por lotes deja la misma ventana ciega."
    - id: d
      text: Reconstruir el índice dos veces al día
      rationale: "Reconstruyendo dos veces al día se reduce a la mitad la ventana de desactualización."
  correct: c
  explanation: "El problema es de frescura y se ataca en la ingesta: indexar al publicar, o
    con una ventana corta, en vez de por lotes nocturnos. Recuperar más fragmentos no puede
    devolver lo que no está en el índice, avisar en el prompt gestiona la expectativa sin
    resolver nada, y duplicar la frecuencia reduce la ventana a la mitad manteniendo el
    mismo defecto de diseño."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-032
  dimension: memoria-retrieval
  subtopic: contexto
  difficulty: hard
  type: concepto
  roles: *a1
  stem: Con ventanas de contexto de un millón de tokens, ¿qué sentido tiene seguir recuperando?
  options:
    - id: a
      text: "Ninguno: con contexto suficiente la recuperación queda obsoleta"
      rationale: "Con espacio de sobra, meterlo todo evita el fallo de recuperación por completo."
    - id: b
      text: Solo tiene sentido para cumplir requisitos de trazabilidad de fuentes
      rationale: "Solo se mantiene por trazabilidad: hay que poder decir de dónde salió cada afirmación."
    - id: c
      text: Solo tiene sentido con modelos cuya ventana sea pequeña
      rationale: "Solo compensa cuando la ventana del modelo se queda pequeña para el material."
    - id: d
      text: Que el corpus casi siempre es mucho mayor que cualquier ventana, y aunque cupiera,
        meterlo entero cuesta dinero y latencia en cada consulta y diluye la atención.
        Recuperar es asignar el presupuesto de contexto
      rationale: "Aunque quepa, se paga entero en cada pregunta y la atención se reparte entre lo que importa y lo que no."
  correct: d
  explanation: "La ventana grande cambia el umbral, no el problema: corpus de gigabytes
    seguirán sin caber, y la parte que sí cabe se paga entera en cada consulta —en tokens,
    en latencia y en atención repartida—. La ventana grande sí desplaza la frontera de forma
    útil: corpus medianos que antes exigían pipeline ahora entran enteros y cacheados, que
    es justo el caso donde montar recuperación es sobreingeniería."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-033
  dimension: memoria-retrieval
  subtopic: ingenieria-de-contexto
  difficulty: medium
  type: concepto
  roles: *a1
  stem: Al montar el prompt con documentos recuperados, ¿qué decisión de colocación importa y
    por qué?
  options:
    - id: a
      text: "Que el material estable vaya delante y el volátil detrás: además de atender mejor a
        los extremos del contexto, así se preserva el prefijo cacheado"
      rationale: "Se paga en dinero: lo que va delante se puede cachear, y lo que cambia cada consulta invalida todo lo que tenga detrás."
    - id: b
      text: Que los documentos vayan siempre al final, después de la pregunta del usuario
      rationale: "Los documentos al final, justo antes de responder, para que sean lo último que el modelo lee."
    - id: c
      text: Que los documentos se ordenen alfabéticamente por título para que el modelo los
        localice
      rationale: "Ordenarlos por título da un criterio estable que el modelo puede seguir al citar."
    - id: d
      text: "Que da igual: el modelo procesa todo el contexto por igual"
      rationale: "El modelo procesa todo el contexto por igual, así que el orden no cambia el resultado."
  correct: a
  explanation: "La colocación tiene dos consecuencias a la vez. De calidad: la atención no es
    uniforme y el material sepultado en el medio se recupera peor. Y de coste: la caché es
    coincidencia de prefijo, así que lo que cambia en cada consulta tiene que ir DESPUÉS de
    lo estable, o invalida todo lo que va detrás. El orden alfabético no aporta nada, y que
    el modelo trate todo por igual es justamente lo que no ocurre."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-034
  dimension: memoria-retrieval
  subtopic: consultas
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Una técnica de expansión de consulta genera una respuesta hipotética a la pregunta y
    busca con el embedding de ESA respuesta en lugar del de la pregunta. ¿Cuál es la
    intuición?
  options:
    - id: b
      text: Que generar texto adicional aumenta la longitud de la consulta y con ello su señal
      rationale: "Con más texto en la consulta hay más señal, y el vector queda mejor definido."
    - id: c
      text: "Que una pregunta y un documento que la responde se parecen menos entre sí de lo que
        se parecen dos respuestas: el embedding de una respuesta hipotética cae más cerca
        del documento buscado"
      rationale: "Es un truco de simetría: se compara texto con texto en vez de pregunta con texto."
    - id: a
      text: Que el modelo puede recordar el documento correcto de su entrenamiento
      rationale: "El modelo puede tener el documento memorizado del entrenamiento y reproducirlo."
    - id: d
      text: Que así se elimina la necesidad de reordenar los resultados
      rationale: "Al buscar con algo tan parecido al documento, la ordenación posterior deja de hacer falta."
  correct: c
  explanation: "Es un desajuste de forma: '¿cuál es la política de devoluciones?' y el párrafo
    que la explica están redactados de maneras distintas, y la similitud en el espacio de
    embeddings lo nota. Una respuesta hipotética —aunque contenga errores factuales— tiene
    la forma y el vocabulario de lo que buscas, y por eso su vector cae más cerca. El coste
    es una llamada extra al modelo por consulta."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-035
  dimension: memoria-retrieval
  subtopic: troceado
  difficulty: medium
  type: escenario
  roles: *a2
  stem: Troceas manuales técnicos cortando cada 500 tokens sin mirar la estructura. ¿Qué
    problema aparece?
  options:
    - id: a
      text: Que el índice ocupa más espacio del necesario
      rationale: "Sin respetar la estructura salen más fragmentos, y el índice acaba ocupando de más."
    - id: b
      text: Que el cálculo de embeddings tarda más
      rationale: "Cortar sin mirar produce fragmentos irregulares que ralentizan el cálculo de vectores."
    - id: d
      text: Que los cortes caen en medio de tablas, listas de pasos o secciones, y producen
        fragmentos que por sí solos no significan nada o inducen a error
      rationale: "El daño no se ve al indexar sino al recuperar: llega media tabla sin cabecera y el modelo la interpreta igual."
    - id: c
      text: Que se generan fragmentos duplicados
      rationale: "Al no seguir la estructura, el mismo contenido acaba repetido en varios fragmentos."
  correct: d
  explanation: "El corte por longitud ignora que el documento tiene estructura: media tabla
    sin cabecera, tres pasos de un procedimiento de siete, una condición separada de su
    excepción. Ese fragmento se recupera y el modelo responde con información incompleta que
    parece completa. Se arregla troceando por límites estructurales (secciones, encabezados,
    bloques) y arrastrando la cabecera de sección a cada fragmento."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-036
  dimension: memoria-retrieval
  subtopic: capas-de-memoria
  difficulty: experto
  type: escenario
  roles: *a1
  stem: Diseñas la memoria de un asistente personal. ¿Qué distinción de tipos de memoria te
    ayuda a decidir dónde va cada cosa?
  options:
    - id: a
      text: "Separar por tamaño: lo corto en contexto y lo largo en la base vectorial"
      rationale: "Por tamaño: lo corto se lleva en contexto y lo largo se deja en el índice."
    - id: c
      text: "Separar por antigüedad: lo reciente en memoria caliente y lo viejo en fría"
      rationale: "Por antigüedad: lo reciente a mano y lo viejo en un almacén más lento."
    - id: d
      text: "No hace falta distinguir: una única colección de notas con buena búsqueda basta"
      rationale: "Con una sola colección bien indexada no hace falta clasificar nada."
    - id: b
      text: "Separar hechos estables sobre el usuario (preferencias, contexto), episodios
        concretos (qué pasó en tal sesión) y procedimientos (cómo se hace tal cosa aquí):
        tienen frecuencias de actualización, criterios de recuperación y vidas útiles
        distintos"
      rationale: "Hechos estables del usuario, episodios concretos y procedimientos: cada grupo se actualiza, se recupera y caduca de forma distinta."
  correct: b
  explanation: La distinción por tipo es la que produce decisiones de diseño distintas. Un
    hecho estable se consulta casi siempre y se ACTUALIZA cuando cambia; un episodio se
    consulta rara vez y por referencia temporal, y se archiva; un procedimiento se consulta
    al ejecutar cierta tarea y encaja mejor como skill que como nota. Separar por tamaño o
    por antigüedad es una decisión de almacenamiento que no dice nada sobre cuándo recuperar
    ni cómo actualizar.
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-037
  dimension: memoria-retrieval
  subtopic: diagramas
  difficulty: medium
  type: diagrama
  roles: *a2
  stem: |-
    Pipeline de recuperación de dos etapas:

        consulta ──► [búsqueda densa] ──┐
                 └─► [búsqueda léxica] ─┴──► (A) ──► top-50 ──► (B) ──► top-5 ──► contexto

    ¿Qué son (A) y (B)?
  options:
    - id: a
      text: (A) fusión de los dos rankings; (B) reordenación con un codificador cruzado
      rationale: "Primero se juntan los dos rankings en uno, y después un modelo más caro reordena a los mejores."
    - id: c
      text: (A) deduplicación de fragmentos; (B) troceado de los resultados
      rationale: "Primero se quitan los repetidos y luego se trocea lo que queda para que quepa."
    - id: b
      text: (A) reordenación; (B) fusión de rankings
      rationale: "Primero se reordena cada lista por su cuenta y después se combinan las dos."
    - id: d
      text: (A) filtrado por metadatos; (B) expansión de consulta
      rationale: "Primero se filtra por metadatos y luego se amplía la consulta con lo aprendido."
  correct: a
  explanation: "El orden importa: primero se fusionan los dos rankings en una lista de
    candidatos amplia, y después se reordena esa lista con un modelo caro y preciso para
    quedarse con los pocos que entran en el contexto. Al revés no tiene sentido —reordenar
    antes de fusionar significa pagar el reordenador dos veces sobre listas que luego se
    mezclan—. La deduplicación suele ir dentro o justo después de la fusión, y la expansión
    de consulta ocurre antes de buscar, no al final."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-038
  dimension: memoria-retrieval
  subtopic: indices
  difficulty: hard
  type: concepto
  roles: *a2
  stem: ¿Qué se gana y qué se pierde al cuantizar los vectores de un índice (guardarlos con
    menos precisión)?
  options:
    - id: a
      text: Se gana exhaustividad y se pierde velocidad
      rationale: "Se recuperan más vecinos correctos a cambio de tardar más en cada consulta."
    - id: d
      text: Se gana memoria y velocidad, con índices que caben donde antes no cabían; se pierde
        exactitud en las distancias, así que baja algo la exhaustividad y a veces hay que
        reordenar los candidatos con los vectores completos
      rationale: "Se cambia espacio por exactitud: los vecinos siguen saliendo, pero de vez en cuando en otro orden."
    - id: b
      text: Se gana precisión numérica y se pierde capacidad de almacenamiento
      rationale: "Se gana precisión en el cálculo a cambio de ocupar bastante más espacio."
    - id: c
      text: "No hay pérdida: la cuantización es una transformación reversible"
      rationale: "No se pierde nada: es una transformación de la que se puede volver."
  correct: d
  explanation: "La cuantización comprime con pérdida: las distancias calculadas sobre vectores
    comprimidos son aproximadas y algún vecino verdadero se cae del resultado. A cambio el
    índice ocupa una fracción y las comparaciones son más rápidas, lo que a menudo es la
    diferencia entre caber en memoria o no. El patrón habitual para recuperar calidad es
    buscar sobre los vectores comprimidos y reordenar los candidatos con los originales."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-039
  dimension: memoria-retrieval
  subtopic: contexto
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Qué es la edición de contexto en un agente de larga duración y qué se suele limpiar?
  options:
    - id: b
      text: Reescribir el prompt de sistema a medida que avanza la tarea
      rationale: "Eso cambia las instrucciones; aquí el problema es el peso de lo que ya ocurrió."
    - id: c
      text: Reordenar los mensajes para poner lo relevante al final
      rationale: "Reordenar los mensajes deja lo importante al final, que es donde mejor se atiende."
    - id: a
      text: Eliminar del historial material antiguo que ya no aporta —típicamente resultados de
        herramienta viejos y bloques de razonamiento—, en vez de resumirlo
      rationale: "Va de tirar, no de resumir: lo que ya cumplió su función deja de ocupar sitio en cada turno siguiente."
    - id: d
      text: Sustituir los documentos recuperados por sus resúmenes
      rationale: "Cambiar los documentos por sus resúmenes libera espacio conservando la idea."
  correct: a
  explanation: "La edición de contexto PODA: borra resultados de herramienta y bloques de
    razonamiento antiguos que ya cumplieron su función, y opcionalmente también los
    argumentos con que se llamó a la herramienta. Se distingue de la compactación, que
    RESUME el historial cuando te acercas al límite. Las dos operan dentro de una sesión y
    son complementarias."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-040
  dimension: memoria-retrieval
  subtopic: capas-de-memoria
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Un mismo agente sirve a varios usuarios. ¿Cómo se organiza la memoria?
  options:
    - id: a
      text: Un único almacén con el identificador de usuario como prefijo de las rutas
      rationale: "Un solo almacén con el identificador de usuario delante de cada ruta mantiene todo junto y ordenado."
    - id: b
      text: Un almacén por sesión, descartado al terminar
      rationale: "Un almacén por sesión, que se tira al terminar: nada sobrevive a lo que no debe."
    - id: d
      text: "Sin almacén: cada usuario aporta su contexto en el prompt inicial"
      rationale: "Sin almacén: cada usuario trae su contexto en el primer mensaje de la conversación."
    - id: c
      text: Un almacén por usuario (y opcionalmente uno compartido de referencia en solo lectura),
        adjuntando a cada sesión los que correspondan
      rationale: "El aislamiento se decide al montar, no al preguntar: cada sesión solo ve lo que se le adjuntó."
  correct: c
  explanation: "Separar por almacén hace el aislamiento estructural: la sesión de un usuario
    solo monta lo suyo y no hay forma de que llegue a lo ajeno, ni por error ni por
    inyección. Con un único almacén y rutas con prefijo, el aislamiento depende de que nada
    se equivoque de ruta. El patrón mixto es habitual: un almacén compartido de referencia
    en solo lectura más el personal en lectura y escritura. Un almacén por sesión no es
    memoria, y renunciar a ella devuelve el problema al usuario."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-041
  dimension: memoria-retrieval
  subtopic: consultas
  difficulty: medium
  type: concepto
  roles: *a2
  stem: ¿Para qué sirven los metadatos asociados a cada fragmento del índice?
  options:
    - id: b
      text: Para filtrar antes o durante la búsqueda por criterios exactos (fecha, tipo de
        documento, propietario, idioma) que la similitud semántica no sabe imponer
      rationale: "Cubren lo que el parecido no sabe hacer: fechas, propietarios y permisos no se aproximan, se cumplen o no."
    - id: a
      text: Para mejorar la calidad del embedding al concatenarlos con el texto
      rationale: "Concatenados al texto enriquecen el vector y mejoran la búsqueda semántica."
    - id: c
      text: Para deduplicar fragmentos idénticos
      rationale: "Sirven para detectar fragmentos idénticos y quedarse con una sola copia."
    - id: d
      text: Para calcular la puntuación de relevancia final
      rationale: "Entran en el cálculo de la puntuación final junto con la similitud."
  correct: b
  explanation: "La búsqueda vectorial no sabe de 'solo documentos vigentes' ni de 'solo de
    este departamento': eso son restricciones exactas y para eso están los metadatos. Además
    son la vía natural para imponer el aislamiento por inquilino. Concatenar metadatos al
    texto antes de embeber es una técnica distinta y bastante más frágil, porque contamina
    la señal semántica del fragmento."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-042
  dimension: memoria-retrieval
  subtopic: cuando-no
  difficulty: hard
  type: escenario
  roles: *a1
  stem: Un equipo propone montar una base vectorial para que el agente 'recuerde' la
    documentación de las APIs internas. ¿Qué alternativa conviene considerar antes?
  options:
    - id: b
      text: Meter toda la documentación en el prompt de sistema
      rationale: "Con la documentación entera en el prompt, el agente la tiene siempre delante."
    - id: a
      text: "Exponer esas APIs como herramientas con esquemas bien descritos: el agente no
        necesita recordar cómo se llaman, necesita poder llamarlas, y el esquema ya es la
        documentación que le hace falta"
      rationale: "Cambia la pregunta: no necesita saberse la documentación, necesita poder llamar y leer el error si falla."
    - id: c
      text: Afinar un modelo con la documentación interna
      rationale: "Ajustando un modelo con la documentación interna, el conocimiento queda dentro."
    - id: d
      text: Generar embeddings solo de los títulos de cada endpoint
      rationale: "Indexando solo los títulos se cubre el catálogo sin inflar el índice."
  correct: a
  explanation: "El diagnóstico está mal planteado: el problema no es de memoria, es de
    capacidad. Si el agente tiene que usar las APIs, lo que necesita son herramientas con
    nombres claros y descripciones que digan cuándo llamarlas —y para catálogos grandes,
    búsqueda de herramientas o carga diferida—. Una base vectorial de documentación le da
    texto sobre las APIs en vez de acceso a ellas, y encima con riesgo de recuperar el
    endpoint equivocado."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-043
  dimension: memoria-retrieval
  subtopic: evaluacion
  difficulty: hard
  type: concepto
  roles: *a2
  stem: Al construir la referencia para evaluar la recuperación, ¿cuál es la dificultad
    principal?
  options:
    - id: b
      text: Que las consultas hay que escribirlas a mano
      rationale: "Escribir las consultas a mano es lento y hace falta a alguien que conozca el dominio."
    - id: a
      text: Que el índice cambia y hay que reetiquetar en cada reconstrucción
      rationale: "Cada vez que se reconstruye el índice hay que revisar las etiquetas otra vez."
    - id: d
      text: Que hay que decidir qué documentos son relevantes para cada consulta, y a menudo hay
        varios parcialmente relevantes en vez de uno correcto
      rationale: "Ahí se rompe la idea de una respuesta única: con varios documentos medio válidos, la nota depende de dónde pongas el corte."
    - id: c
      text: Que las métricas de recuperación requieren un conjunto muy grande
      rationale: "Las métricas de recuperación necesitan muestras grandes para significar algo."
  correct: d
  explanation: "La relevancia rara vez es binaria: para una pregunta pueden servir tres
    documentos con distinto grado, y anotarlo bien es caro y subjetivo (por eso conviene
    medir el acuerdo entre anotadores). Un atajo práctico es la anotación por juicios sobre
    lo recuperado más un conjunto pequeño y muy cuidado. Cambiar el índice no obliga a
    reetiquetar si las etiquetas están sobre documentos y no sobre fragmentos, que es otra
    razón para etiquetar a nivel de documento."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-044
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: medium
  type: concepto
  roles: *a1
  stem: La herramienta de memoria del lado cliente define operaciones sobre un directorio de
    memorias. ¿Quién implementa el almacenamiento?
  options:
    - id: a
      text: El proveedor del modelo, que persiste las memorias asociadas a tu clave
      rationale: "El proveedor del modelo las guarda asociadas a tu cuenta y las sirve cuando hacen falta."
    - id: b
      text: El SDK, que las guarda en un fichero local por defecto
      rationale: "El SDK las persiste en local, con un fichero por defecto que se puede cambiar."
    - id: d
      text: El propio modelo, que las mantiene en su estado interno entre llamadas
      rationale: "Si lo mantuviera el modelo, no haría falta ninguna herramienta ni ningún almacén."
    - id: c
      text: "Tú: es una herramienta ejecutada en el cliente, el modelo emite las operaciones y tu
        código las lleva a cabo sobre el backend que decidas"
      rationale: "Es una herramienta como cualquier otra: el modelo emite la operación y quien la cumple eres tú."
  correct: c
  explanation: "Es una herramienta definida por el proveedor pero ejecutada por el cliente: el
    modelo emite operaciones (ver, crear, reemplazar, insertar, borrar, renombrar) y tu
    implementación decide dónde y cómo se guardan. Eso te da el control —y la
    responsabilidad— del aislamiento por usuario y del control de acceso, que las
    implementaciones de referencia no traen. El modelo no guarda nada entre llamadas: la API
    no tiene estado."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-045
  dimension: memoria-retrieval
  subtopic: ingenieria-de-contexto
  difficulty: experto
  type: escenario
  roles: *a1
  stem: Un agente de larga duración degrada su calidad según avanza la sesión, aunque no llega
    al límite de contexto. ¿Qué hipótesis investigas?
  options:
    - id: d
      text: Que el contexto se ha llenado de material que ya no aporta —resultados de herramienta
        viejos, caminos abandonados, correcciones intermedias— y compite con lo relevante;
        se ataca podando lo obsoleto y consolidando lo aprendido, no solo esperando a que se
        compacte
      rationale: "Lo llamativo es que ocurre sin llenar la ventana: el problema es la proporción de ruido, no el total."
    - id: a
      text: Que el modelo se fatiga y hay que reiniciar la sesión periódicamente
      rationale: "El modelo se cansa a lo largo de la sesión y conviene reiniciarla cada cierto tiempo."
    - id: b
      text: Que la caché de prompts devuelve contenido obsoleto
      rationale: "La caché devuelve contenido de hace varios turnos y el modelo trabaja con material caducado."
    - id: c
      text: Que el nivel de esfuerzo baja automáticamente en sesiones largas
      rationale: "El esfuerzo se reduce solo en sesiones largas para contener el gasto."
  correct: d
  explanation: "La degradación viene de la acumulación: un historial largo lleno de intentos
    fallidos, volcados que ya se usaron y estados intermedios diluye la atención y a veces
    empuja al modelo a repetir caminos abandonados. Se ataca con edición de contexto para lo
    obsoleto y consolidando lo aprendido en un sitio recuperable (memoria o notas), no
    esperando a que la compactación resuma sin criterio. El modelo no se fatiga, la caché no
    devuelve contenido viejo (una entrada obsoleta sencillamente no se acierta) y el
    esfuerzo no baja solo."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-046
  dimension: memoria-retrieval
  subtopic: embeddings
  difficulty: medium
  type: concepto
  roles: *a2
  stem: ¿Por qué un embedding puede fallar al distinguir 'la política SÍ permite X' de 'la
    política NO permite X'?
  options:
    - id: a
      text: Porque las palabras de negación se eliminan al tokenizar
      rationale: "Las palabras de negación se pierden al tokenizar, y el vector queda igual con y sin ellas."
    - id: b
      text: Porque los embeddings capturan sobre todo el tema y el vocabulario, y una negación
        cambia poco la superficie del texto aunque invierta el significado
      rationale: "Dos frases opuestas comparten casi todas las palabras, así que caen juntas en el espacio."
    - id: c
      text: Porque los embeddings solo se calculan sobre sustantivos y verbos
      rationale: "Solo se representan las palabras con carga semántica, y las de función se ignoran."
    - id: d
      text: Porque la similitud coseno ignora el orden de las palabras
      rationale: "La similitud no mira el orden, así que dos frases con las mismas palabras salen iguales."
  correct: b
  explanation: "Las dos frases comparten casi todo el vocabulario y el tema, así que sus
    vectores quedan muy próximos pese a decir lo contrario. Es un límite conocido de la
    recuperación densa y una razón para no dejar que el fragmento recuperado sea la última
    palabra: reordenar con un modelo que mira consulta y documento juntos, o hacer que el
    modelo cite el texto exacto, ayudan a que la negación sobreviva. Ni se eliminan las
    negaciones al tokenizar ni se embeben solo sustantivos."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-047
  dimension: memoria-retrieval
  subtopic: memoria
  difficulty: hard
  type: concepto
  roles: *a1
  stem: ¿Por qué conviene poner un resumen en la primera línea de cada nota de memoria?
  options:
    - id: a
      text: Porque el formato lo exige para poder versionar la nota
      rationale: "El formato lo exige para poder llevar el control de versiones de la nota."
    - id: b
      text: Porque mejora el embedding de la nota al concentrar la señal al principio
      rationale: "El vector se calcula sobre el texto entero, así que la posición dentro no cambia gran cosa."
    - id: c
      text: "Porque permite decidir si la nota es relevante sin cargarla entera: al listar, con
        nombre y primera línea se filtra, y solo se leen las que hacen falta"
      rationale: "Convierte el listado en un índice: se decide qué abrir sin gastar contexto en abrirlo."
    - id: d
      text: Porque las herramientas de fichero solo leen la primera línea por defecto
      rationale: "Leen lo que se les pida; el problema es decidir qué merece la pena leer."
  correct: c
  explanation: "Es economía de contexto: leer una nota cuesta tokens, así que hace falta un
    modo barato de decidir si merece la pena. Nombre descriptivo más resumen en la primera
    línea convierten un listado en un índice consultable. Sin eso, o el agente lee todas las
    notas (caro y ruidoso) o no lee ninguna y la memoria no sirve de nada."
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-048
  dimension: memoria-retrieval
  subtopic: cuando-no
  difficulty: medium
  type: concepto
  roles: *a1
  stem: ¿Cuándo NO es la recuperación la herramienta adecuada?
  options:
    - id: a
      text: Cuando el corpus supera el millón de documentos
      rationale: "A partir de cierto tamaño de corpus, la búsqueda deja de dar resultados fiables."
    - id: c
      text: Cuando los documentos cambian con frecuencia
      rationale: "Si los documentos cambian a menudo, el índice va siempre por detrás de la realidad."
    - id: d
      text: Cuando los usuarios hacen preguntas en varios idiomas
      rationale: "Con preguntas en varios idiomas la búsqueda pierde precisión y conviene otra vía."
    - id: b
      text: Cuando la pregunta necesita agregación o cálculo exacto sobre datos estructurados,
        cuando el corpus cabe entero en contexto, o cuando lo que hace falta es actuar sobre
        un sistema y no leer sobre él
      rationale: "Tres casos con la misma raíz: no hay nada que buscar, o lo que hace falta no se resuelve leyendo."
  correct: b
  explanation: "Los tres casos donde otra cosa gana: agregar o calcular sobre datos
    estructurados (eso es una consulta), corpus pequeño y estable (cabe entero y cacheado,
    sin modo de fallo de recuperación), y necesidad de actuar (eso es una herramienta). Los
    corpus grandes, los documentos que cambian a menudo y el multiidioma son precisamente
    escenarios donde la recuperación es la respuesta correcta, con la ingesta y los modelos
    adecuados."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-049
  dimension: memoria-retrieval
  subtopic: indices
  difficulty: medium
  type: concepto
  roles: *a2
  stem: ¿Qué caracteriza a una base de datos vectorial frente a usar una biblioteca de índices
    en memoria?
  options:
    - id: d
      text: Que aporta persistencia, actualizaciones incrementales, filtrado por metadatos,
        control de acceso y operación en producción; el índice en memoria resuelve solo la
        búsqueda por similitud
      rationale: "Lo que separa a las dos no es el algoritmo de búsqueda, que suele ser el mismo, sino todo lo que hay alrededor."
    - id: a
      text: Que usa algoritmos de búsqueda aproximada distintos y más precisos
      rationale: "Usa algoritmos de búsqueda aproximada propios y más afinados que los de una librería."
    - id: b
      text: Que soporta dimensiones más altas
      rationale: "Aguanta vectores de dimensión mucho mayor sin degradarse."
    - id: c
      text: Que calcula los embeddings además de indexarlos
      rationale: "Se encarga también de calcular los vectores, no solo de guardarlos."
  correct: d
  explanation: "Por debajo suelen usar los mismos algoritmos de búsqueda aproximada; lo que
    añade el producto es todo lo demás: persistir, insertar y borrar sin reconstruir,
    filtrar por metadatos, aislar por espacios de nombres, autorizar, replicar y
    monitorizar. Por eso la decisión no es de calidad de búsqueda sino de operación: para un
    prototipo con un corpus fijo, un índice en memoria basta."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-050
  dimension: memoria-retrieval
  subtopic: criterio
  difficulty: easy
  type: concepto
  roles: *a1
  stem: Ante un requisito de 'que el asistente recuerde cosas', ¿cuál es el primer paso?
  options:
    - id: c
      text: Elegir la capa de memoria (Mem0, Zep u otra) y montarla
      rationale: "Elegir ya la capa de memoria y montarla: es la pieza que resuelve el requisito."
    - id: a
      text: "Concretar QUÉ tiene que recordar, durante cuánto tiempo y quién puede verlo: de esas
        tres respuestas sale si hace falta memoria persistente, gestión de contexto dentro
        de la sesión o simplemente pedir el dato una vez y guardarlo en el perfil del
        usuario"
      rationale: "Sin esas tres respuestas se acaba montando infraestructura para un problema que a veces se resuelve con un campo en el perfil."
    - id: b
      text: Medir cuántos tokens ocupa el historial medio de conversación
      rationale: "Medir cuánto ocupa el historial medio dice si el problema es de espacio o de otra cosa."
    - id: d
      text: Montar una base vectorial con el historial de conversaciones
      rationale: "Indexar el historial de conversaciones deja todo lo hablado disponible para buscar."
  correct: a
  explanation: "'Que recuerde' es un síntoma, no un requisito. Muchas veces lo que hace falta
    es un campo en el perfil del usuario, no una capa de memoria: recordar el idioma
    preferido es una columna en una tabla. Concretar qué, cuánto tiempo y quién puede verlo
    decide entre esas opciones y además fija de entrada las cuestiones de privacidad y
    aislamiento, que son las caras de arreglar después."
  source: jd-codeway
  date: 2026-08-10
- id: mem-051
  dimension: memoria-retrieval
  subtopic: fundamentos
  difficulty: easy
  type: concepto
  roles: &a4
    - Applied AI Engineer
    - AI Engineer
  stem: ¿Qué hace un sistema de recuperación aumentada (RAG) que no hace el modelo por sí solo?
  options:
    - id: b
      text: Modifica los pesos del modelo para que aprenda tus documentos
      rationale: "Ajusta los pesos para que el modelo aprenda tus documentos y los tenga dentro."
    - id: c
      text: Amplía la ventana de contexto del modelo
      rationale: "Amplía la ventana disponible para que quepa más material en cada llamada."
    - id: a
      text: Le da al modelo, en el momento de responder, fragmentos concretos de tus datos que no
        estaban en su entrenamiento
      rationale: "El modelo no aprende nada nuevo: se le pone delante en el momento justo lo que le falta."
    - id: d
      text: Comprueba que la respuesta del modelo es correcta
      rationale: "Comprueba la respuesta contra las fuentes antes de devolverla."
  correct: a
  explanation: "La idea es sustituir 'lo que el modelo recuerda' por 'lo que le pones
    delante': se busca lo relevante y se le entrega en el prompt. No toca los pesos (eso es
    afinado), no cambia el tamaño de la ventana y no verifica nada por sí mismo, aunque al
    aportar la fuente permite que la respuesta se pueda comprobar."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-052
  dimension: memoria-retrieval
  subtopic: fundamentos
  difficulty: easy
  type: concepto
  roles: *a4
  stem: ¿Por qué hay que trocear los documentos antes de indexarlos?
  options:
    - id: a
      text: Porque los modelos de embeddings solo aceptan textos de menos de 100 palabras
      rationale: "Los modelos de vectores tienen un tope corto de entrada y un documento no cabe."
    - id: c
      text: Porque así se reduce el coste de almacenamiento del índice
      rationale: "Con fragmentos, el índice guarda menos y ocupa bastante menos espacio."
    - id: d
      text: Porque el orden de los párrafos afecta al resultado de la búsqueda
      rationale: "El orden de los párrafos influye en la búsqueda, y trocear lo neutraliza."
    - id: b
      text: Porque un documento entero produce un único vector que promedia todos sus temas y deja
        de apuntar a ninguno en concreto, además de no caber bien en el contexto
      rationale: "Un solo vector para veinte páginas queda a media distancia de todo y cerca de nada."
  correct: b
  explanation: "Un vector por documento largo es una media de todo lo que trata: se parece un
    poco a muchas consultas y mucho a ninguna. Trocear devuelve especificidad a cada vector
    y además permite meter en el contexto solo la parte que hace falta. Los modelos de
    embeddings aceptan textos bastante largos, y trocear aumenta el tamaño del índice en vez
    de reducirlo."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-053
  dimension: memoria-retrieval
  subtopic: fundamentos
  difficulty: easy
  type: concepto
  roles: *a4
  stem: En un sistema con recuperación, ¿qué significa que el modelo 'alucine' pese a tener
    los documentos delante?
  options:
    - id: c
      text: Que afirma cosas que los documentos recuperados no dicen, ya sea porque no estaban ahí
        o porque el modelo rellenó los huecos con lo que le sonaba
      rationale: "Es el fallo que sobrevive a tener buen buscador: el material está, y aun así la frase no sale de ahí."
    - id: a
      text: Que el sistema recuperó documentos que no venían a cuento
      rationale: "Que lo recuperado no venía a cuento y la respuesta se construyó sobre material equivocado."
    - id: b
      text: Que la respuesta contradice el prompt de sistema
      rationale: "Que la respuesta va en contra de lo que el prompt de sistema le había fijado."
    - id: d
      text: Que el modelo cita documentos con formato incorrecto
      rationale: "Que las citas salen con un formato que no corresponde a las fuentes reales."
  correct: c
  explanation: "Conviene separar los dos fallos porque se arreglan de forma distinta:
    recuperar mal es un problema de la etapa de búsqueda, y afirmar lo que la fuente no dice
    es un problema de fidelidad de la generación. Un sistema puede recuperar perfectamente y
    aun así inventarse el detalle que faltaba, y por eso se miden por separado."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-054
  dimension: memoria-retrieval
  subtopic: indices
  difficulty: experto
  type: escenario
  roles:
    - Applied AI Engineer
    - AI Engineer
    - ML Engineer
  stem: Tu índice funciona bien en pruebas y en producción la exhaustividad cae, con la misma
    configuración y el mismo modelo de embeddings. El corpus ha crecido de 50.000 a 5
    millones de fragmentos. ¿Qué explica la caída?
  options:
    - id: a
      text: Los embeddings pierden capacidad discriminativa al crecer el corpus y hay que subir la
        dimensión
      rationale: "Con un corpus mucho mayor los vectores discriminan peor y hace falta más dimensión."
    - id: d
      text: "Los parámetros de la búsqueda aproximada que bastaban con 50.000 vectores exploran
        una fracción mucho menor del espacio con 5 millones: el compromiso
        exhaustividad-latencia se desplaza con el tamaño y hay que recalibrarlo, no
        heredarlo"
      rationale: "Lo que cambió no es la calidad de nada, es la escala: la misma configuración explora una fracción cien veces menor."
    - id: b
      text: El índice se ha fragmentado y hay que reconstruirlo desde cero
      rationale: "El índice se ha ido fragmentando con las altas y conviene reconstruirlo entero."
    - id: c
      text: Con más documentos hay más duplicados y ocupan los primeros puestos
      rationale: "Los duplicados molestan, pero explicarían resultados repetidos, no vecinos que dejan de aparecer."
  correct: d
  explanation: "Los parámetros de un índice aproximado no son absolutos: definen cuánto se
    explora, y lo que era una porción generosa del espacio con 50.000 vectores es una
    rendija con 5 millones. Por eso la exhaustividad medida en un corpus pequeño no se
    transfiere, y hay que volver a medirla y recalibrar (asumiendo más latencia o más
    recursos). Los embeddings no cambian de calidad por el tamaño del corpus, y los
    duplicados son un problema real pero independiente y visible al inspeccionar
    resultados."
  source: externa:practica-industria
  date: 2026-08-10
- id: mem-055
  dimension: memoria-retrieval
  subtopic: ingenieria-de-contexto
  difficulty: experto
  type: escenario
  roles: &a5
    - Applied AI Engineer
    - AI Engineer
    - Agent Engineer
  stem: Un agente con recuperación cachea el prefijo del prompt para abaratar. Alguien propone
    meter los documentos recuperados justo detrás del prompt de sistema, antes del
    historial. ¿Qué consecuencia tiene?
  options:
    - id: a
      text: "Ninguna: el prefijo cacheado es el prompt de sistema y sigue intacto"
      rationale: "El prefijo cacheado es el prompt de sistema, y ese no se toca al añadir documentos detrás."
    - id: c
      text: Mejora la caché, porque los documentos recuperados se repiten entre consultas
        parecidas
      rationale: "Solo coincidirían si la consulta fuera idéntica; con una palabra distinta cambia el bloque entero."
    - id: b
      text: "Destruye la caché en cada turno: los documentos cambian con cada consulta, así que
        todo lo que va detrás —el historial entero— deja de coincidir y se reprocesa a
        precio completo"
      rationale: "Lo que decide es el orden: cualquier cosa variable colocada delante arrastra a todo lo que venga detrás."
    - id: d
      text: Solo afecta a la latencia del primer token, no al coste
      rationale: "Solo se nota en lo que tarda la primera palabra; el coste se mantiene igual."
  correct: b
  explanation: La caché es coincidencia de prefijo, así que lo que decide no es si el prompt
    de sistema cambia sino qué hay ANTES de cada punto de corte. Insertar contenido volátil
    entre lo estable y el historial invalida el historial completo en cada turno, que en un
    agente largo es justo el tramo grande. Lo correcto es colocar lo variable después de lo
    estable, aunque intuitivamente parezca que 'el contexto va arriba'.
  source: externa:anthropic-docs
  date: 2026-08-10
- id: mem-056
  dimension: memoria-retrieval
  subtopic: capas-de-memoria
  difficulty: experto
  type: escenario
  roles: *a5
  stem: Una memoria extraída de conversaciones guarda 'el usuario prefiere Python'. Meses
    después el usuario dice que ahora trabaja en Go. ¿Qué política de actualización es la
    más defendible?
  options:
    - id: c
      text: Sustituir el hecho antiguo por el nuevo, porque la información reciente siempre manda
      rationale: "Sustituir el dato viejo por el nuevo: lo último que dijo el usuario es lo que vale."
    - id: b
      text: Guardar los dos y dejar que la búsqueda semántica decida cuál recupera
      rationale: "Guardar los dos y dejar que la búsqueda recupere el que encaje con la pregunta."
    - id: d
      text: No guardar preferencias que puedan cambiar
      rationale: "No guardar preferencias que puedan cambiar evita el problema desde el principio."
    - id: a
      text: "Registrar el hecho nuevo con su momento y marcar el anterior como superado,
        conservando la traza: sustituir a ciegas pierde información útil (a veces la
        preferencia vieja sigue aplicando en otro contexto) y guardar los dos sin vigencia
        deja al modelo eligiendo al azar"
      rationale: "Deja las dos versiones distinguibles: una vale hoy y la otra explica lo que se decidió cuando aún valía."
  correct: a
  explanation: "La resolución de contradicciones es el problema de fondo de toda memoria a
    largo plazo, y las dos salidas simples fallan: guardar ambos sin vigencia hace que el
    modelo recupere una u otra según la consulta —memoria que se contradice a sí misma—, y
    sustituir sin traza borra contexto que a veces importa (puede seguir prefiriendo Python
    para scripts). Modelar la validez temporal es lo que permite responder 'ahora Go, antes
    Python' en vez de una de las dos a ciegas. Por eso algunas implementaciones representan
    la memoria como un grafo con vigencias."
  source: externa:practica-industria
  date: 2026-08-10
